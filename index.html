<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>THE WISE OAK TREE</title>
<meta name="description" content="A very goofy pixel-art game about a four-hundred-year-old oak tree who has seen everything. Talk to him. Collect everything. Find every ending.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌳</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <div id="caption" class="hidden"></div>
  <div id="halllabel" class="hidden"></div>
</div>

<!-- The only DOM in the game besides the canvas. It is transparent and sits
     under the drawn talk box; it exists to raise a keyboard and collect
     keystrokes, which are then redrawn in the game's own 5x7 pixel font. -->
<input id="typing" type="text" autocomplete="off" autocapitalize="sentences"
       autocorrect="off" spellcheck="false" maxlength="400" aria-label="say something">

<script src="js/font.js"></script>
<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
</body>
</html>
