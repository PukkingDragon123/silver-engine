<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>THE WISE OAK TREE</title>
<meta name="description" content="A very goofy pixel-art game about a four-hundred-year-old oak tree who has seen everything. Talk to him. Collect everything. Find every ending.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌳</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <div id="caption" class="hidden"></div>
  <div id="halllabel" class="hidden"></div>
</div>

<div id="endingcard" class="hidden"></div>

<div id="modal" class="hidden">
  <div class="modalbox">
    <div class="paneltop"><span id="modaltitle">TROPHY ROOM</span><button id="modalclose">&times;</button></div>
    <div id="modalbody"></div>
  </div>
</div>

<div id="bag" class="panel hidden">
  <div class="paneltop">YOUR BACKPACK <button id="bagclose">&times;</button></div>
  <div id="bagbody"></div>
  <div class="panelfoot">found, not bought. nobody here sells anything any more.</div>
</div>

<div id="chat" class="panel hidden">
  <div class="paneltop"><span id="chatwho">TALKING TO NOC</span> <button id="chatclose">&times;</button></div>
  <div id="chatlog"></div>
  <div id="chatbar">
    <input id="chatinput" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false"
           placeholder="say something to Noc…" maxlength="400">
    <button id="chatsend">SAY</button>
  </div>
  <div class="panelfoot" id="chatfoot">type anything &middot; /help for the odd commands</div>
</div>

<div id="post" class="hidden">
  <div class="scroll">
    <div class="rod top"><i class="knob l"></i><i class="knob r"></i><i class="seal"></i></div>
    <div class="sheet" id="sheet"><div id="postbody"></div></div>
    <div class="rod bot"><i class="knob l"></i><i class="knob r"></i>
      <button id="postclose" title="roll it back up">&times;</button></div>
  </div>
</div>

<div id="settings" class="panel hidden">
  <div class="paneltop">THE SQUIRREL'S SETTINGS <button id="setclose">&times;</button></div>
  <div id="setbody"></div>
  <div class="panelfoot">he kept the gear off a lawnmower in 1998</div>
</div>

<script src="js/font.js"></script>
<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
</body>
</html>
