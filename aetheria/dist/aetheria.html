        const nv = lerp(v, target, 1 - Math.pow(0.0008, dt));
        if (nv < .002 && target === 0) press.delete(k); else press.set(k, nv);
      }
      for (let i=toasts.length-1;i>=0;i--) { toasts[i].t += dt; if (toasts[i].t > toasts[i].life) toasts.splice(i,1); }
      if (!Input.down) held = null;
    },
    toast(msg, col, icon) { toasts.unshift({ msg, col:col||P.white, icon, t:0, life:2.1 }); if (toasts.length > 4) toasts.pop(); },

    /* --- the workhorse ---------------------------------------------------- */
    btn(c, x, y, w, h, label, opt) {
      opt = opt || {};
      const k = id(x,y,label||opt.key||'b');
      const r = rect(x,y,w,h);
      const over = hit(r, Input.x, Input.y);
      if (over && Input.justDown && !opt.disabled) { held = k; press.set(k,.4); SFX.play('tap'); }
      const p = press.get(k) || 0;
      const lift = opt.disabled ? 0 : Math.round(4*(1-p));
      const base = opt.col || P.green2, face = opt.col2 || shade(base,.35);
      const dim = opt.disabled ? .45 : 1;
      c.globalAlpha = dim;
      pbox(c, x-1, y-1+ (4-lift), w+2, h+2+lift, P.ink, 4);            /* skirt */
      pbox(c, x, y+(4-lift), w, h, shade(base,-.25), 3);
      pbox(c, x, y+(4-lift), w, h-3, face, 3);
      c.fillStyle = shade(face,.35); c.fillRect(x+3, y+(4-lift)+1, w-6, 1);
      if (opt.glow) {
        c.globalAlpha = dim * (.25+.25*Math.sin(time*6));
        pbox(c, x-2, y-2+(4-lift), w+4, h+4, opt.glow, 5); c.globalAlpha = dim;
      }
      const ty = y + (4-lift) + Math.round((h-3-7*(opt.scale||1))/2);
      let tx = x + w/2;
      if (opt.icon) {
        const iw = 12*(opt.iscale||1);
        const total = iw + 3 + tw(label||'', opt.scale||1);
        tx = x + w/2 + iw/2 + 2;
        spr(c, opt.icon, x + w/2 - total/2, ty + (7*(opt.scale||1))/2 - 6*(opt.iscale||1), { scale:opt.iscale||1 });
      }
      if (label) ctxt(c, tx, ty, label, opt.txt || P.white, opt.scale||1, opt.shadow===false?null:rgba(P.ink,.7));
      c.globalAlpha = 1;
      const clicked = over && Input.justUp && held === k && !opt.disabled;
      if (clicked) { held = null; if (opt.sound !== false) SFX.play(opt.sound || 'tap'); }
      return clicked;
    },

    /* a button whose label is a whole sentence — used for every answer */
    btnWrap(c, x, y, w, h, label, opt) {
      opt = opt || {};
      const k = id(x,y,(opt.key||'') + label);
      const r = rect(x,y,w,h);
      const over = hit(r, Input.x, Input.y);
      if (over && Input.justDown && !opt.disabled) { held = k; press.set(k,.4); SFX.play('tap'); }
      const p = press.get(k) || 0;
      const lift = opt.disabled ? 0 : Math.round(4*(1-p));
      const base = opt.col || '#3a2a5e', face = opt.col2 || '#5a4790';
      c.globalAlpha = opt.disabled ? .5 : 1;
      pbox(c, x-1, y-1+(4-lift), w+2, h+2+lift, P.ink, 4);
      pbox(c, x, y+(4-lift), w, h, shade(base,-.25), 3);
      pbox(c, x, y+(4-lift), w, h-3, face, 3);
      c.fillStyle = shade(face,.32); c.fillRect(x+3, y+(4-lift)+1, w-6, 1);
      ctext(c, x+w/2, y+(4-lift)+(h-3)/2, label, w-16, h-14, opt.txt || P.white, rgba(P.ink,.7), opt.maxScale || 2);
      c.globalAlpha = 1;
      const clicked = over && Input.justUp && held === k && !opt.disabled;
      if (clicked) { held = null; SFX.play('tap'); }
      return clicked;
    },

    /* a bare tappable area (sprites, map nodes, buildings) */
    zone(x,y,w,h,key) {
      const k = id(x,y,key||'z');
      const r = rect(x,y,w,h), over = hit(r, Input.x, Input.y);
      if (over && Input.justDown) { held = k; }
      return { over, down: held === k, click: over && Input.justUp && held === k };
    },

    /* --- chrome ---------------------------------------------------------- */
    back(c, label) {
      return api.btn(c, 8, 8, 44, 24, label || '<', { col:'#4a3a70', col2:'#6b56a0', scale:1 });
    },
    topBar(c, opt) {
      opt = opt || {};
      const h = 26;
      pbox(c, -2, -2, VW+4, h+2, rgba(P.ink,.88), 3);
      hline(c, 0, h, VW, rgba(P.purple,.55));
      const items = opt.items || [['i_coin', S.d.coins], ['i_wood', Math.floor(S.d.wood)],
                                  ['i_stone', Math.floor(S.d.stone)], ['i_essence', Math.floor(S.d.essence)]];
      let x = 6;
      for (const [ic,val] of items) {
        spr(c, ic, x, 7, { scale:1 });
        const s = commas(val);
        txt(c, x+13, 10, s, P.white, 1, P.shadow);
        x += 15 + tw(s,1) + 9;
      }
      /* rank chip on the right */
      const rk = S.rank(), lbl = rk.name + ' ' + S.d.trophies;
      const bw = tw(lbl,1) + 20;
      pbox(c, VW-bw-6, 4, bw, 18, rgba(rk.col,.22), 3);
      pbox(c, VW-bw-6, 4, bw, 18, 'rgba(0,0,0,0)', 3);
      spr(c, 'i_trophy', VW-bw-2, 7);
      txt(c, VW-bw+11, 10, lbl, rk.col, 1, P.shadow);
      return h;
    },
    levelChip(c, x, y) {
      const need = S.xpNeed(S.d.lvl), f = S.d.xp/need;
      panel(c, x, y, 96, 22, '#2e1b50');
      txt(c, x+5, y+4, 'LV ' + S.d.lvl, P.gold, 1, P.shadow);
      bar(c, x+5, y+14, 86, 4, f, P.cyan, { shine:time*.6 });
      return 22;
    },
    stars(c, cx, y, n, max, s) {
      s = Math.max(1, Math.round(s || 1)); max = max || 3;   /* whole pixels only */
      const step = 12*s + 1;
      for (let i=0;i<max;i++) {
        const x = cx - (max*step)/2 + i*step + step/2;
        if (i < n) spr(c, 'i_star', x, y, { center:true, scale:s });
        else { c.globalAlpha = .28; spr(c, 'i_star', x, y, { center:true, scale:s, tint:'#000' }); c.globalAlpha = 1; }
      }
    },
    /* scrolling banner used on every screen header */
    header(c, y, title, sub, col) {
      pbox(c, 12, y, VW-24, sub ? 34 : 24, rgba(P.ink,.8), 3);
      ctxt(c, VW/2, y+5, title, col || P.gold, 2, P.shadow);
      if (sub) ctxt(c, VW/2, y+22, sub, P.grey, 1);
    },
    drawToasts(c) {
      for (let i=0;i<toasts.length;i++) {
        const t = toasts[i];
        const k = t.t/t.life;
        const slide = k < .12 ? ease.back(k/.12) : 1;
        const a = k > .78 ? 1-(k-.78)/.22 : 1;
        const w = tw(t.msg,1) + 22 + (t.icon?14:0);
        const x = VW/2 - w/2, y = 58 + i*22 - (1-slide)*20;
        c.globalAlpha = a;
        panel(c, x, y, w, 18, '#2e1b50');
        if (t.icon) spr(c, t.icon, x+5, y+3);
        txt(c, x + (t.icon?20:11), y+6, t.msg, t.col, 1, P.shadow);
        c.globalAlpha = 1;
      }
    },

    /* --- battle-style card ------------------------------------------------ */
    card(c, x, y, w, h, opt) {
      opt = opt || {};
      const el = CONTENT.ELEM[opt.el || 'arcane'];
      const tilt = opt.tilt || 0;
      c.save();
      c.translate(Math.round(x+w/2), Math.round(y+h/2));
      if (tilt) c.rotate(tilt);
      if (opt.scale && opt.scale !== 1) c.scale(opt.scale, opt.scale);
      c.translate(-Math.round(w/2), -Math.round(h/2));
      pbox(c, -2, -2, w+4, h+4, P.ink, 4);
      pbox(c, 0, 0, w, h, shade(el.col2,-.35), 3);
      pbox(c, 2, 2, w-4, h-4, el.col2, 2);
      pbox(c, 2, 2, w-4, Math.round(h*.44), shade(el.col,.1), 2);
      /* corner pips */
      c.fillStyle = shade(el.col,.5); c.fillRect(3,3,3,1); c.fillRect(3,3,1,3);
      c.fillRect(w-6,h-4,3,1); c.fillRect(w-4,h-6,1,3);
      if (opt.dim) { c.globalAlpha = .55; c.fillStyle = P.shadow; c.fillRect(0,0,w,h); c.globalAlpha = 1; }
      c.restore();
    },
    get time() { return time; }
  };
  return api;
})();
</script>
<script>
/* =========================================================================
   GAME — canvas, input, scene stack, main loop.

   The canvas is exactly 360x640 device pixels and CSS blows it up with
   image-rendering:pixelated, so a game pixel is always a clean square and
   nothing is ever half a pixel anywhere.
   ========================================================================= */
const Input = {
  x:-99, y:-99, down:false, justDown:false, justUp:false,
  startX:0, startY:0, dx:0, dy:0, moved:0, downT:0,
  swipeX:0, swipeY:0, swiped:false, wheel:0
};

const Game = (() => {
  const cv = document.getElementById('screen');
  const c = cv.getContext('2d');
  cv.width = VW; cv.height = VH;
  c.imageSmoothingEnabled = false;

  const scenes = {};
  let cur = null, curName = '', pending = null, trans = 0, transDir = 0, t = 0, last = 0, running = false;
  let fpsAcc = 0, fpsN = 0, fps = 60;

  /* ---- fit the canvas into whatever window it is given ------------------ */
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.min(vw/VW, vh/VH);
    /* prefer whole-number scaling when there is room; it is sharper */
    const si = Math.floor(s);
    const use = (si >= 1 && s - si < 0.34) ? si : s;
    cv.style.width  = Math.round(VW*use) + 'px';
    cv.style.height = Math.round(VH*use) + 'px';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  /* ---- input ------------------------------------------------------------ */
  function toVirt(e) {
    const r = cv.getBoundingClientRect();
    return [ (e.clientX - r.left) / r.width * VW, (e.clientY - r.top) / r.height * VH ];
  }
  let queueDown = false, queueUp = false;
  function onDown(e) {
    const [x,y] = toVirt(e);
    Input.x = x; Input.y = y; Input.startX = x; Input.startY = y;
    Input.dx = 0; Input.dy = 0; Input.moved = 0; Input.downT = t;
    queueDown = true; Input.down = true;
    SFX.unlock();
    if (e.cancelable) e.preventDefault();
  }
  function onMove(e) {
    const [x,y] = toVirt(e);
    if (Input.down) { Input.dx = x - Input.startX; Input.dy = y - Input.startY;
                      Input.moved += dist(Input.x,Input.y,x,y); }
    Input.x = x; Input.y = y;
    if (e.cancelable && Input.down) e.preventDefault();
  }
  function onUp(e) {
    if (!Input.down) return;
    queueUp = true; Input.down = false;
    const dt = t - Input.downT;
    if (dt < .45 && Math.abs(Input.dx) > 26 && Math.abs(Input.dx) > Math.abs(Input.dy)) {
      Input.swipeX = Math.sign(Input.dx); Input.swiped = true;
    } else if (dt < .45 && Math.abs(Input.dy) > 26) { Input.swipeY = Math.sign(Input.dy); Input.swiped = true; }
    if (e && e.cancelable) e.preventDefault();
  }
  cv.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('wheel', e => { Input.wheel += Math.sign(e.deltaY); }, { passive:true });
  window.addEventListener('keydown', e => {
    if (cur && cur.key) cur.key(e.key);
    if (e.key === 'Escape' && cur && cur.back) cur.back();
  });

  /* ---- transition wipe: a grid of squares that snaps shut and opens ------ */
  function drawWipe(k, col) {
    const cell = 20, cols = Math.ceil(VW/cell), rows = Math.ceil(VH/cell);
    c.fillStyle = col || P.ink;
    for (let j=0;j<rows;j++) for (let i=0;i<cols;i++) {
      const d = (i + j*0.6) / (cols + rows*0.6);
      const local = clamp((k - d*0.42) / 0.58, 0, 1);
      const s = Math.ceil(cell * ease.out(local));
      if (s > 0) c.fillRect(i*cell + (cell-s)/2, j*cell + (cell-s)/2, s, s);
    }
  }

  const api = {
    get ctx() { return c; },
    get t() { return t; },
    get fps() { return fps; },
    get sceneName() { return curName; },
    register(name, obj) { scenes[name] = obj; },
    scene(name) { return scenes[name]; },

    go(name, data, instant) {
      if (instant) { swap(name, data); return; }
      pending = { name, data }; transDir = 1; trans = 0;
    },
    /* scenes call this for a full-screen modal-ish push (chest, results) */
    peek() { return curName; },

    start() {
      if (running) return; running = true;
      resize(); SFX.unlock(); SFX.toggle(S.d.sound); SFX.music(true);
      const bonus = S.checkDay();
      swap(S.d.made ? 'island' : 'creator', bonus ? { dailyBonus:bonus } : null);
      last = performance.now();
      requestAnimationFrame(loop);
    }
  };

  function swap(name, data) {
    if (cur && cur.exit) cur.exit();
    FX.clear();
    cur = scenes[name]; curName = name;
    Input.justDown = Input.justUp = false; Input.swiped = false;
    if (cur && cur.enter) cur.enter(data || {});
  }

  function loop(now) {
    let dt = (now - last)/1000; last = now;
    if (dt > .12) dt = .12;
    t += dt;
    fpsAcc += dt; fpsN++;
    if (fpsAcc > .5) { fps = Math.round(fpsN/fpsAcc); fpsAcc = 0; fpsN = 0; }

    Input.justDown = queueDown; Input.justUp = queueUp;
    queueDown = queueUp = false;

    const sdt = dt * FX.timeScale;
    UI.frame(dt);
    S.tickBuildings();

    if (cur && cur.update) cur.update(sdt);
    FX.update(sdt);

    c.save();
    const [sx,sy] = FX.shakeOffset();
    c.translate(sx,sy);
    if (cur && cur.draw) cur.draw(c, sdt); else { c.fillStyle = P.ink; c.fillRect(0,0,VW,VH); }
    c.restore();

    FX.drawFlash(c);
    UI.drawToasts(c);

    /* transitions */
    if (transDir) {
      trans += dt * 2.6;
      if (transDir === 1) {
        drawWipe(clamp(trans,0,1));
        if (trans >= 1) { swap(pending.name, pending.data); pending = null; transDir = -1; trans = 0; }
      } else {
        drawWipe(1 - clamp(trans,0,1));
        if (trans >= 1) { transDir = 0; trans = 0; }
      }
    }

    Input.swiped = false; Input.swipeX = 0; Input.swipeY = 0; Input.wheel = 0;
    requestAnimationFrame(loop);
  }

  return api;
})();

/* the one bit of DOM: the boot card, which also unlocks audio */
(() => {
  const boot = document.getElementById('boot'), btn = document.getElementById('bstart');
  const go = () => { boot.classList.add('gone'); setTimeout(() => boot.remove(), 500); Game.start(); };
  btn.addEventListener('click', go);
  btn.addEventListener('touchend', e => { e.preventDefault(); go(); });
})();
</script>
<script>
/* =========================================================================
   CREATOR — you arrive on a small island with nothing and decide who you
   are. Four tabs, live preview, and a keyboard made of pixels.
   ========================================================================= */
Game.register('creator', (() => {
  let t = 0, tab = 0, cfg, name, bob, petals = 0, entered = 0;
  const TABS = ['YOU','HAIR','FIT','NAME'];
  const GENDERS = [
    { k:'girl', label:'GIRL',  body:0, hair:1 },
    { k:'boy',  label:'BOY',   body:1, hair:0 },
    { k:'them', label:'THEM',  body:0, hair:4 }
  ];
  const KEYS = ['ABCDEFG','HIJKLMN','OPQRSTU','VWXYZ_'];

  /* a row of colour chips; returns the index tapped, or -1 */
  function swatches(c, x, y, cols, size, list, sel, key) {
    let picked = -1;
    for (let i=0;i<list.length;i++) {
      const cx = x + (i % cols) * (size+4), cy = y + Math.floor(i/cols) * (size+4);
      const z = UI.zone(cx, cy, size, size, key+i);
      const on = i === sel;
      const lift = z.down ? 2 : 0;
      pbox(c, cx-1, cy-1+lift, size+2, size+2, on ? P.gold : P.ink, 2);
      pbox(c, cx, cy+lift, size, size, list[i], 2);
      c.fillStyle = shade(list[i], .4); c.fillRect(cx+1, cy+1+lift, size-2, 1);
      c.fillStyle = shade(list[i], -.3); c.fillRect(cx+1, cy+size-2+lift, size-2, 1);
      if (on) { c.fillStyle = P.white; c.fillRect(cx+size/2-1, cy-4, 2, 2); }
      if (z.click) { picked = i; SFX.play('tap'); FX.stars(cx+size/2, cy+size/2, 5, list[i]); }
    }
    return picked;
  }
  function chips(c, x, y, w, labels, sel, key, perRow) {
    perRow = perRow || labels.length;
    let picked = -1;
    const cw = Math.floor((w - (perRow-1)*5) / perRow);
    for (let i=0;i<labels.length;i++) {
      const cx = x + (i%perRow)*(cw+5), cy = y + Math.floor(i/perRow)*27;
      const on = i === sel;
      if (UI.btn(c, cx, cy, cw, 22, labels[i],
                 { col: on ? '#b3600f' : '#3a2a5e', col2: on ? P.gold : '#5a4790',
                   txt: on ? P.ink : P.white, key:key+i })) picked = i;
    }
    return picked;
  }

  return {
    enter() {
      t = 0; tab = 0; entered = 0;
      cfg = Object.assign(AV.defaults(), S.d.cfg);
      name = S.d.made ? S.d.name : '';
      bob = 0;
      SFX.music(true);
    },
    update(dt) { t += dt; petals += dt; entered = Math.min(1, entered + dt*1.6); },

    draw(c) {
      /* --- backdrop: a lone island in a warm sky ------------------------ */
      drawSky(c, t, { top:'#5b2f9e', mid:'#c05fb0', bot:'#ffd0a8', sunX:252, sunY:62,
                      cloudLayers:[[.18,.5,140,.45],[.4,.8,220,.6]] });
      for (let i=0;i<3;i++) {
        const x = 46 + i*128, y = 112 + (i%2)*34 + Math.sin(t*.5+i)*4;
        drawFloatIsland(c, x, y, 40+i*8, { seed:i+4, depth:26, vines:true });
        drawTree(c, x, y, .5, i+9);
      }
      const gy = 286 + Math.sin(t*.7)*2;
      drawFloatIsland(c, VW/2, gy, 190, { seed:11, depth:52, grassH:9 });
      drawTree(c, VW/2-72, gy+3, 1.1, 3, { fruit:P.red });
      drawBush(c, VW/2+68, gy+4, 1, 6);
      drawRock(c, VW/2+84, gy+5, .8, 7);
      spr(c, 'flower', VW/2-30, gy-4, { scale:1 });
      spr(c, 'flower2', VW/2+34, gy-3, { scale:1 });
      spr(c, 'mushroom', VW/2+12, gy-6);

      /* petals drifting past */
      if (petals > .25) { petals = 0; FX.leaves(rnd(0,VW), -8, 1); }

      /* --- the star of the show ---------------------------------------- */
      const anim = Math.floor(t*3) % 2;
      const pose = tab === 3 ? 'wave' : (Math.floor(t) % 7 === 6 ? 'dance' : 'idle');
      const pf = pose === 'wave' ? anim : anim;
      const sc = 3;
      const ay = gy - 4 + Math.sin(t*2.2)*2;
      /* glow puddle */
      c.globalAlpha = .25; pxEllipse(c, VW/2, ay, 34, 10, P.gold); c.globalAlpha = 1;
      AV.draw(c, VW/2, ay, cfg, pose, pf, { scale:sc });
      if (Math.random() < .08) FX.stars(VW/2 + rnd(-30,30), ay - rnd(10,70), 1, P.gold);

      /* --- title -------------------------------------------------------- */
      const slide = ease.back(entered);
      c.save(); c.translate(0, (1-slide)*-60);
      ctxt(c, VW/2, 14, 'WHO ARE YOU?', P.white, 2, P.ink);
      ctxt(c, VW/2, 32, 'the sky is waiting', rgba(P.white,.8), 1, P.ink);
      c.restore();

      /* --- tabs --------------------------------------------------------- */
      const tabY = 318, tw2 = 80;
      for (let i=0;i<TABS.length;i++) {
        const x = 8 + i*(tw2+4);
        if (UI.btn(c, x, tabY, tw2, 22, TABS[i],
                   { col: tab===i ? '#6a27c8' : '#2e1b50', col2: tab===i ? P.purple : '#3f2a68',
                     txt: tab===i ? P.white : P.grey })) { tab = i; }
      }

      /* --- panel -------------------------------------------------------- */
      const py = 344, ph = 236;
      panel(c, 8, py, VW-16, ph, rgba('#1b1030',.92), { r:4 });

      if (tab === 0) {
        ctxt(c, VW/2, py+8, 'PICK YOUR LOOK', P.gold, 1);
        const gi = GENDERS.findIndex(g => g.k === (cfg.gender||'girl'));
        const g = chips(c, 18, py+20, VW-36, GENDERS.map(x=>x.label), gi < 0 ? 0 : gi, 'gen');
        if (g >= 0) { cfg.gender = GENDERS[g].k; cfg.body = GENDERS[g].body;
                      if (!cfg.touchedHair) cfg.hair = GENDERS[g].hair; SFX.play('power'); }
        ctxt(c, VW/2, py+56, 'SKIN', P.grey, 1);
        const sk = swatches(c, 38, py+70, 6, 36, AV.SKINS, cfg.skin, 'sk');
        if (sk >= 0) cfg.skin = sk;
        ctxt(c, VW/2, py+120, 'BUILD', P.grey, 1);
        const b = chips(c, 60, py+134, VW-120, ['SLIM','SOLID'], cfg.body, 'bd');
        if (b >= 0) cfg.body = b;
      } else if (tab === 1) {
        ctxt(c, VW/2, py+8, 'HAIR STYLE', P.gold, 1);
        const h = chips(c, 18, py+20, VW-36, AV.STYLES.map(s=>s.toUpperCase()), cfg.hair, 'hs', 3);
        if (h >= 0) { cfg.hair = h; cfg.touchedHair = 1; }
        ctxt(c, VW/2, py+90, 'HAIR COLOUR', P.gold, 1);
        const hc = swatches(c, 22, py+104, 6, 48, AV.HAIRS, cfg.hairCol, 'hc');
        if (hc >= 0) cfg.hairCol = hc;
      } else if (tab === 2) {
        ctxt(c, VW/2, py+8, 'SHIRT', P.gold, 1);
        const tp = chips(c, 18, py+20, VW-36, ['PLAIN','STRIPE','HOODIE'], cfg.top, 'tp');
        if (tp >= 0) cfg.top = tp;
        const sc2 = swatches(c, 32, py+52, 5, 48, AV.SHIRTS, cfg.shirtCol, 'sc');
        if (sc2 >= 0) cfg.shirtCol = sc2;
        ctxt(c, VW/2, py+118, 'TROUSERS', P.gold, 1);
        const pc = swatches(c, 62, py+132, 6, 36, AV.PANTS, cfg.pants, 'pc');
        if (pc >= 0) cfg.pants = pc;
      } else {
        ctxt(c, VW/2, py+6, 'YOUR NAME', P.gold, 1);
        panel(c, 60, py+18, VW-120, 22, '#2e1b50');
        const shown = name || '';
        ctxt(c, VW/2, py+25, shown + (Math.floor(t*2)%2 ? '_' : ' '), P.white, 2);
        let ky = py+46;
        for (let r=0;r<KEYS.length;r++) {
          const row = KEYS[r], kw = 40, gap = 3;
          const total = row.length*kw + (row.length-1)*gap;
          for (let i=0;i<row.length;i++) {
            const ch = row[i];
            if (UI.btn(c, VW/2-total/2 + i*(kw+gap), ky, kw, 22, ch === '_' ? '-' : ch,
                       { col:'#3a2a5e', col2:'#5a4790', key:'k'+r+i })) {
              if (name.length < 9) { name += ch === '_' ? ' ' : ch; SFX.play('tap'); }
            }
          }
          ky += 25;
        }
        if (UI.btn(c, 22, py+172, 66, 22, 'DEL', { col:'#8a2a3a', col2:P.red })) name = name.slice(0,-1);
        if (UI.btn(c, VW-88, py+172, 66, 22, 'CLEAR', { col:'#8a2a3a', col2:P.red })) name = '';
      }

      /* --- bottom actions ------------------------------------------------ */
      if (UI.btn(c, 12, 592, 104, 30, 'SURPRISE', { col:'#6a27c8', col2:P.purple, scale:1 })) {
        const g = pick(GENDERS);
        cfg = Object.assign(AV.randomCfg(), { gender:g.k, body:g.body, touchedHair:1 });
        SFX.play('power'); FX.stars(VW/2, gy-40, 14);
      }
      const ready = (name.trim().length > 0) || tab !== 3;
      if (UI.btn(c, 126, 592, VW-138, 30, S.d.made ? 'SAVE LOOK' : 'ENTER AETHERIA',
                 { col:'#1a7331', col2:'#3fe07a', glow:P.gold, scale:1, disabled:!ready })) {
        S.d.cfg = cfg;
        S.d.name = (name.trim() || 'SCHOLAR').toUpperCase();
        S.d.made = true;
        S.save();
        SFX.play('levelup');
        FX.confetti(VW/2, 300, 60);
        Game.go('island', { welcome:true });
      }
      if (S.d.made && UI.btn(c, 8, 8, 44, 24, '<', { col:'#4a3a70', col2:'#6b56a0' })) Game.go('island');
    }
  };
})());
</script>
<script>
/* =========================================================================
   ISLAND — the main menu, which is not a menu. It is a place you live on.

   Your character wanders about on their own, naps, dances, gets rained on
   by leaves. Buildings quietly produce while you are gone and put a bubble
   over their head when they have something for you. Everything else in the
   game is reached by walking up to it or by the bar along the bottom.
   ========================================================================= */
Game.register('island', (() => {
  let t = 0, popup = null, hero, pet, spawnT = 0, welcome = 0, camShift = 0;

  const ICX = 180, ICY = 368, IRX = 156, IRY = 64;   /* the grass disc */
  const CX = 180, CY = 370, RX = 128, RY = 50;       /* where feet may go */
  /* things further back are drawn smaller — cheap, convincing depth */
  const depthScale = y => 0.95 + clamp((y - (ICY-IRY)) / (IRY*2), 0, 1) * 0.38;
  const inside = (x,y) => ((x-CX)/RX)**2 + ((y-CY)/RY)**2 <= 1;
  function randomSpot() {
    for (let i=0;i<30;i++) {
      const a = rnd(0,TAU), r = Math.sqrt(Math.random());
      const x = CX + Math.cos(a)*RX*r*.92, y = CY + Math.sin(a)*RY*r*.92;
      if (inside(x,y)) return [x,y];
    }
    return [CX,CY];
  }

  /* --- the little person, who has opinions about what to do next -------- */
  function newHero() {
    return { x:CX, y:CY+10, tx:CX, ty:CY+10, st:'idle', timer:2, f:0, ft:0, flip:false, z:0, zz:0 };
  }
  function heroThink() {
    const roll = Math.random();
    if (roll < .42)      { const [x,y] = randomSpot(); hero.tx = x; hero.ty = y; hero.st = 'walk'; hero.timer = 8; }
    else if (roll < .58) { hero.st = 'idle';  hero.timer = rnd(1.6,3.4); }
    else if (roll < .70) { hero.st = 'dance'; hero.timer = rnd(2.5,5); SFX.play('pop'); }
    else if (roll < .80) { hero.st = 'sit';   hero.timer = rnd(3,6); }
    else if (roll < .88) { hero.st = 'cheer'; hero.timer = rnd(1,2); }
    else                 { hero.st = 'sleep'; hero.timer = rnd(4,9); }
  }
  function heroUpdate(dt) {
    hero.ft += dt;
    hero.timer -= dt;
    if (hero.st === 'walk') {
      const d = dist(hero.x,hero.y,hero.tx,hero.ty);
      if (d < 2 || hero.timer <= 0) { hero.st = 'idle'; hero.timer = rnd(1,2.4); }
      else {
        const sp = 26*dt;
        hero.flip = hero.tx < hero.x;
        hero.x += (hero.tx-hero.x)/d*sp; hero.y += (hero.ty-hero.y)/d*sp;
        if (Math.floor(hero.ft*7) !== Math.floor((hero.ft-dt)*7)) {
          hero.f = (hero.f+1)%4;
          if (hero.f % 2 === 0) { FX.dust(hero.x, hero.y, 2); SFX.play('step'); }
        }
      }
    } else if (hero.timer <= 0) heroThink();
    if (hero.st !== 'walk') { if (hero.ft % .34 < dt) hero.f = (hero.f+1)%2; }
    if (hero.st === 'sleep') { hero.zz += dt; if (hero.zz > .9) { hero.zz = 0;
      FX.float(hero.x+10, hero.y-20, 'z', rgba(P.white,.9), { life:1.6, vy:-16 }); } }
    /* the pet trots along behind */
    if (pet) {
      const tx = hero.x + (hero.flip ? 16 : -16), ty = hero.y + 4;
      const d = dist(pet.x,pet.y,tx,ty);
      if (d > 3) { pet.x += (tx-pet.x)*Math.min(1,dt*2.4); pet.y += (ty-pet.y)*Math.min(1,dt*2.4); pet.flip = tx < pet.x; }
      pet.bob = Math.sin(t*6)*2;
    }
  }

  /* --- buildings -------------------------------------------------------- */
  function buildingAt(i) { return S.d.buildings.find(b => b.plot === i); }

  /* the choppable tree and the mineable rock */
  const CHOP = { x:58, y:344 }, MINE = { x:308, y:400 };

  function drawIslandBody(c) {
    drawPlateau(c, ICX, ICY, IRX, IRY, 208, { seed:21 });
    /* a pond at the back, spilling off the front rim as a waterfall */
    const pxx = 244, pyy = 340;
    pxEllipse(c, pxx, pyy+1, 25, 10, '#1a3f8f');
    pxEllipse(c, pxx, pyy, 24, 9, '#2358c9');
    pxEllipse(c, pxx, pyy-1, 22, 7, '#49a7ff');
    c.fillStyle = rgba('#b6ecff',.75);
    for (let i=0;i<4;i++) {
      const w = 9 + i*3, yy = pyy - 4 + i*3;
      c.fillRect(Math.round(pxx - w/2 + Math.sin(t*1.5+i)*3), Math.round(yy), w, 1);
    }
    c.fillStyle = '#49a7ff';
    for (let i=0;i<24;i++) c.fillRect(Math.round(246+Math.sin(i*.5)*2), 348+i*2, 2, 2);
    drawWaterfall(c, 244, 396, 7, 150, t);
    /* the scenery, seeded so nothing ever shuffles */
    drawTree(c, CHOP.x, CHOP.y, 1.15, 31, { fruit:P.red });
    drawTree(c, 306, 336, .8, 32);
    drawBush(c, 132, 322, .8, 33);
    drawBush(c, 198, 320, .7, 34);
    for (let i=0;i<11;i++) {
      const r = srnd(60+i), a = r()*TAU, rr = Math.sqrt(r());
      const x = ICX + Math.cos(a)*IRX*rr*.88, y = ICY + Math.sin(a)*IRY*rr*.88;
      spr(c, r() > .5 ? 'flower' : 'flower2', x, y, { scale:1 });
    }
    spr(c, 'mushroom', 146, 404); spr(c, 'mushroom', 212, 416);
    spr(c, 'crystal', 86, 386);
  }

  return {
    enter(data) {
      t = 0; popup = null; welcome = data && data.welcome ? 2.4 : 0;
      hero = newHero();
      const p = S.pet();
      pet = p ? { x:CX-16, y:CY+4, flip:false, bob:0, def:S.petDef(p) } : null;
      SFX.music(true);
      if (data && data.dailyBonus) UI.toast('DAY ' + S.d.dayStreak + ' +' + data.dailyBonus, P.gold, 'i_coin');
      if (!S.d.seenIntro) {
        S.d.seenIntro = true; S.save();
        setTimeout(() => UI.toast('tap ADVENTURE to start climbing', P.gold, 'i_star'), 2400);
        setTimeout(() => UI.toast('this island is yours — build on the + plots', P.lime, 'i_wood'), 4600);
      }
      S.tickBuildings();
    },
    exit() { popup = null; },
    back() { if (popup) popup = null; },

    update(dt) {
      t += dt;
      if (welcome > 0) welcome -= dt;
      if (!popup) heroUpdate(dt);
      spawnT += dt;
      if (spawnT > 1.6) { spawnT = 0; if (Math.random() < .5) FX.leaves(rnd(30,330), 270, 1); }
      camShift = Math.sin(t*.35)*2;
    },

    draw(c) {
      const hour = new Date().getHours();
      const night = hour >= 20 || hour < 6, dusk = hour >= 17 && hour < 20, dawn = hour >= 6 && hour < 8;
      drawSky(c, t, night ? { top:'#160b34', mid:'#2e1b50', bot:'#5b3a8e', sun:false, stars:true,
                              cloudLayers:[[.2,.5,150,.25],[.42,.8,230,.3]] }
                  : dusk ? { top:'#3b1e6e', mid:'#c05fb0', bot:'#ffb27a', sunX:52, sunY:150 }
                  : dawn ? { top:'#6c7fd8', mid:'#ffb0c8', bot:'#ffe9a8', sunX:300, sunY:140 }
                         : { top:'#2c7ff0', mid:'#6cc8ff', bot:'#b6ecff' });

      /* distant islands = the other lesson worlds, drifting */
      const packs = S.unlockedPacks();
      for (let i=0;i<packs.length;i++) {
        const p = packs[i].pack;
        const x = 30 + ((i*67 + t*3) % (VW+70)) - 35;
        const y = 120 + Math.sin(t*.4+i*1.3)*7 + (i%3)*22;
        c.globalAlpha = packs[i].open ? .85 : .4;
        drawFloatIsland(c, x, y, 30, { seed:i+2, depth:20, vines:false,
          grass: packs[i].open ? p.col : '#6b789c', grass2: packs[i].open ? p.col2 : '#434f74' });
        if (packs[i].open) spr(c, p.icon, x, y-8, { center:true });
        c.globalAlpha = 1;
      }

      c.save(); c.translate(0, camShift);
      drawIslandBody(c);

      /* --- everything that stands on the ground, sorted back to front --- */
      const items = [];
      for (let i=0;i<PLOTS.length;i++) {
        const b = buildingAt(i);
        items.push({ y: PLOTS[i].y, kind: b ? 'b' : 'plot', b, plot:i, x:PLOTS[i].x });
      }
      items.push({ y: hero.y, kind:'hero', x:hero.x });
      if (pet) items.push({ y: pet.y+1, kind:'pet', x:pet.x });
      if (S.d.chests.length) items.push({ y: 414, kind:'chest', x:276 });
      items.push({ y: MINE.y, kind:'mine', x:MINE.x });
      items.sort((a,b) => a.y - b.y);

      let tapped = null;
      for (const it of items) {
        if (it.kind === 'b') {
          const r = drawBuilding(c, it.b.type, it.x, it.y, it.b.lvl, t, depthScale(it.y));
          const z = UI.zone(r.x, r.y, r.w, r.h, 'b'+it.plot);
          if (z.over) { c.globalAlpha = .2; pbox(c, r.x-2, r.y-2, r.w+4, r.h+4, P.white, 3); c.globalAlpha = 1; }
          if (z.click && !popup) tapped = { type:'building', b:it.b };
          /* resource bubble */
          const def = BUILDINGS[it.b.type];
          if (def.res && Math.floor(it.b.stock||0) >= 1) {
            const by = r.y - 16 + Math.sin(t*3 + it.plot)*2;
            const full = (it.b.stock||0) >= S.prodCap(it.b) - .01;
            pbox(c, it.x-11, by-9, 22, 18, full ? P.gold : P.white, 3);
            pbox(c, it.x-10, by-8, 20, 16, full ? '#fff0a8' : '#e9f4ff', 3);
            c.fillStyle = full ? P.gold : P.white;
            c.fillRect(it.x-2, by+8, 4, 3); c.fillRect(it.x-1, by+11, 2, 2);
            spr(c, def.res === 'xp' ? 'i_book' : 'i_'+def.res, it.x, by, { center:true });
            const bz = UI.zone(it.x-13, by-12, 26, 26, 'bub'+it.plot);
            if (bz.click) {
              const n = S.collect(it.b);
              if (n > 0) {
                SFX.play('coin');
                FX.float(it.x, by-6, '+' + n, P.gold, { scale:2 });
                FX.burst(it.x, by, 12, [P.gold,P.white], { speed:70, g:-30 });
                UI.toast('+' + n + ' ' + (def.res === 'xp' ? 'XP' : def.res.toUpperCase()), P.gold,
                         def.res === 'xp' ? 'i_book' : 'i_'+def.res);
              }
            }
          }
        } else if (it.kind === 'plot') {
          const bob2 = Math.sin(t*2 + it.plot)*1.5;
          c.globalAlpha = .55;
          pxEllipse(c, it.x, it.y, 13, 5, rgba(P.ink,.5));
          pbox(c, it.x-11, it.y-22+bob2, 22, 20, rgba(P.ink,.65), 3);
          pbox(c, it.x-10, it.y-21+bob2, 20, 18, rgba(P.grassLt,.25), 3);
          ctxt(c, it.x, it.y-17+bob2, '+', P.white, 2);
          c.globalAlpha = 1;
          const z = UI.zone(it.x-14, it.y-22, 28, 26, 'p'+it.plot);
          if (z.click && !popup) tapped = { type:'plot', plot:it.plot };
        } else if (it.kind === 'hero') {
          const hs = depthScale(hero.y)*1.35;
          AV.draw(c, hero.x, hero.y, S.d.cfg, hero.st === 'walk' ? 'walk' : hero.st, hero.f, { scale:hs, flip:hero.flip });
          if (hero.st === 'sleep') { /* a blanket of Zs handled by particles */ }
          const z = UI.zone(hero.x-18, hero.y-46, 36, 48, 'hero');
          if (z.click && !popup) { hero.st = 'cheer'; hero.timer = 1.2; SFX.play('pop');
                                   FX.stars(hero.x, hero.y-30, 8, P.gold); }
          /* name plate */
          ctxt(c, hero.x, hero.y - 34*hs, S.d.name, P.white, 1, P.ink);
        } else if (it.kind === 'pet' && pet) {
          spr(c, pet.def.spr, pet.x, pet.y - 10 + pet.bob, { center:true, flip:pet.flip,
                                                             scale: depthScale(pet.y) });
        } else if (it.kind === 'chest') {
          const n = S.d.chests.length;
          const by = Math.sin(t*2.4)*2;
          c.globalAlpha = .3 + .2*Math.sin(t*4); pxEllipse(c, it.x, 414, 20, 8, P.gold); c.globalAlpha = 1;
          spr(c, 'chestSm', it.x, 406 + by, { center:true, scale:2 });
          if (n > 1) { pbox(c, it.x+12, 392, 16, 14, P.red, 3); ctxt(c, it.x+20, 395, String(n), P.white, 1); }
          const z = UI.zone(it.x-14, 390, 30, 30, 'chest');
          if (z.click && !popup) Game.go('chest');
        } else if (it.kind === 'mine') {
          drawRock(c, MINE.x, MINE.y, 1.2, 77);
          const z = UI.zone(MINE.x-14, MINE.y-20, 28, 24, 'mine');
          if (z.over) ctxt(c, MINE.x, MINE.y-28, 'MINE', P.white, 1, P.ink);
          if (z.click && !popup) Game.go('minigame', { kind:'mine' });
        }
      }
      /* the choppable tree sits behind everything, so handle it separately */
      {
        const z = UI.zone(CHOP.x-20, CHOP.y-56, 40, 58, 'chop');
        if (z.over) ctxt(c, CHOP.x, CHOP.y-64, 'CHOP', P.white, 1, P.ink);
        if (z.click && !popup) Game.go('minigame', { kind:'chop' });
      }
      /* eggs warming beside the nestry */
      const nest = S.building('nest');
      if (nest && S.d.eggs.length) {
        const p = PLOTS[nest.plot];
        for (let i=0;i<S.d.eggs.length;i++) {
          const e = S.d.eggs[i];
          const ex = p.x - 16 + i*14, ey = p.y + 4 + Math.sin(t*3+i)*1;
          spr(c, 'i_egg', ex, ey, { center:true });
          bar(c, ex-7, ey+8, 14, 3, e.heat/e.need, P.pink);
        }
      }
      c.restore();

      /* --- HUD ----------------------------------------------------------- */
      UI.topBar(c);
      UI.levelChip(c, 6, 30);
      /* streak + daily goal */
      const g = S.daily();
      panel(c, 108, 30, 142, 22, '#2e1b50');
      spr(c, 'i_flame', 111, 35, { scale:1 });
      txt(c, 124, 33, 'DAY ' + S.d.dayStreak, P.orange, 1, P.shadow);
      bar(c, 124, 43, 120, 4, g.n/S.DAILY_GOAL, P.lime, { shine:t*.7 });
      txt(c, 190, 33, g.n + '/' + S.DAILY_GOAL, P.grey, 1);
      if (g.n >= S.DAILY_GOAL && !g.claimed) {
        if (UI.btn(c, 254, 30, 98, 22, 'CLAIM!', { col:'#b3600f', col2:P.gold, txt:P.ink, glow:P.white })) {
          const r = S.claimDaily();
          UI.toast('DAILY DONE  +' + r, P.gold, 'i_coin');
          FX.confetti(VW/2, 120, 50); SFX.play('levelup');
        }
      } else {
        panel(c, 254, 30, 98, 22, '#2e1b50');
        spr(c, 'i_gem', 257, 35);
        txt(c, 271, 33, String(S.d.gems), P.cyan, 1, P.shadow);
        spr(c, 'i_paw', 300, 35);
        txt(c, 314, 33, String(S.d.pets.length), P.lime, 1, P.shadow);
      }

      if (welcome > 0) {
        c.globalAlpha = clamp(welcome,0,1);
        panel(c, 60, 226, VW-120, 48, rgba(P.ink,.85), { r:4 });
        ctxt(c, VW/2, 234, 'WELCOME HOME,', P.white, 1, P.ink);
        ctxt(c, VW/2, 248, S.d.name, P.gold, 3, P.ink);
        c.globalAlpha = 1;
      }

      /* --- bottom nav ---------------------------------------------------- */
      const navY = 568;
      pbox(c, -2, navY-6, VW+4, 82, rgba(P.ink,.92), 4);
      hline(c, 0, navY-6, VW, rgba(P.purple,.6));
      if (UI.btn(c, 8, navY, 74, 30, 'BUILD', { col:'#6a4a10', col2:'#c08a4a', icon:'i_wood', scale:1 }))
        Game.go('build');
      if (UI.btn(c, 88, navY, 74, 30, 'DECK', { col:'#2358c9', col2:'#49a7ff', icon:'i_book', scale:1 }))
        Game.go('dex');
      if (UI.btn(c, 168, navY, 74, 30, 'RANK', { col:'#6a27c8', col2:'#a35cff', icon:'i_trophy', scale:1 }))
        Game.go('rank');
      if (UI.btn(c, 248, navY, 104, 30, 'ADVENTURE', { col:'#1a7331', col2:'#3fe07a', glow:P.gold, scale:1 }))
        Game.go('map');
      /* second row: small utilities */
      if (UI.btn(c, 8, navY+34, 74, 26, 'ME', { col:'#3a2a5e', col2:'#5a4790', scale:1 })) Game.go('creator');
      if (UI.btn(c, 88, navY+34, 74, 26, 'PETS', { col:'#3a2a5e', col2:'#5a4790', icon:'i_paw', scale:1 }))
        popup = { type:'pets' };
      if (UI.btn(c, 168, navY+34, 74, 26, 'GEAR', { col:'#3a2a5e', col2:'#5a4790', icon:'i_sword', scale:1 }))
        popup = { type:'gear' };
      if (UI.btn(c, 248, navY+34, 50, 26, S.d.sound ? 'ON' : 'OFF',
                 { col:'#3a2a5e', col2:'#5a4790', icon:'i_speaker', scale:1 })) {
        S.d.sound = SFX.toggle(); S.save();
      }
      if (UI.btn(c, 302, navY+34, 50, 26, 'INFO', { col:'#3a2a5e', col2:'#5a4790', scale:1 }))
        popup = { type:'info' };

      if (tapped) { popup = tapped; SFX.play('tap'); }
      if (popup) drawPopup(c);
    }
  };

  /* ---------------------------------------------------------------------- */
  function sheet(c, h, title, col) {
    c.fillStyle = rgba(P.shadow,.72); c.fillRect(0,0,VW,VH);
    const y = VH - h;
    panel(c, 6, y, VW-12, h-6, '#241640', { r:4 });
    pbox(c, 6, y, VW-12, 20, col || '#6a27c8', 4);
    ctxt(c, VW/2, y+7, title, P.white, 1);
    if (UI.btn(c, VW-40, y+2, 30, 18, 'X', { col:'#8a2a3a', col2:P.red })) popup = null;
    return y;
  }

  function drawPopup(c) {
    if (popup.type === 'building') {
      const b = popup.b, def = BUILDINGS[b.type];
      const y = sheet(c, 178, def.name + '  LV ' + b.lvl, '#6a4a10');
      if (!popup) return;
      spr(c, def.icon, 26, y+30, { scale:2 });
      txt(c, 56, y+30, def.name, P.gold, 2, P.shadow);
      const lines = wrap(def.desc, VW-90, 1);
      lines.forEach((l,i) => txt(c, 56, y+48+i*10, l, P.grey, 1));
      if (def.res) {
        txt(c, 16, y+76, 'PRODUCES  ' + S.prodRate(b) + ' ' + def.res.toUpperCase() + ' / MIN', P.lime, 1);
        bar(c, 16, y+88, VW-44, 7, (b.stock||0)/Math.max(1,S.prodCap(b)), P.lime, { shine:UI.time });
        txt(c, 16, y+98, Math.floor(b.stock||0) + ' / ' + S.prodCap(b) + ' STORED', P.grey, 1);
      }
      if (b.type === 'forge')   { if (UI.btn(c, 16, y+76, VW-44, 26, 'OPEN THE FORGE', { col:'#8a2a10', col2:P.orange })) popup = { type:'gear' }; }
      if (b.type === 'nest')    { if (UI.btn(c, 16, y+76, VW-44, 26, 'EGGS & PETS', { col:'#1a7331', col2:P.green })) popup = { type:'pets' }; }
      if (b.type === 'library') { if (UI.btn(c, 16, y+108, VW-44, 24, 'WRITE A CUSTOM LESSON', { col:'#2358c9', col2:P.blue })) Game.go('dex', { tab:2 }); }
      const maxed = b.lvl >= def.maxLvl;
      const cost = S.upgradeCost(b);
      const can = !maxed && S.can(cost);
      if (UI.btn(c, 16, y+140, VW-44, 28, maxed ? 'FULLY UPGRADED' : 'UPGRADE  ' + S.costText(cost),
                 { col: can ? '#1a7331' : '#3a2a5e', col2: can ? '#3fe07a' : '#5a4790', disabled:!can })) {
        if (S.upgrade(b)) { SFX.play('build'); FX.confetti(VW/2, y+120, 30);
                            UI.toast(def.name + ' IS NOW LV ' + b.lvl, P.gold, def.icon); }
      }
    } else if (popup.type === 'plot') {
      const plot = popup.plot;
      const y = sheet(c, 296, 'BUILD HERE', '#6a4a10');
      if (!popup) return;
      const keys = Object.keys(BUILDINGS).filter(k => k !== 'house' && !S.building(k));
      if (!keys.length) ctxt(c, VW/2, y+100, 'you have built everything', P.grey, 1);
      keys.forEach((k,i) => {
        const def = BUILDINGS[k];
        const yy = y + 26 + i*33;
        if (yy > VH-34) return;
        panel(c, 12, yy, VW-24, 30, '#2e1b50');
        spr(c, def.icon, 18, yy+9);
        txt(c, 34, yy+5, def.name, P.white, 1, P.shadow);
        txt(c, 34, yy+17, S.costText(def.cost), S.can(def.cost) ? P.lime : P.red, 1);
        if (UI.btn(c, VW-86, yy+3, 66, 24, 'BUILD',
                   { col: S.can(def.cost) ? '#1a7331' : '#3a2a5e', col2: S.can(def.cost) ? '#3fe07a' : '#5a4790',
                     disabled:!S.can(def.cost), key:'bl'+k })) {
          if (S.place(k, plot)) { SFX.play('build'); FX.confetti(PLOTS[plot].x, PLOTS[plot].y, 34);
                                        UI.toast(def.name + ' BUILT', P.gold, def.icon); popup = null; }
        }
      });
    } else if (popup.type === 'gear') {
      const y = sheet(c, 244, 'THE FORGE', '#8a2a10');
      if (!popup) return;
      let i = 0;
      for (const slot in GEAR) {
        const gdef = GEAR[slot], lvl = S.d.gear[slot];
        const yy = y + 28 + i*46; i++;
        panel(c, 12, yy, VW-24, 42, '#2e1b50');
        spr(c, gdef.icon, 18, yy+14, { scale:1 });
        txt(c, 34, yy+5, (GEAR_NAMES[Math.min(lvl,GEAR_NAMES.length-1)]) + ' ' + gdef.name, P.white, 1, P.shadow);
        txt(c, 34, yy+17, '+' + (lvl*gdef.per) + ' ' + gdef.stat.toUpperCase() + '   LV ' + lvl, P.cyan, 1);
        const cost = gdef.cost(lvl);
        txt(c, 34, yy+29, S.costText(cost), S.can(cost) ? P.lime : P.red, 1);
        const ok = S.building('forge') && S.can(cost) && lvl < 6;
        if (UI.btn(c, VW-78, yy+9, 58, 24, lvl >= 6 ? 'MAX' : 'FORGE',
                   { col: ok ? '#8a2a10' : '#3a2a5e', col2: ok ? P.orange : '#5a4790', disabled:!ok, key:'g'+slot })) {
          if (S.pay(cost)) { S.d.gear[slot]++; S.save(); SFX.play('crit');
                             FX.confetti(VW/2, yy, 30); UI.toast(gdef.name + ' UPGRADED', P.orange, gdef.icon); }
        }
      }
      if (!S.building('forge'))
        ctxt(c, VW/2, y+178, 'build a FORGE on the island first', P.red, 1);
      else ctxt(c, VW/2, y+178, 'gear is permanent — it carries into every fight', P.grey, 1);
    } else if (popup.type === 'pets') {
      const y = sheet(c, 250, 'EGGS & COMPANIONS', '#1a7331');
      if (!popup) return;
      txt(c, 14, y+26, 'EGGS  (they hatch while you fight)', P.gold, 1);
      if (!S.d.eggs.length) txt(c, 14, y+38, 'no eggs. chests drop them.', P.grey, 1);
      S.d.eggs.forEach((e,i) => {
        const yy = y+36+i*22;
        spr(c, 'i_egg', 16, yy);
        txt(c, 32, yy+3, (e.type||'').toUpperCase(), P.white, 1);
        bar(c, 100, yy+3, 150, 6, e.heat/e.need, P.pink, { shine:UI.time });
        txt(c, 256, yy+3, Math.floor(e.heat) + '/' + e.need, P.grey, 1);
      });
      txt(c, 14, y+112, 'COMPANIONS', P.gold, 1);
      if (!S.d.pets.length) txt(c, 14, y+124, 'none yet — hatch one in battle', P.grey, 1);
      S.d.pets.forEach((p,i) => {
        const def = S.petDef(p), yy = y+122+i*28;
        if (yy > VH-30) return;
        const active = S.d.activePet === i;
        panel(c, 12, yy, VW-24, 24, active ? '#1a5a33' : '#2e1b50');
        spr(c, def.spr, 16, yy+5, { scale:1 });
        txt(c, 34, yy+8, def.name + '  LV ' + p.lvl, P.white, 1, P.shadow);
        txt(c, 150, yy+8, '+' + def.dmg + ' DMG', P.lime, 1);
        if (UI.btn(c, VW-70, yy+2, 52, 20, active ? 'ACTIVE' : 'PICK',
                   { col: active ? '#1a7331' : '#3a2a5e', col2: active ? '#3fe07a' : '#5a4790', key:'pt'+i })) {
          S.d.activePet = i; S.save(); SFX.play('power');
          const pp = S.pet(); pet = pp ? { x:hero.x, y:hero.y, flip:false, bob:0, def:S.petDef(pp) } : null;
        }
      });
    } else if (popup.type === 'info') {
      const y = sheet(c, 250, 'HOW AETHERIA WORKS', '#2358c9');
      if (!popup) return;
      const lines = [
        'ADVENTURE is a road of islands. Each stop',
        'is a card battle, a mini game or a haul.',
        '',
        'In battle your ANSWER is your attack. Fast',
        'and correct hits hardest. Five answers gets',
        'you a relic. Fill the FOCUS bar for an ult.',
        '',
        'Chests, eggs and materials come home with',
        'you. Build, upgrade, forge armour, hatch',
        'pets. Everything keeps working offline.',
        '',
        'Trophies move you up the ranks. Lose and',
        'you drop some. That is the whole game.'
      ];
      lines.forEach((l,i) => txt(c, 14, y+26+i*11, l, i%7===0?P.gold:P.bone, 1));
      if (UI.btn(c, 14, y+200, 150, 24, 'RESET SAVE', { col:'#8a2a3a', col2:P.red })) {
        if (popup.confirm) { S.reset(); Game.go('creator'); }
        else { popup.confirm = true; UI.toast('tap again to wipe everything', P.red); }
      }
      txt(c, 180, y+206, 'v1.0  ' + Game.fps + ' fps', P.grey, 1);
    }
  }
})());
</script>
<script>
/* =========================================================================
   BASE + LADDER — the two screens hanging off the bottom bar.

   BASE is the Clash-style management view: everything you own, everything
   you could own, and a crafting queue that keeps running with the tab shut.
   LADDER is the competitive half: a live board of rivals and a duel button.
   ========================================================================= */

/* --- consumables, crafted on a timer ------------------------------------- */
const ITEMS = {
  elixir:    { name:'ELIXIR',    desc:'Heals 34 HP mid-battle.',   icon:'i_heart',   col:'#3fe07a', mins:3,  cost:{ essence:10, coins:30 } },
  bomb:      { name:'RUNE BOMB', desc:'32 free damage, no question.', icon:'i_flame', col:'#ff9330', mins:4,  cost:{ wood:30, stone:20 } },
  hourglass: { name:'HOURGLASS', desc:'+8 seconds on one question.', icon:'i_clock', col:'#46ecd5', mins:2,  cost:{ wood:25, coins:20 } },
  lens:      { name:'LENS',      desc:'Burns away two wrong answers.', icon:'i_book', col:'#49a7ff', mins:5,  cost:{ essence:14, stone:20 } }
};
S.items = function() { if (!S.d.items) S.d.items = {}; return S.d.items; };
S.queue = function() { if (!S.d.queue) S.d.queue = []; return S.d.queue; };
S.craft = function(key) {
  const def = ITEMS[key];
  if (!def || S.queue().length >= 4 || !S.pay(def.cost)) return false;
  S.queue().push({ key, done: Date.now() + def.mins*60000 });
  S.save(); return true;
};
S.collectQueue = function() {
  const q = S.queue(), now = Date.now();
  let got = 0;
  for (let i=q.length-1;i>=0;i--) if (q[i].done <= now) {
    S.items()[q[i].key] = (S.items()[q[i].key]||0) + 1; q.splice(i,1); got++;
  }
  if (got) S.save();
  return got;
};
S.useItem = function(key) {
  const it = S.items();
  if (!it[key]) return false;
  it[key]--; S.save(); return true;
};

/* ========================================================================= */
Game.register('build', (() => {
  let t = 0, tab = 0;
  const TABS = ['BUILDINGS','CRAFT','STORE'];

  return {
    enter() { t = 0; S.tickBuildings(); S.collectQueue(); },
    back() { Game.go('island'); },
    update(dt) { t += dt; if (Math.floor(t*2) !== Math.floor((t-dt)*2)) S.collectQueue(); },

    draw(c) {
      drawSky(c, t*.4, { top:'#2e1b50', mid:'#6a3fa8', bot:'#c07ad8', sun:false, stars:true });
      c.fillStyle = rgba(P.ink,.35); c.fillRect(0,0,VW,VH);
      UI.topBar(c);
      UI.header(c, 32, 'YOUR BASE', 'everything keeps working while you are away', P.gold);
      if (UI.btn(c, 8, 34, 36, 22, '<', { col:'#4a3a70', col2:'#6b56a0' })) Game.go('island');

      for (let i=0;i<TABS.length;i++)
        if (UI.btn(c, 10 + i*114, 72, 110, 24, TABS[i],
                   { col: tab===i?'#6a27c8':'#2e1b50', col2: tab===i?P.purple:'#3f2a68', txt: tab===i?P.white:P.grey })) tab = i;

      if (tab === 0) drawBuildings(c);
      else if (tab === 1) drawCraft(c);
      else drawStore(c);
    }
  };

  function drawBuildings(c) {
    /* collect everything at once — the single most satisfying button */
    let ready = 0;
    for (const b of S.d.buildings) ready += Math.floor(b.stock||0);
    if (UI.btn(c, 10, 102, VW-20, 28, ready > 0 ? 'COLLECT ALL  (' + ready + ')' : 'NOTHING TO COLLECT',
               { col: ready?'#1a7331':'#3a2a5e', col2: ready?'#3fe07a':'#5a4790', disabled:!ready, glow: ready?P.gold:null })) {
      let total = 0;
      for (const b of S.d.buildings) total += S.collect(b);
      SFX.play('coin'); FX.confetti(VW/2, 140, 40);
      UI.toast('COLLECTED ' + total, P.gold, 'i_coin');
    }
    let y = 138;
    for (const b of S.d.buildings) {
      const def = BUILDINGS[b.type];
      panel(c, 10, y, VW-20, 44, '#2e1b50');
      spr(c, def.icon, 16, y+16, { scale:1 });
      txt(c, 34, y+5, def.name + '  LV ' + b.lvl, P.white, 1, P.shadow);
      if (def.res) {
        txt(c, 34, y+17, S.prodRate(b) + ' ' + def.res.toUpperCase() + '/MIN', P.lime, 1);
        bar(c, 34, y+29, 150, 6, (b.stock||0)/Math.max(1,S.prodCap(b)), P.lime, { shine:t });
        txt(c, 190, y+29, Math.floor(b.stock||0) + '/' + S.prodCap(b), P.grey, 1);
      } else txt(c, 34, y+19, def.desc, P.grey, 1);
      const cost = S.upgradeCost(b), maxed = b.lvl >= def.maxLvl, can = !maxed && S.can(cost);
      if (UI.btn(c, VW-78, y+10, 60, 24, maxed ? 'MAX' : 'LV ' + (b.lvl+1),
                 { col: can?'#6a4a10':'#3a2a5e', col2: can?P.gold:'#5a4790', txt: can?P.ink:P.grey,
                   disabled:!can, key:'u'+b.type })) {
        if (S.upgrade(b)) { SFX.play('build'); FX.confetti(VW-50, y+20, 26); UI.toast(def.name + ' LV ' + b.lvl, P.gold, def.icon); }
      }
      if (!maxed) { const ct = S.costText(cost); txt(c, Math.min(VW-80, VW-16-tw(ct,1)), y+36, ct, can ? P.lime : P.red, 1); }
      y += 48;
      if (y > VH-120) break;
    }
    /* what is left to build */
    const left = Object.keys(BUILDINGS).filter(k => !S.building(k));
    if (left.length && y < VH-96) {
      txt(c, 12, y+4, 'NOT BUILT YET', P.gold, 1);
      y += 16;
      for (const k of left) {
        if (y > VH-52) break;
        const def = BUILDINGS[k], free = PLOTS.findIndex((p,i) => S.plotFree(i));
        const can = S.can(def.cost) && free >= 0;
        panel(c, 10, y, VW-20, 28, '#241640');
        spr(c, def.icon, 16, y+8);
        txt(c, 34, y+4, def.name, P.white, 1, P.shadow);
        txt(c, 34, y+16, S.costText(def.cost), can ? P.lime : P.red, 1);
        if (UI.btn(c, VW-76, y+2, 58, 24, 'BUILD',
                   { col: can?'#1a7331':'#3a2a5e', col2: can?'#3fe07a':'#5a4790', disabled:!can, key:'nb'+k })) {
          if (S.place(k, free)) { SFX.play('build'); UI.toast(def.name + ' BUILT', P.gold, def.icon); FX.confetti(VW/2, y, 34); }
        }
        y += 32;
      }
    }
  }

  function drawCraft(c) {
    txt(c, 12, 106, 'IN THE WORKSHOP', P.gold, 1);
    const q = S.queue();
    for (let i=0;i<4;i++) {
      const x = 10 + i*87, job = q[i];
      panel(c, x, 118, 82, 50, job ? '#2e1b50' : '#1b1030');
      if (job) {
        const def = ITEMS[job.key];
        const left = Math.max(0, job.done - Date.now());
        const total = def.mins*60000;
        spr(c, def.icon, x+35, 126, { center:true });
        bar(c, x+6, 146, 70, 6, 1-left/total, def.col, { shine:t });
        ctxt(c, x+41, 156, left > 0 ? Math.ceil(left/1000) + 's' : 'READY', left > 0 ? P.grey : P.lime, 1);
      } else ctxt(c, x+41, 138, 'EMPTY', P.grey, 1);
    }
    let y = 178;
    for (const k in ITEMS) {
      const def = ITEMS[k], have = S.items()[k]||0;
      panel(c, 10, y, VW-20, 42, '#2e1b50');
      spr(c, def.icon, 16, y+15, { scale:1 });
      txt(c, 34, y+4, def.name + (have ? '  x' + have : ''), def.col, 1, P.shadow);
      txt(c, 34, y+16, def.desc, P.grey, 1);
      txt(c, 34, y+28, S.costText(def.cost) + '   ' + def.mins + ' MIN', S.can(def.cost) ? P.lime : P.red, 1);
      const can = S.can(def.cost) && S.queue().length < 4;
      if (UI.btn(c, VW-74, y+9, 56, 24, 'CRAFT',
                 { col: can?'#2358c9':'#3a2a5e', col2: can?P.blue:'#5a4790', disabled:!can, key:'cr'+k })) {
        if (S.craft(k)) { SFX.play('build'); UI.toast(def.name + ' STARTED', def.col, def.icon); }
      }
      y += 46;
    }
    txt(c, 12, y+4, 'carry items into battle from the pouch button', P.grey, 1);
  }

  function drawStore(c) {
    txt(c, 12, 106, 'GEM EXCHANGE', P.gold, 1);
    const deals = [
      { n:'300 COINS',     gem:2, act:() => S.give('coins',300),  icon:'i_coin' },
      { n:'120 WOOD',      gem:2, act:() => S.give('wood',120),   icon:'i_wood' },
      { n:'90 STONE',      gem:2, act:() => S.give('stone',90),   icon:'i_stone' },
      { n:'40 ESSENCE',    gem:3, act:() => S.give('essence',40), icon:'i_essence' },
      { n:'A MYSTERY EGG', gem:5, act:() => S.addEgg(pick(S.PET_TYPES).id), icon:'i_egg' },
      { n:'A RARE CHEST',  gem:6, act:() => S.pushChest(S.rollRarity(.4), null), icon:'i_trophy' }
    ];
    let y = 120;
    for (const d of deals) {
      panel(c, 10, y, VW-20, 36, '#2e1b50');
      spr(c, d.icon, 16, y+12, { scale:1 });
      txt(c, 34, y+13, d.n, P.white, 1, P.shadow);
      const can = S.d.gems >= d.gem;
      if (UI.btn(c, VW-80, y+6, 62, 24, d.gem + ' GEM',
                 { col: can?'#1a9e93':'#3a2a5e', col2: can?P.cyan:'#5a4790', icon:'i_gem', disabled:!can, key:'st'+d.n })) {
        S.d.gems -= d.gem; d.act(); S.save();
        SFX.play('chest'); FX.confetti(VW/2, y, 30); UI.toast('GOT ' + d.n, P.cyan, d.icon);
      }
      y += 40;
    }
    txt(c, 12, y+6, 'gems come from daily goals and boss islands.', P.grey, 1);
    txt(c, 12, y+18, 'nothing here costs real money. there is no shop.', P.grey, 1);
  }
})());

/* ========================================================================= */
Game.register('rank', (() => {
  let t = 0, scroll = 0;
  return {
    enter() { t = 0; scroll = 0; },
    back() { Game.go('island'); },
    update(dt) {
      t += dt;
      if (Input.down && Math.abs(Input.dy) > 4) scroll = clamp(scroll - Input.dy*.06, 0, 120);
      scroll = clamp(scroll + Input.wheel*8, 0, 120);
    },
    draw(c) {
      const rk = S.rank();
      drawSky(c, t*.3, { top:'#1a0a3a', mid:'#4a1a6e', bot:shade(rk.col,-.3), sun:false, stars:true });
      c.fillStyle = rgba(P.ink,.3); c.fillRect(0,0,VW,VH);
      UI.topBar(c);
      if (UI.btn(c, 8, 30, 36, 22, '<', { col:'#4a3a70', col2:'#6b56a0' })) Game.go('island');

      /* --- the badge ---------------------------------------------------- */
      const by = 66 + Math.sin(t*1.6)*3;
      c.globalAlpha = .2 + .1*Math.sin(t*3); pxEllipse(c, VW/2, by+18, 58, 34, rk.col); c.globalAlpha = 1;
      for (let i=0;i<8;i++) {
        const a = t*.6 + i*TAU/8;
        c.globalAlpha = .35;
        c.fillStyle = rk.col;
        c.fillRect(Math.round(VW/2+Math.cos(a)*56), Math.round(by+18+Math.sin(a)*30), 3, 3);
        c.globalAlpha = 1;
      }
      spr(c, 'i_trophy', VW/2, by+14, { center:true, scale:3 });
      ctxt(c, VW/2, by+42, rk.name, rk.col, 3, P.ink);
      ctxt(c, VW/2, by+68, S.d.trophies + ' TROPHIES   BEST ' + S.d.best, P.white, 1, P.ink);
      if (rk.next) {
        bar(c, 60, by+84, VW-120, 8, rk.prog, rk.col, { shine:t });
        ctxt(c, VW/2, by+96, (rk.next.at - S.d.trophies) + ' TO ' + rk.next.name, P.grey, 1);
      } else ctxt(c, VW/2, by+88, 'TOP OF THE SKY', P.gold, 1);

      /* --- duel ---------------------------------------------------------- */
      if (UI.btn(c, 20, 188, VW-40, 32, 'DUEL A RIVAL', { col:'#8a2a3a', col2:P.red, glow:P.gold, scale:1 })) {
        const board = S.rivals().filter(r => !r.me);
        const close = board.reduce((a,b) => Math.abs(b.t-S.d.trophies) < Math.abs(a.t-S.d.trophies) ? b : a, board[0]);
        const packs = S.unlockedPacks().filter(u => u.open);
        Game.go('battle', { mode:'duel', rival:close, packId: pick(packs).pack.id });
      }
      ctxt(c, VW/2, 224, 'win +30 trophies   lose -18', P.grey, 1);

      /* --- board --------------------------------------------------------- */
      const board = S.rivals();
      const top = 242;
      c.save();
      c.beginPath(); c.rect(0, top, VW, VH-top); c.clip();
      let y = top + 4 - scroll;
      txt(c, 12, y, 'THE SKY LADDER', P.gold, 1); y += 14;
      for (let i=0;i<board.length;i++) {
        const r = board[i];
        if (y > VH) break;
        const me = !!r.me;
        panel(c, 8, y, VW-16, 28, me ? '#1a5a33' : (i < 3 ? '#4a3a10' : '#2e1b50'));
        ctxt(c, 22, y+9, '#' + (i+1), i < 3 ? P.gold : P.grey, 1);
        AV.draw(c, 46, y+26, r.cfg || AV.defaults(), 'idle', Math.floor(t*3+i)%2, { scale:.85, shadow:false });
        txt(c, 62, y+9, r.n, me ? P.lime : P.white, 1, P.shadow);
        spr(c, 'i_trophy', VW-64, y+8);
        txt(c, VW-48, y+11, String(r.t), P.gold, 1, P.shadow);
        y += 32;
      }
      c.restore();
      c.fillStyle = rgba(P.ink,.9); c.fillRect(0, VH-2, VW, 2);
    }
  };
})());
</script>
<script>
/* =========================================================================
   MAP — the adventure. A shelf of floating worlds, and inside each one a
   winding trail of stops that climbs into the sky.
   ========================================================================= */
Game.register('map', (() => {
  let t = 0, view = 'worlds', packId = null, scroll = 0, maxScroll = 0, sel = -1, dragging = false, startScroll = 0;

  const KIND = {
    fight:  { icon:'i_sword',   label:'BATTLE',    col:'#ff4d5e' },
    elite:  { icon:'i_flame',   label:'ELITE',     col:'#ff9330' },
    boss:   { icon:'i_trophy',  label:'BOSS',      col:'#ffd23f' },
    match:  { icon:'i_book',    label:'MATCH-UP',  col:'#49a7ff' },
    seq:    { icon:'i_clock',   label:'SEQUENCE',  col:'#46ecd5' },
    graph:  { icon:'i_bolt',    label:'GRAPH LAB', col:'#a35cff' },
    gather: { icon:'i_wood',    label:'GATHER',    col:'#3fe07a' }
  };

  const nodePos = (i) => ({
    x: VW/2 + Math.sin(i*0.85 + 0.4)*96,
    y: VH - 120 - i*74
  });

  function openNode(pack, i) {
    const n = pack.nodes[i];
    const common = { packId:pack.id, node:i };
    if (n.kind === 'fight' || n.kind === 'elite' || n.kind === 'boss')
      Game.go('battle', Object.assign(common, { mode:n.kind }));
    else if (n.kind === 'gather')
      Game.go('minigame', Object.assign(common, { kind: Math.random() < .5 ? 'chop' : 'mine' }));
    else
      Game.go('minigame', Object.assign(common, { kind:n.kind }));
  }

  return {
    enter(data) {
      t = 0; sel = -1;
      if (data && data.packId) { view = 'trail'; packId = data.packId; }
      else view = 'worlds';
      scroll = 0;
      if (view === 'trail') {
        const p = CONTENT.pack(packId);
        maxScroll = Math.max(0, p.nodes.length*74 - VH + 220);
        scroll = clamp(S.prog(packId).cleared*74 - 200, 0, maxScroll);
      }
    },
    back() { if (view === 'trail') { view = 'worlds'; } else Game.go('island'); },

    update(dt) {
      t += dt;
      if (view !== 'trail') return;
      if (Input.justDown) { dragging = true; startScroll = scroll; }
      if (Input.down && dragging) scroll = clamp(startScroll + Input.dy, 0, maxScroll);
      if (!Input.down) dragging = false;
      scroll = clamp(scroll - Input.wheel*24, 0, maxScroll);
    },

    draw(c) {
      if (view === 'worlds') drawWorlds(c); else drawTrail(c);
    }
  };

  /* --- world shelf ------------------------------------------------------- */
  function drawWorlds(c) {
    drawSky(c, t*.5, { top:'#1b2d6e', mid:'#4a7fd8', bot:'#b6ecff',
                       cloudLayers:[[.15,.6,140,.5],[.5,.9,230,.65],[.8,1.2,300,.8]] });
    UI.topBar(c);
    if (UI.btn(c, 8, 34, 36, 22, '<', { col:'#4a3a70', col2:'#6b56a0' })) Game.go('island');
    UI.header(c, 32, 'CHOOSE A WORLD', 'each island is a subject', P.gold);

    const list = S.unlockedPacks();
    let y = 78;
    for (let i=0;i<list.length;i++) {
      const p = list[i].pack, open = list[i].open, pr = S.prog(p.id);
      const done = pr.cleared >= p.nodes.length;
      const bob = Math.sin(t*1.3 + i)*2.5;
      panel(c, 10, y, VW-20, 66, open ? '#2e1b50' : '#1b1030', { r:4 });
      /* a little island portrait */
      c.save(); c.beginPath(); c.rect(14, y+2, 62, 62); c.clip();
      c.fillStyle = rgba(p.col2,.35); c.fillRect(14, y+2, 62, 62);
      drawFloatIsland(c, 45, y+30+bob, 46, { seed:i+3, depth:26, vines:false,
        grass: open ? p.col : '#6b789c', grass2: open ? p.col2 : '#434f74', grass3:'#2a3450' });
      if (open) drawTree(c, 36, y+31+bob, .5, i+12);
      spr(c, p.icon, 58, y+20+bob, { center:true, alpha: open?1:.4 });
      c.restore();
      pbox(c, 13, y+1, 64, 64, 'rgba(0,0,0,0)', 3);

      txt(c, 84, y+8, p.name, open ? p.col : P.grey, 2, P.shadow);
      txt(c, 84, y+26, p.sub, P.grey, 1);
      bar(c, 84, y+38, 170, 6, pr.cleared/p.nodes.length, open ? p.col : '#4a4a6a', { shine:t });
      txt(c, 84, y+48, pr.cleared + '/' + p.nodes.length + ' STOPS', P.bone, 1);
      spr(c, 'i_star', 160, y+47);
      txt(c, 174, y+50, String(Object.values(pr.stars).reduce((a,b)=>a+b,0)), P.gold, 1);

      if (!open) {
        spr(c, 'i_lock', VW-46, y+26, { center:true, scale:2 });
        txt(c, 258, y+50, 'CLEAR 4 BEFORE', P.grey, 1);
      } else if (UI.btn(c, VW-84, y+20, 66, 28, done ? 'REPLAY' : 'GO',
                        { col: done?'#3a2a5e':'#1a7331', col2: done?'#5a4790':'#3fe07a', glow: done?null:P.gold, key:'w'+i })) {
        packId = p.id; view = 'trail';
        maxScroll = Math.max(0, p.nodes.length*74 - VH + 220);
        scroll = clamp(pr.cleared*74 - 200, 0, maxScroll);
        SFX.play('power');
      }
      y += 70;
    }

    /* custom decks get their own world */
    panel(c, 10, y, VW-20, 52, '#241640', { r:4 });
    spr(c, 'i_book', 42, y+26, { center:true, scale:2 });
    txt(c, 78, y+8, 'YOUR OWN LESSONS', P.cyan, 2, P.shadow);
    txt(c, 78, y+26, S.d.decks.length + ' custom ' + plural(S.d.decks.length,'deck'), P.grey, 1);
    txt(c, 78, y+38, 'write one in the DECK screen', P.grey, 1);
    const hasDeck = S.d.decks.some(d => d.cards.filter(x=>x.term&&x.def).length >= 2);
    if (UI.btn(c, VW-84, y+12, 66, 28, hasDeck ? 'TRAIN' : 'WRITE',
               { col:'#2358c9', col2:P.blue, key:'cust' })) {
      if (hasDeck) {
        const deck = S.d.decks.find(d => d.cards.filter(x=>x.term&&x.def).length >= 2);
        Game.go('battle', { mode:'custom', deckId:deck.id });
      } else Game.go('dex', { tab:2 });
    }
  }

  /* --- the trail --------------------------------------------------------- */
  function drawTrail(c) {
    const p = CONTENT.pack(packId), pr = S.prog(packId);
    drawSky(c, t*.6, Object.assign({ cloudLayers:[[.12,.5,130,.4],[.42,.8,210,.55],[.78,1.1,290,.7]] }, p.sky));

    /* ground clouds that scroll with the trail */
    for (let i=0;i<8;i++) {
      const yy = VH - 40 - i*74 + scroll;
      if (yy < -40 || yy > VH+40) continue;
      c.globalAlpha = .3; drawCloud(c, (i*97)%VW, yy+30, 1.6, .5); c.globalAlpha = 1;
    }

    /* the dotted road */
    c.save();
    for (let i=0;i<p.nodes.length-1;i++) {
      const a = nodePos(i), b = nodePos(i+1);
      const ay = a.y + scroll, by = b.y + scroll;
      const steps = 9;
      for (let s2=1;s2<steps;s2++) {
        const k = s2/steps;
        const x = lerp(a.x,b.x,k), y = lerp(ay,by,k) + Math.sin(k*Math.PI)*6;
        if (y < -10 || y > VH+10) continue;
        const done = i < pr.cleared;
        c.fillStyle = done ? rgba(P.gold,.85) : rgba('#ffffff',.35);
        const r = done ? 3 : 2;
        c.fillRect(Math.round(x-r/2), Math.round(y-r/2), r, r);
      }
    }
    c.restore();

    /* the stops */
    for (let i=0;i<p.nodes.length;i++) {
      const n = p.nodes[i], pos = nodePos(i), y = pos.y + scroll;
      if (y < -60 || y > VH+50) continue;
      const cleared = i < pr.cleared, current = i === pr.cleared, locked = i > pr.cleared;
      const k = KIND[n.kind];
      const bob = Math.sin(t*1.8 + i*.7)*2;
      const isBoss = n.kind === 'boss';
      const R = isBoss ? 30 : 24;

      /* the little platform each stop stands on */
      drawFloatIsland(c, pos.x, y+R-6+bob, R*2, { seed:i+40, depth:18, vines:false,
        grass: cleared ? P.gold : locked ? '#6b789c' : p.col,
        grass2: cleared ? P.gold2 : locked ? '#434f74' : p.col2, grass3:'#2a3450' });

      if (current) {
        c.globalAlpha = .35 + .2*Math.sin(t*5);
        pxEllipse(c, pos.x, y+bob, R+8, R+8, P.white); c.globalAlpha = 1;
      }
      /* badge */
      const bcol = cleared ? P.gold : locked ? '#5a6480' : k.col;
      pbox(c, pos.x-R/1.6, y-R/1.6+bob, R*1.25, R*1.25, P.ink, 4);
      pbox(c, pos.x-R/1.6+1, y-R/1.6+1+bob, R*1.25-2, R*1.25-2, bcol, 4);
      pbox(c, pos.x-R/1.6+1, y-R/1.6+1+bob, R*1.25-2, 3, shade(bcol,.4), 3);
      spr(c, locked ? 'i_lock' : k.icon, pos.x, y+bob, { center:true, scale: isBoss?2:1.4 });
      if (cleared) UI.stars(c, pos.x, y+R/1.6+5+bob, pr.stars[i]||0, 3, 1);
      txt(c, pos.x + R/1.6 + 6, y-4+bob, String(i+1), rgba(P.white,.7), 1, P.ink);

      if (!locked) {
        const z = UI.zone(pos.x-R, y-R+bob, R*2, R*2, 'n'+i);
        if (z.over) { sel = i; }
        if (z.click) { SFX.play('power'); FX.stars(pos.x, y+bob, 10, bcol); openNode(p, i); }
      }
      /* you, standing on the next stop */
      if (current) AV.draw(c, pos.x, y - R/1.6 + bob - 2, S.d.cfg, 'idle', Math.floor(t*3)%2, { scale:1 });
    }

    /* --- chrome --------------------------------------------------------- */
    c.fillStyle = rgba(P.ink,.82); c.fillRect(0,0,VW,72);
    hline(c, 0, 72, VW, rgba(p.col,.7));
    if (UI.btn(c, 8, 8, 40, 24, '<', { col:'#4a3a70', col2:'#6b56a0' })) view = 'worlds';
    ctxt(c, VW/2, 10, p.name, p.col, 2, P.shadow);
    ctxt(c, VW/2, 28, p.sub, P.grey, 1);
    bar(c, 60, 44, VW-120, 7, pr.cleared/p.nodes.length, p.col, { shine:t, ticks:p.nodes.length });
    ctxt(c, VW/2, 56, pr.cleared + ' / ' + p.nodes.length + ' CLEARED', P.bone, 1);

    /* the info strip for whatever you are hovering */
    if (sel >= 0 && sel < p.nodes.length) {
      const n = p.nodes[sel], k = KIND[n.kind];
      pbox(c, 10, VH-34, VW-20, 26, rgba(P.ink,.88), 3);
      spr(c, k.icon, 18, VH-28);
      txt(c, 34, VH-28, 'STOP ' + (sel+1) + '  ' + k.label, k.col, 1, P.shadow);
      txt(c, 34, VH-18, sel < pr.cleared ? 'cleared — replay for loot' :
                        sel === pr.cleared ? 'tap to begin' : 'locked', P.grey, 1);
    }
  }
})());
</script>
<script>
/* =========================================================================
   BATTLE — the heart of it.

   Every question is a hand of four attack cards. Only the true answer
   connects, and it connects harder the faster you are. Five answers buys a
   relic, a full FOCUS bar buys an ultimate, eggs hatch from the heat of the
   fight, and your pet joins in whether you asked it to or not.
   ========================================================================= */
Game.register('battle', (() => {
  let t, mode, packId, node, deck, pack, bank;
  let me, foe, q, cards, phase, phaseT, act, intent, draft, hatchPet;
  let timeLimit, timeLeft, relics, answered, correct, damageTaken, chosen;
  let shakeFoe, foeFlash, meFlash, result, typed, keypad;
  let stars, rewards, banner, ultReady, petTick;

  const R = id => relics.includes(id);

  /* ---- setup ----------------------------------------------------------- */
  function enemyFor() {
    if (mode === 'duel') {
      return { rival:true, name:foeRival.n, hp:120 + S.rank().idx*26, atk:10 + S.rank().idx*2,
               el:'void', cfg:foeRival.cfg };
    }
    const list = pack.enemies;
    let key;
    if (mode === 'boss') key = pack.boss;
    else if (mode === 'elite') key = list[Math.min(list.length-1, 3)];
    else key = list[Math.min(list.length-1, Math.floor(node/2))];
    const base = CONTENT.ENEMIES[key];
    const scale = 1 + (node||0)*0.06 + S.d.lvl*0.03;
    return Object.assign({}, base, { hp: Math.round(base.hp*scale), atk: Math.round(base.atk*scale) });
  }
  let foeRival = null;

  function nextQuestion() {
    if (mode === 'custom' && deck) q = CONTENT.customQuestion(deck);
    else q = CONTENT.question(bank);
    S.sawCard(bank, q.q, q.a);
    /* every so often a maths question becomes a type-it-in */
    const num = /^-?\d+(\.\d+)?$/.test(String(q.a).replace(/^x\s*=\s*/,'').trim());
    keypad = null; typed = '';
    if (num && ['algebra','fractions','forces','graphs'].includes(bank) && answered > 0 && answered % 4 === 3) {
      keypad = String(q.a).replace(/^x\s*=\s*/,'').trim();
    }
    /* the four attack cards, one per option */
    const pool = shuffle(CONTENT.CARDS);
    cards = q.o.map((opt,i) => {
      const cd = pool[i % pool.length];
      return { opt, card:cd, dead:false, tilt:rnd(-.03,.03), in:0 };
    });
    if (R('glasses')) burnOne();
    timeLimit = 14 + (R('time') ? 4 : 0) - (mode === 'boss' ? 2 : 0);
    timeLeft = timeLimit;
    chosen = -1;
    phase = 'q'; phaseT = 0;
  }
  function burnOne(n) {
    n = n || 1;
    for (let k=0;k<n;k++) {
      const wrong = cards.filter(cd => cd.opt !== q.a && !cd.dead);
      if (wrong.length > 1) { const w = pick(wrong); w.dead = true;
        FX.burst(0,0,0,P.white); }
    }
  }

  /* ---- damage ---------------------------------------------------------- */
  function playerDamage(card) {
    const speed = clamp(timeLeft/timeLimit, 0, 1);
    const speedBonus = 1 + (R('crit') ? 1.2 : 0.6)*speed;
    const comboStep = R('combo') ? .24 : .12;
    const comboMul = 1 + me.combo*comboStep;
    let d = card.card.d * speedBonus * comboMul * S.atk() * (R('focus') ? 1.3 : 1);
    let crit = false;
    if (R('lucky') && Math.random() < .25) { d *= 2; crit = true; }
    if (speed > .8) crit = true;
    return { d: Math.max(1, Math.round(d)), crit };
  }
  function hitFoe(d, crit, label) {
    foe.hp = Math.max(0, foe.hp - d);
    shakeFoe = .3; foeFlash = .18;
    FX.shake(crit ? 7 : 4, .25);
    FX.float(foe.x, foe.y - 34, (crit?'':'') + d, crit ? P.gold : P.white, { scale: crit?3:2, shake: crit?1:0 });
    if (label) FX.float(foe.x, foe.y - 56, label, P.cyan, { scale:1, life:.9 });
    FX.spark(foe.x, foe.y, crit ? 26 : 14, crit ? [P.gold,P.white,P.orange] : [P.white,P.cyan]);
    FX.ring(foe.x, foe.y, crit ? P.gold : P.white, { r1: crit?62:40, w:2 });
    SFX.play(crit ? 'crit' : 'hit');
    if (foe.hp <= 0) endBattle(true);
  }
  function hitMe(raw, why) {
    let d = Math.max(1, Math.round(raw * (R('iron') ? .7 : 1) - S.def()*.35));
    me.hp = Math.max(0, me.hp - d);
    damageTaken += d;
    meFlash = .25; FX.shake(6,.3); FX.flash(rgba(P.red,.5), .12);
    FX.float(me.x, me.y - 40, '-' + d, P.red, { scale:2, shake:1 });
    FX.burst(me.x, me.y-16, 14, [P.red,'#ff97a4'], { speed:110 });
    SFX.play('wrong');
    if (why) FX.float(VW/2, 300, why, P.red, { scale:1, life:1.2 });
    if (R('thorn')) { hitFoe(8, false, 'THORNS'); }
    if (me.hp <= 0) endBattle(false);
  }

  /* ---- answering -------------------------------------------------------- */
  function answer(i) {
    if (phase !== 'q') return;
    chosen = i;
    const card = cards[i];
    const right = card.opt === q.a;
    answered++; S.d.stats.answered++;
    S.dailyTick(1);
    S.gotCard(bank, q.q, right);
    if (right) {
      correct++; S.d.stats.correct++;
      me.combo++;
      me.best = Math.max(me.best, me.combo);
      const { d, crit } = playerDamage(card);
      act = { type:'strike', t:0, dur:.55, card, d, crit, i };
      phase = 'resolve'; phaseT = 0;
      SFX.play('correct');
      if (me.combo > 1) SFX.play('combo', me.combo);
      me.focus = clamp(me.focus + (R('over') ? .29 : .18), 0, 1);
      if (R('vamp')) { me.hp = Math.min(me.maxHp, me.hp + 3); FX.float(me.x, me.y-46, '+3', P.green, { scale:1 }); }
      heatEgg(R('warm') ? 2 : 1);
      petTick++;
    } else {
      me.combo = 0;
      act = { type:'miss', t:0, dur:.5, i };
      phase = 'resolve'; phaseT = 0;
      FX.float(cards[i] ? VW/2 : VW/2, 300, 'WRONG', P.red, { scale:2 });
    }
  }
  function heatEgg(n) {
    const e = S.d.eggs[0];
    if (!e) return;
    e.heat += n;
    FX.float(me.x + 30, me.y - 30, 'EGG +' + n, P.pink, { scale:1, life:.7 });
    SFX.play('egg');
    if (e.heat >= e.need) {
      hatchPet = S.hatch(e);
      phase = 'hatch'; phaseT = 0;
      SFX.play('hatch');
      FX.confetti(VW/2, 300, 60);
    }
  }

  /* ---- the enemy's turn -------------------------------------------------- */
  function enemyAct(missed) {
    intent--;
    if (missed) {
      hitMe(foe.atk * (foe.boss ? 1.3 : 1), null);
    } else if (intent <= 0) {
      /* telegraphed heavy hit — being correct halves it */
      act = { type:'foeStrike', t:0, dur:.6 };
      hitMe(foe.atk * 1.6 * (missed ? 1 : .5), 'HEAVY STRIKE');
      intent = foe.boss ? 3 : 4;
    }
    if (intent <= 0) intent = foe.boss ? 3 : 4;
  }

  /* ---- relics ------------------------------------------------------------ */
  function openDraft() {
    const avail = CONTENT.POWERS.filter(p => !relics.includes(p.id));
    draft = shuffle(avail).slice(0,3).map((p,i) => ({ p, in:0, i }));
    phase = 'draft'; phaseT = 0;
    SFX.play('power'); FX.slow(.3);
  }
  function takeRelic(p) {
    relics.push(p.id);
    if (p.id === 'wind') { me.hp = Math.min(me.maxHp, me.hp + 18); FX.float(me.x, me.y-40, '+18', P.green, { scale:2 }); }
    if (p.id === 'glasses') burnOne();
    S.d.relics[p.id] = (S.d.relics[p.id]||0)+1; S.save();
    UI.toast(p.n + ' — ' + p.d, p.col, p.icon);
    SFX.play('levelup'); FX.confetti(VW/2, 300, 44);
    draft = null; nextQuestion();
  }

  /* ---- end --------------------------------------------------------------- */
  function endBattle(won) {
    phase = won ? 'win' : 'lose';
    phaseT = 0;
    S.d.stats.battles++;
    const acc = answered ? correct/answered : 0;
    stars = won ? (damageTaken === 0 || acc >= .95 ? 3 : acc >= .7 ? 2 : 1) : 0;
    rewards = { xp:0, coins:0, trophies:0, wood:0, stone:0, essence:0, chest:null };
    if (won) {
      S.d.stats.wins++;
      const mul = mode === 'boss' ? 2.6 : mode === 'elite' ? 1.7 : 1;
      rewards.xp = Math.round((18 + correct*4) * mul);
      rewards.coins = Math.round((22 + correct*5) * mul * (R('gold') ? 1.6 : 1));
      rewards.wood = Math.round(6*mul); rewards.stone = Math.round(4*mul);
      if (mode === 'boss') rewards.essence = 8;
      rewards.trophies = mode === 'duel' ? 30 : (8 + stars*3) * (mode === 'boss' ? 2 : 1);
      rewards.chest = S.rollRarity(mode === 'boss' ? .35 : mode === 'elite' ? .15 : 0);
      SFX.play('win');
      FX.confetti(VW/2, 200, 80);
    } else {
      rewards.trophies = mode === 'duel' ? -18 : -4;
      rewards.xp = Math.round(4 + correct*2);
      SFX.play('lose');
    }
    /* bank it */
    const ups = S.addXp(rewards.xp);
    S.give('coins', rewards.coins);
    if (rewards.wood) S.give('wood', rewards.wood);
    if (rewards.stone) S.give('stone', rewards.stone);
    if (rewards.essence) S.give('essence', rewards.essence);
    S.addTrophies(rewards.trophies);
    if (rewards.chest) { S.pushChest(rewards.chest, packId); S.d.stats.chests++; }
    if (won && mode !== 'duel' && mode !== 'custom') S.clearNode(packId, node, stars);
    if (ups) { UI.toast('LEVEL ' + S.d.lvl + '!', P.gold, 'i_star'); SFX.play('levelup'); }
    S.save();
  }

  /* ====================================================================== */
  return {
    enter(data) {
      t = 0; mode = data.mode || 'fight'; packId = data.packId; node = data.node || 0;
      foeRival = data.rival || null;
      deck = data.deckId != null ? S.d.decks.find(d => d.id === data.deckId) : null;
      pack = CONTENT.pack(packId) || CONTENT.PACKS[0];
      bank = deck ? 'custom' : pack.bank;
      relics = []; answered = 0; correct = 0; damageTaken = 0; petTick = 0;
      const e = enemyFor();
      foe = Object.assign({}, e, { maxHp:e.hp, x:VW/2, y:126, bob:0 });
      me = { hp:S.maxHp(), maxHp:S.maxHp(), focus:0, combo:0, best:0, x:70, y:556 };
      intent = foe.boss ? 3 : 4;
      shakeFoe = 0; foeFlash = 0; meFlash = 0; draft = null; hatchPet = null; result = null;
      banner = 1.6; ultReady = false;
      phase = 'intro'; phaseT = 0; act = null;
      SFX.music(false); SFX.duck(.05);
      nextQuestion();
      phase = 'intro';
    },
    exit() { SFX.duck(.16); SFX.music(true); },
    back() { if (phase === 'win' || phase === 'lose') leave(); },

    update(dt) {
      t += dt; phaseT += dt;
      foe.bob = Math.sin(t*2.2)*3;
      if (shakeFoe > 0) shakeFoe -= dt;
      if (foeFlash > 0) foeFlash -= dt;
      if (meFlash > 0) meFlash -= dt;
      if (banner > 0) banner -= dt;
      for (const cd of cards) cd.in = Math.min(1, cd.in + dt*4);
      if (draft) for (const d of draft) d.in = Math.min(1, d.in + dt*3.2);

      if (phase === 'intro') { if (phaseT > 1.5) { phase = 'q'; phaseT = 0; } return; }

      if (phase === 'q') {
        timeLeft -= dt;
        if (mode === 'duel') {
          me.rivalT = (me.rivalT == null ? rnd(5,8) : me.rivalT) - dt;
          if (me.rivalT <= 0) {
            me.rivalT = rnd(5.5,8.5) - S.rank().idx*.2;
            act = { type:'foeStrike', t:0, dur:.6 };
            hitMe(foe.atk, 'THEY ANSWERED');
          }
        }
        if (timeLeft <= 0) {
          me.combo = 0;
          act = { type:'miss', t:0, dur:.5, i:-1 };
          phase = 'resolve'; phaseT = 0;
          FX.float(VW/2, 300, 'TOO SLOW', P.red, { scale:2 });
        }
        ultReady = me.focus >= 1;
        return;
      }

      if (phase === 'resolve') {
        if (act) act.t += dt;
        if (act && act.type === 'strike' && act.t >= act.dur*.55 && !act.landed) {
          act.landed = true;
          hitFoe(act.d, act.crit, act.crit ? 'CRITICAL' : null);
          if (petTick >= 3 && S.pet()) {
            petTick = 0;
            const pd = S.petDef(S.pet());
            const times = R('link') ? 2 : 1;
            for (let i=0;i<times;i++) setTimeout(() => {
              if (phase === 'win' || phase === 'lose') return;
              hitFoe(pd.dmg + S.pet().lvl*2, false, pd.name);
            }, 260 + i*220);
          }
        }
        if (act && act.type === 'miss' && act.t >= act.dur*.4 && !act.landed) {
          act.landed = true;
          enemyAct(true);
        }
        if (phase === 'resolve' && act && act.t >= act.dur + .25) {
          act = null;
          if (answered > 0 && answered % 5 === 0) openDraft();
          else { enemyAct(false); if (phase === 'resolve') nextQuestion(); }
        }
        return;
      }
      if (phase === 'hatch') { if (phaseT > 2.4) { hatchPet = null; nextQuestion(); } return; }
      if (phase === 'ult') {
        if (phaseT > .35 && !act.landed) {
          act.landed = true;
          const d = Math.round((38 + me.combo*6 + S.d.lvl*3) * S.atk());
          hitFoe(d, true, 'ULTIMATE');
          FX.flash('#ffffff', .2);
        }
        if (phaseT > 1.3) { me.focus = 0; if (phase === 'ult') nextQuestion(); }
      }
    },

    draw(c) {
      /* --- arena ------------------------------------------------------- */
      drawSky(c, t*.4, Object.assign({ sun:false, cloudLayers:[[.1,.6,120,.4],[.3,.9,200,.5]] },
              mode === 'duel' ? { top:'#2a0d3a', mid:'#6a1a5a', bot:'#ff7a6b' } : pack.sky));
      /* a couple of islands drifting behind the arena, for depth */
      for (let i=0;i<3;i++) {
        const x = ((i*128 + t*7) % (VW+90)) - 45, y = 60 + (i%2)*34;
        c.globalAlpha = .55;
        drawFloatIsland(c, x, y, 26, { seed:i+70, depth:18, vines:false,
          grass:shade(pack.col,-.2), grass2:shade(pack.col2,-.3), grass3:'#2a3450' });
        c.globalAlpha = 1;
      }
      /* the arena is a small disc the monster stands on */
      drawPlateau(c, VW/2, 172, 116, 22, 46, { seed:99,
        grass:pack.col, grass2:pack.col2, grass3:'#2a3450' });
      c.fillStyle = rgba(P.ink,.76); c.fillRect(0,198,VW,VH-198);
      hline(c, 0, 198, VW, rgba(pack.col,.5));

      /* --- the enemy ---------------------------------------------------- */
      const fx = foe.x + (shakeFoe > 0 ? rnd(-4,4) : 0);
      const fy = foe.y + foe.bob + (phase === 'intro' ? (1-ease.back(clamp(phaseT/.9,0,1)))*-140 : 0);
