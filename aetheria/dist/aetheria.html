<title>AETHERIA — SKY SCHOLARS</title>
<style>
/* AETHERIA — the page is only a frame. Everything you see is canvas pixels. */
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#0b0618;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  touch-action:none; overscroll-behavior:none;
}
body {
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 50% 12%, #2a1a52 0%, #150c2e 45%, #08040f 100%);
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
#frame { position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
#screen {
  display:block; image-rendering:pixelated; image-rendering:crisp-edges;
  border-radius:2px; box-shadow:0 0 0 2px #1b1030, 0 18px 60px rgba(0,0,0,.65), 0 0 90px rgba(123,63,242,.25);

}
/* the boot card is the one bit of DOM, so the first tap can unlock audio */
#boot {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 40%, rgba(40,22,80,.92), rgba(8,4,16,.97));
  z-index:5; transition:opacity .45s ease;
}
#boot.gone { opacity:0; pointer-events:none; }
.bcard { text-align:center; padding:26px 30px; }
.blogo {
  font-size:38px; letter-spacing:7px; font-weight:800; color:#ffd23f;
  text-shadow:0 3px 0 #b3600f, 0 0 26px rgba(255,210,63,.55); margin-bottom:6px;

.bsub { font-size:12px; letter-spacing:5px; color:#8fd8ff; margin-bottom:26px; text-transform:uppercase; }
#bstart {

  color:#1b1030; background:linear-gradient(#7ef08a,#2fb84a); border:0;

.bfoot { margin-top:20px; font-size:10px; letter-spacing:1.6px; color:#6b5f92; }

  '%': '11001,11010,00010,00100,01000,01011,10011',
  '+': '00000,00100,00100,11111,00100,00100,00000',
  '=': '00000,00000,11111,00000,11111,00000,00000',
  '*': '00000,10101,01110,11111,01110,10101,00000',
  '#': '01010,11111,01010,01010,01010,11111,01010',
  '<': '00010,00100,01000,10000,01000,00100,00010',
  '>': '01000,00100,00010,00001,00010,00100,01000',
  '·': '00000,00000,00000,01100,01100,00000,00000',
  '’': '00100,00100,00000,00000,00000,00000,00000',
  '—': '00000,00000,00000,11111,00000,00000,00000',
  '…': '00000,00000,00000,00000,00000,10101,10101',
  '←': '00000,00100,01000,11111,01000,00100,00000',
  '↻': '01110,10001,10000,10110,00001,10001,01110',
  '✓': '00000,00001,00010,10100,01000,00000,00000',
  '♥': '00000,01010,11111,11111,01110,00100,00000',
  '☆': '00100,00100,11111,01110,01010,10001,00000'
};

/* decoded to arrays of row-bitmasks once */
const FONT = {};
for (const ch in FONT_SRC) {
  FONT[ch] = FONT_SRC[ch].split(',').map(r => parseInt(r, 2));
}
const GLYPH_W = 5, GLYPH_H = 7;

function glyphFor(ch) {
  return FONT[ch] || FONT[ch.toUpperCase()] || FONT['?'];
}

/* width of a string in pixels at a given scale */
function textWidth(str, scale) {
  scale = scale || 1;
  return str.length ? (str.length * (GLYPH_W + 1) - 1) * scale : 0;
}

/* Draw text. `shadow` puts a hard drop-shadow behind it, which is what keeps
   pixel type readable on a busy background. */
function drawText(c, x, y, str, col, scale, shadow) {
  scale = scale || 1;
  x = Math.round(x); y = Math.round(y);
  const step = (GLYPH_W + 1) * scale;
  if (shadow) {
    for (let i = 0; i < str.length; i++) drawGlyph(c, x + i * step + scale, y + scale, str[i], shadow, scale);
  }
  for (let i = 0; i < str.length; i++) drawGlyph(c, x + i * step, y, str[i], col, scale);
  return str.length * step - scale;
}

function drawGlyph(c, x, y, ch, col, scale) {
  const g = glyphFor(ch);
  if (!g) return;
  c.fillStyle = col;
  for (let r = 0; r < GLYPH_H; r++) {
    const bits = g[r];
    if (!bits) continue;
    let run = 0, runStart = 0;
    for (let b = 0; b < GLYPH_W; b++) {
      const on = (bits >> (GLYPH_W - 1 - b)) & 1;
      if (on) { if (!run) runStart = b; run++; }
      else if (run) { c.fillRect(x + runStart * scale, y + r * scale, run * scale, scale); run = 0; }
    }
    if (run) c.fillRect(x + runStart * scale, y + r * scale, run * scale, scale);
  }
}

/* greedy word wrap to a pixel width */
function wrapText(str, maxW, scale) {
  scale = scale || 1;
  const words = String(str).split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (textWidth(test, scale) > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawTextCentered(c, cx, y, str, col, scale, shadow) {
  drawText(c, cx - textWidth(str, scale) / 2, y, str, col, scale, shadow);
}

window.FONT_API = { FONT, GLYPH_W, GLYPH_H, textWidth, drawText, drawGlyph, wrapText, drawTextCentered };
</script>
<script>
/* =========================================================================
   UTIL — the small vocabulary the rest of the game is written in.
   Virtual screen is a fixed 360x640 portrait panel. Everything draws into
   an offscreen canvas of exactly that size and gets blitted up with
   smoothing off, so a pixel is always a crisp square no matter the display.
   ========================================================================= */
const VW = 360, VH = 640;

const T = window.FONT_API;                      /* pixel type */
const txt   = (c,x,y,s,col,sc,sh) => T.drawText(c,x,y,String(s),col,sc||1,sh);
const ctxt  = (c,cx,y,s,col,sc,sh) => T.drawTextCentered(c,cx,y,String(s),col,sc||1,sh);
const tw    = (s,sc) => T.textWidth(String(s),sc||1);
const wrap  = (s,w,sc) => T.wrapText(String(s),w,sc||1);

/* Fit a string into a box: try the biggest scale that still wraps to a
   sensible number of lines. Answer text is written by humans and by me, so
   it ranges from "4" to a whole sentence, and both have to look deliberate. */
function fitText(str, maxW, maxH, maxScale) {
  for (let sc = maxScale || 2; sc >= 1; sc--) {
    const lines = wrap(str, maxW, sc);
    const lh = sc * 8 + (sc > 1 ? 2 : 3);
    if (lines.length * lh <= maxH || sc === 1) return { lines, scale:sc, lh };
  }
  return { lines:[String(str)], scale:1, lh:11 };
}
/* draw fitted text centred in a box */
function ctext(c, cx, cy, str, maxW, maxH, col, shadow, maxScale) {
  const f = fitText(str, maxW, maxH, maxScale);
  const top = Math.round(cy - (f.lines.length*f.lh)/2);
  f.lines.forEach((l,i) => ctxt(c, cx, top + i*f.lh, l, col, f.scale, shadow));
  return f;
}

/* ---- maths -------------------------------------------------------------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const inv   = (a,b,v) => b === a ? 0 : clamp((v-a)/(b-a),0,1);
const rnd   = (a,b) => a + Math.random()*(b-a);
const rndi  = (a,b) => Math.floor(a + Math.random()*(b-a+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const dist  = (x1,y1,x2,y2) => Math.hypot(x2-x1,y2-y1);
const TAU   = Math.PI*2;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
/* a deterministic shuffle bag, so question pools never repeat until spent */
function Bag(items) {
  let pool = [];
  return { next() { if (!pool.length) pool = shuffle(items); return pool.pop(); },
           size: items.length, refill() { pool = shuffle(items); } };
}

/* ---- easing — bounce is the house style --------------------------------- */
const ease = {
  out:   t => 1 - Math.pow(1-t, 3),
  in:    t => t*t*t,
  inOut: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2,
  back:  t => { const c = 1.9; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); },
  elastic(t) {
    if (t === 0 || t === 1) return t;
    return Math.pow(2,-9*t) * Math.sin((t*10-0.75)*(TAU/3)) + 1;
  },
  bounce(t) {
    const n = 7.5625, d = 2.75;
    if (t < 1/d) return n*t*t;
    if (t < 2/d) return n*(t-=1.5/d)*t + .75;
    if (t < 2.5/d) return n*(t-=2.25/d)*t + .9375;
    return n*(t-=2.625/d)*t + .984375;
  }
};
/* a 0..1 pulse that never sits still — used on anything that should breathe */
const pulse = (t,speed,amt) => 1 + Math.sin(t*(speed||4))*(amt||.04);

/* ---- colour ------------------------------------------------------------- */
function hex2rgb(h) {
  h = h.replace('#','');
  if (h.length === 3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
const rgb2hex = (r,g,b) =>
  '#' + [r,g,b].map(v => clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
function shade(h, amt) {                        /* amt<0 darker, >0 lighter */
  const [r,g,b] = hex2rgb(h);
  return amt < 0 ? rgb2hex(r*(1+amt), g*(1+amt), b*(1+amt))
                 : rgb2hex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt);
}
const rgba = (h,a) => { const [r,g,b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; };

/* the game palette — deliberately over-saturated, like a sticker sheet */
const P = {
  ink:'#1b1030', ink2:'#2e1b50', shadow:'#0d0720',
  white:'#fffdf5', bone:'#e7dcc6', grey:'#9a8fb5',
  sky1:'#2c7ff0', sky2:'#6cc8ff', sky3:'#b6ecff',
  dusk1:'#3b1e6e', dusk2:'#8b3fa8', dusk3:'#ff7a6b',
  grass:'#54d64a', grass2:'#35ad3c', grass3:'#218a33', grassLt:'#96f06a',
  dirt:'#b9773d', dirt2:'#8a5328', dirt3:'#5e3719',
  stone:'#9aa6c4', stone2:'#6b789c', stone3:'#434f74',
  wood:'#c08a4a', wood2:'#8a5a2c', wood3:'#5b3a1b',
  gold:'#ffd23f', gold2:'#f0a022', gold3:'#b3600f',
  red:'#ff4d5e', red2:'#c31f3f', green:'#3fe07a', green2:'#1d9a52',
  blue:'#49a7ff', blue2:'#2358c9', purple:'#a35cff', purple2:'#6a27c8',
  pink:'#ff5fb8', cyan:'#46ecd5', orange:'#ff9330', lime:'#c3ff4d'
};
const RARITY = {
  common:    { name:'COMMON',    col:'#b9c6dd', glow:'#e6f0ff' },
  rare:      { name:'RARE',      col:'#49a7ff', glow:'#a8dcff' },
  epic:      { name:'EPIC',      col:'#a35cff', glow:'#e0b6ff' },
  legendary: { name:'LEGENDARY', col:'#ffd23f', glow:'#fff0a8' }
};

/* ---- geometry ----------------------------------------------------------- */
const rect = (x,y,w,h) => ({x,y,w,h});
const hit  = (r,px,py) => px >= r.x && px <= r.x+r.w && py >= r.y && py <= r.y+r.h;

/* ---- canvas helpers ----------------------------------------------------- */
function surface(w,h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return c;
}
/* rounded pixel box: corners are literally clipped squares, not curves */
function pbox(c,x,y,w,h,fill,r) {
  r = r == null ? 2 : r;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  c.fillStyle = fill;
  c.fillRect(x+r, y, w-r*2, h);
  c.fillRect(x, y+r, r, h-r*2);
  c.fillRect(x+w-r, y+r, r, h-r*2);
  if (r > 1) { c.fillRect(x+1, y+1, r-1, r-1); c.fillRect(x+w-r, y+1, r-1, r-1);
               c.fillRect(x+1, y+h-r, r-1, r-1); c.fillRect(x+w-r, y+h-r, r-1, r-1); }
}
/* a panel with a hard outline, a lit top edge and a dark base — the single
   most useful shape in the whole game */
function panel(c,x,y,w,h,col,opt) {
  opt = opt || {};
  const r = opt.r == null ? 3 : opt.r;
  pbox(c, x-1, y-1, w+2, h+2, opt.line || P.ink, r+1);
  pbox(c, x, y, w, h, col, r);
  if (opt.flat) return;
  c.fillStyle = shade(col, .28);
  c.fillRect(Math.round(x)+r, Math.round(y)+1, Math.round(w)-r*2, 1);
  c.fillStyle = shade(col, -.3);
  c.fillRect(Math.round(x)+r, Math.round(y+h)-2, Math.round(w)-r*2, 1);
}
function hline(c,x,y,w,col) { c.fillStyle = col; c.fillRect(Math.round(x),Math.round(y),Math.round(w),1); }

/* a value bar with a notched pixel frame and a moving gloss */
function bar(c,x,y,w,h,frac,col,opt) {
  opt = opt || {};
  frac = clamp(frac,0,1);
  pbox(c,x-1,y-1,w+2,h+2,P.ink,2);
  pbox(c,x,y,w,h,opt.back || '#2a1f45',1);
  const fw = Math.round((w-2)*frac);
  if (fw > 0) {
    pbox(c,x+1,y+1,fw,h-2,col,1);
    c.fillStyle = shade(col,.45); c.fillRect(x+1,y+1,fw,1);
    c.fillStyle = shade(col,-.32); c.fillRect(x+1,y+h-2,fw,1);
    if (opt.shine != null) {                     /* travelling highlight */
      const sx = x+1 + ((opt.shine*(w+30))%(fw+30)) - 15;
      c.fillStyle = rgba('#ffffff',.35);
      for (let i=0;i<4;i++) { const px = Math.round(sx+i); if (px > x && px < x+fw) c.fillRect(px,y+1,1,h-2); }
    }
  }
  if (opt.ticks) { c.fillStyle = rgba(P.ink,.5);
    for (let i=1;i<opt.ticks;i++) c.fillRect(Math.round(x+ (w/opt.ticks)*i), y+1, 1, h-2); }
}

/* ---- persistence -------------------------------------------------------- */
const store = {
  get(k,d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k,v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k)   { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---- misc --------------------------------------------------------------- */
const today = () => new Date().toISOString().slice(0,10);
const commas = n => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const plural = (n,s,p) => n === 1 ? s : (p || s+'s');
</script>
<script>
/* =========================================================================
   AUDIO — a tiny chiptune box. No files, every sound is oscillators and a
   gain envelope, so the whole soundtrack weighs nothing.
   ========================================================================= */
const SFX = (() => {
  let ac = null, master = null, on = true, musicGain = null, musicTimer = null, musicStep = 0;

  function boot() {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = .16; musicGain.connect(master);
    return ac;
  }

  function tone(freq, dur, type, vol, when, slideTo, dest) {
    if (!on || !boot()) return;
    const t0 = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol == null ? .22 : vol, t0 + Math.min(.012,dur*.3));
    g.gain.exponentialRampToValueAtTime(.0006, t0 + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(dur, vol, filt) {
    if (!on || !boot()) return;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = filt || 1400; bp.Q.value = .8;
    const g = ac.createGain(); g.gain.value = vol == null ? .18 : vol;
    src.connect(bp); bp.connect(g); g.connect(master); src.start();
  }
  const arp = (notes, step, type, vol) =>
    notes.forEach((f,i) => tone(f, step*1.7, type || 'square', vol == null ? .18 : vol, i*step));

  /* --- the sound board ---------------------------------------------------- */
  const lib = {
    tap:     () => tone(680, .05, 'square', .13),
    hover:   () => tone(900, .03, 'sine', .07),
    back:    () => tone(420, .07, 'square', .12, 0, 300),
    step:    () => noise(.05, .05, 900),
    correct: () => arp([523,659,784,1047], .055, 'square', .17),
    wrong:   () => { tone(196,.22,'sawtooth',.16,0,120); noise(.1,.08,500); },
    hit:     () => { noise(.09,.2,2200); tone(210,.1,'square',.14,0,90); },
    crit:    () => { noise(.14,.26,3000); arp([880,1175,1568],.04,'square',.2); tone(120,.25,'sawtooth',.16,0,60); },
    guard:   () => { tone(330,.12,'triangle',.14); tone(494,.14,'triangle',.1,.05); },
    heal:    () => arp([659,880,1047,1319],.06,'sine',.16),
    ult:     () => { arp([392,523,659,784,1047,1319],.06,'square',.2);
                     tone(80,.7,'sawtooth',.2,.1,40); noise(.5,.16,700); },
    combo:   n => tone(520 + Math.min(n,12)*70, .07, 'square', .15),
    power:   () => arp([440,554,659,880,1108],.05,'triangle',.18),
    coin:    () => arp([988,1319],.05,'square',.14),
    chop:    () => { noise(.11,.22,700); tone(150,.09,'square',.12,0,80); },
    mine:    () => { noise(.12,.22,2600); tone(300,.07,'square',.1,0,180); },
    chest:   () => { arp([392,523,659,784],.07,'square',.18); noise(.3,.12,900); },
    rarity:  n => arp([523,659,784,1047,1319,1568].slice(0, 3 + n), .07, 'square', .2),
    hatch:   () => { noise(.12,.16,1800); arp([784,988,1319,1568],.07,'sine',.18); },
    levelup: () => arp([523,659,784,1047,1319,1568],.07,'square',.2),
    win:     () => arp([523,659,784,1047,880,1047,1319],.09,'square',.2),
    lose:    () => arp([440,392,330,262],.13,'triangle',.17),
    swipe:   () => noise(.12,.1,3200),
    build:   () => { noise(.14,.18,600); tone(180,.14,'square',.12); },
    egg:     () => tone(760,.06,'sine',.12,0,980),
    pop:     () => tone(1200,.05,'sine',.1,0,1600)
  };

  /* --- a gentle two-bar loop for the island; it idles under everything ---- */
  const SCALE = [0,2,4,7,9,12,14,16];
  const ROOTS = [196.00, 174.61, 146.83, 164.81];
  function musicTick() {
    if (!on || !ac) return;
    const bar = Math.floor(musicStep/8) % 4, root = ROOTS[bar];
    const nt = SCALE[(musicStep*3 + bar*2) % SCALE.length];
    const f = root * Math.pow(2, nt/12);
    tone(f*2, .34, 'triangle', .07, 0, null, musicGain);
    if (musicStep % 8 === 0) tone(root/2, .7, 'sine', .1, 0, null, musicGain);
    if (musicStep % 4 === 2) tone(f*4, .12, 'square', .025, .1, null, musicGain);
    musicStep++;
  }

  return {
    play(name, arg) { const f = lib[name]; if (f) f(arg); },
    get enabled() { return on; },
    unlock() { boot(); if (ac && ac.state === 'suspended') ac.resume(); },
    toggle(v) {
      on = v == null ? !on : v;
      if (!on) this.music(false); else this.music(true);
      return on;
    },
    music(want) {
      if (want && on) { if (!musicTimer && boot()) musicTimer = setInterval(musicTick, 340); }
      else if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    },
    duck(v) { if (musicGain && ac) musicGain.gain.setTargetAtTime(v, ac.currentTime, .2); }
  };
})();
</script>
<script>
/* =========================================================================
   FX — particles, popups, shakes and flashes. Nothing in this game happens
   quietly: every hit throws sparks, every correct answer throws stars.
   ========================================================================= */
const FX = (() => {
  let parts = [], floats = [], rings = [], shakeT = 0, shakeAmt = 0, flashT = 0, flashCol = '#fff', slowT = 0;

  function spawn(o) {
    parts.push(Object.assign({
      x:0, y:0, vx:0, vy:0, g:0, life:.6, t:0, size:2, col:P.white,
      kind:'px', spin:0, rot:0, drag:1, fade:true
    }, o));
  }

  const api = {
    /* --- emitters -------------------------------------------------------- */
    burst(x,y,n,col,opt) {
      opt = opt || {};
      for (let i=0;i<n;i++) {
        const a = opt.dir != null ? opt.dir + rnd(-opt.spread||-.7, opt.spread||.7) : rnd(0,TAU);
        const sp = rnd(opt.minSpeed||30, opt.speed||110);
        spawn({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:opt.g == null ? 130 : opt.g,
                life:rnd(.3,opt.life||.75), size:opt.size || rndi(1,3),
                col: Array.isArray(col) ? pick(col) : col, kind:opt.kind || 'px', drag:opt.drag||.94 });
      }
    },
    spark(x,y,n,col) { api.burst(x,y,n,col||[P.gold,P.white,P.orange],{speed:150,g:220,size:2,kind:'trail'}); },
    stars(x,y,n,col) {
      for (let i=0;i<n;i++) {
        const a = rnd(0,TAU), sp = rnd(25,95);
        spawn({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-30, g:70, life:rnd(.55,1.05),
                size:rndi(3,5), col:col || pick([P.gold,P.white,P.cyan]), kind:'star', spin:rnd(-9,9), drag:.96 });
      }
    },
    dust(x,y,n,col) {
      for (let i=0;i<(n||5);i++)
        spawn({ x:x+rnd(-4,4), y, vx:rnd(-18,18), vy:rnd(-24,-6), g:40, life:rnd(.3,.6),
                size:rndi(1,2), col:col||'#e9dfc0', kind:'px', drag:.9 });
    },
    confetti(x,y,n) {
      for (let i=0;i<n;i++)
        spawn({ x:x+rnd(-30,30), y:y+rnd(-10,10), vx:rnd(-70,70), vy:rnd(-190,-70), g:230,
                life:rnd(1,1.9), size:rndi(2,4), col:pick([P.gold,P.pink,P.cyan,P.lime,P.blue,P.red,P.white]),
                kind:'flake', spin:rnd(-12,12), drag:.98 });
    },
    leaves(x,y,n) {
      for (let i=0;i<n;i++)
        spawn({ x:x+rnd(-8,8), y:y+rnd(-6,6), vx:rnd(-40,40), vy:rnd(-70,-20), g:55,
                life:rnd(.9,1.7), size:3, col:pick([P.grass,P.grass2,P.grassLt,P.lime]),
                kind:'flake', spin:rnd(-7,7), drag:.97 });
    },
    smoke(x,y,n,col) {
      for (let i=0;i<(n||4);i++)
        spawn({ x:x+rnd(-3,3), y:y+rnd(-2,2), vx:rnd(-10,10), vy:rnd(-26,-12), g:-6,
                life:rnd(.6,1.2), size:rndi(2,4), col:col||'#c9c2dd', kind:'soft', drag:.97 });
    },
    trail(x,y,col) { spawn({ x,y, vx:rnd(-8,8), vy:rnd(-8,8), g:0, life:.3, size:2, col, kind:'px', drag:.9 }); },

    /* --- readouts -------------------------------------------------------- */
    float(x,y,text,col,opt) {
      opt = opt || {};
      floats.push({ x, y, text:String(text), col:col||P.white, t:0,
                    life:opt.life||1.1, scale:opt.scale||1, vy:opt.vy||-34,
                    pop:opt.pop !== false, shake:opt.shake||0 });
    },
    ring(x,y,col,opt) {
      opt = opt || {};
      rings.push({ x, y, col, t:0, life:opt.life||.45, r0:opt.r0||4, r1:opt.r1||42, w:opt.w||2, kind:opt.kind||'ring' });
    },
    shake(amt,dur) { shakeAmt = Math.max(shakeAmt, amt); shakeT = Math.max(shakeT, dur||.28); },
    flash(col,dur) { flashCol = col || '#fff'; flashT = dur || .12; },
    slow(dur) { slowT = Math.max(slowT, dur || .18); },

    /* --- pump ------------------------------------------------------------ */
    get timeScale() { return slowT > 0 ? .32 : 1; },
    update(dt) {
      if (slowT > 0) slowT -= dt;
      for (let i=parts.length-1;i>=0;i--) {
        const p = parts[i];
        p.t += dt;
        if (p.t >= p.life) { parts.splice(i,1); continue; }
        p.vy += p.g*dt; p.vx *= Math.pow(p.drag,dt*60); p.vy *= Math.pow(p.drag,dt*60);
        p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.spin*dt;
      }
      for (let i=floats.length-1;i>=0;i--) {
        const f = floats[i]; f.t += dt;
        if (f.t >= f.life) { floats.splice(i,1); continue; }
        f.y += f.vy*dt; f.vy *= .93;
      }
      for (let i=rings.length-1;i>=0;i--) { rings[i].t += dt; if (rings[i].t >= rings[i].life) rings.splice(i,1); }
      if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeAmt = 0; }
      if (flashT > 0) flashT -= dt;
      if (parts.length > 700) parts.splice(0, parts.length-700);
    },

    /* the camera offset every scene applies before drawing the world */
    shakeOffset() {
      if (shakeT <= 0) return [0,0];
      const a = shakeAmt * (shakeT/.28);
      return [Math.round(rnd(-a,a)), Math.round(rnd(-a,a))];
    },

    drawParts(c) {
      for (const p of parts) {
        const k = 1 - p.t/p.life;
        const s = Math.max(1, Math.round(p.size * (p.kind === 'soft' ? (0.6+ (1-k)) : k < .3 ? k/.3 : 1)));
        c.globalAlpha = p.kind === 'soft' ? k*.5 : (p.fade && k < .35 ? k/.35 : 1);
        c.fillStyle = p.col;
        const x = Math.round(p.x), y = Math.round(p.y);
        if (p.kind === 'star') {
          const r = Math.max(1, Math.round(s*k));
          c.fillRect(x-r, y, r*2+1, 1); c.fillRect(x, y-r, 1, r*2+1);
          c.fillRect(x-1,y-1,3,3);
        } else if (p.kind === 'flake') {
          const w = Math.max(1, Math.round(Math.abs(Math.cos(p.rot))*s)+1);
          c.fillRect(x-(w>>1), y-1, w, 2);
        } else if (p.kind === 'trail') {
          c.fillRect(x, y, s, s);
          c.globalAlpha *= .4;
          c.fillRect(Math.round(x-p.vx*.025), Math.round(y-p.vy*.025), Math.max(1,s-1), Math.max(1,s-1));
        } else {
          c.fillRect(x-(s>>1), y-(s>>1), s, s);
        }
      }
      c.globalAlpha = 1;
      for (const r of rings) {
        const k = r.t/r.life, rad = Math.round(lerp(r.r0, r.r1, ease.out(k)));
        c.globalAlpha = 1-k;
        c.strokeStyle = r.col; c.lineWidth = r.w;
        if (r.kind === 'ring') { c.beginPath(); c.arc(r.x, r.y, rad, 0, TAU); c.stroke(); }
        else {                                      /* a squashed shockwave */
          c.beginPath(); c.ellipse(r.x, r.y, rad, Math.max(1,rad*.4), 0, 0, TAU); c.stroke();
        }
      }
      c.globalAlpha = 1;
    },
    drawFloats(c) {
      for (const f of floats) {
        const k = f.t/f.life;
        let sc = f.scale;
        if (f.pop) sc *= k < .22 ? lerp(.3, 1.25, ease.back(k/.22)) : lerp(1.25, 1, ease.out(inv(.22,.5,k)));
        sc = Math.max(1, Math.round(sc));
        c.globalAlpha = k > .7 ? 1-(k-.7)/.3 : 1;
        const jx = f.shake ? rnd(-f.shake,f.shake) : 0;
        ctxt(c, f.x+jx, f.y, f.text, f.col, sc, P.ink);
        c.globalAlpha = 1;
      }
    },
    drawFlash(c) {
      if (flashT <= 0) return;
      c.globalAlpha = clamp(flashT/.12,0,1)*.8; c.fillStyle = flashCol;
      c.fillRect(0,0,VW,VH); c.globalAlpha = 1;
    },
    clear() { parts = []; floats = []; rings = []; shakeT = 0; flashT = 0; slowT = 0; },
    get count() { return parts.length; }
  };
  return api;
})();

/* -------------------------------------------------------------------------
   TWEEN — a one-shot value with an easing curve. Menus, cards and chests
   are all built out of these.
   ------------------------------------------------------------------------- */
function Tween(from,to,dur,fn) {
  return { v:from, from, to, dur, t:0, fn:fn||ease.out, done:false,
    step(dt) {
      if (this.done) return this.v;
      this.t += dt;
      const k = clamp(this.t/this.dur,0,1);
      this.v = lerp(this.from, this.to, this.fn(k));
      if (k >= 1) { this.done = true; this.v = this.to; }
      return this.v;
    },
    reset(from,to,dur) { this.from = from; this.to = to; this.v = from; this.t = 0; this.dur = dur||this.dur; this.done = false; return this; }
  };
}

/* =========================================================================
   ART — the look of the place.

   Two halves. Small things (icons, creatures, props) are hand-placed pixels
   written as character grids with a palette per sprite. Big things (islands,
   trees, buildings) are drawn procedurally out of 1px rectangles, which is
   still pixel art — it just means a sawmill can be five different sizes
   without me typing it out five times.
   ========================================================================= */
const ART = (() => {
  const cache = new Map();
  const warned = [];

  /* build a canvas from a character grid */
  function build(rows, pal) {
    const h = rows.length, w = rows[0].length;
    for (const r of rows) if (r.length !== w) warned.push(`ragged row (${r.length} vs ${w}): "${r}"`);
    const cv = surface(w,h), c = cv.getContext('2d');
    for (let y=0;y<h;y++) for (let x=0;x<rows[y].length;x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      const col = pal[ch];
      if (!col) { warned.push(`no palette entry '${ch}'`); continue; }
      c.fillStyle = col; c.fillRect(x,y,1,1);
    }
    return cv;
  }

  /* a sprite, optionally with some palette keys overridden (pet colours,
     shirt colours, elemental variants of the same monster) */

    const key = swap ? name + '|' + JSON.stringify(swap) : name;

    if (!d) { console.warn('missing sprite', name); return surface(1,1); }

/* draw a named sprite, with optional scale / flip / tint / alpha */
function spr(c, name, x, y, opt) {
  opt = opt || {};
  const img = ART.get(name, opt.swap);
  const s = opt.scale || 1;
  const w = img.width*s, h = img.height*s;
  x = Math.round(x); y = Math.round(y);
  if (opt.center) { x -= Math.round(w/2); y -= Math.round(h/2); }
  if (opt.alpha != null) c.globalAlpha = opt.alpha;
  if (opt.flip) {
    c.save(); c.translate(x+w, y); c.scale(-1,1); c.drawImage(img, 0, 0, w, h); c.restore();
  } else {
    c.drawImage(img, x, y, w, h);
  }
  if (opt.tint) {                          /* flat colour stamp of the shape */
    const t = surface(img.width, img.height), tc = t.getContext('2d');
    tc.drawImage(img,0,0); tc.globalCompositeOperation = 'source-in';
    tc.fillStyle = opt.tint; tc.fillRect(0,0,img.width,img.height);
    c.globalAlpha = (opt.alpha == null ? 1 : opt.alpha) * (opt.tintAmt == null ? 1 : opt.tintAmt);
    if (opt.flip) { c.save(); c.translate(x+w,y); c.scale(-1,1); c.drawImage(t,0,0,w,h); c.restore(); }
    else c.drawImage(t, x, y, w, h);
  }
  c.globalAlpha = 1;
  return { w, h };
}
const sprSize = (name) => { const i = ART.get(name); return { w:i.width, h:i.height }; };

/* =========================================================================
   PROCEDURAL SCENERY — islands, trees, buildings. Still one-pixel
   rectangles, just assembled by arithmetic instead of by hand.
   ========================================================================= */

/* stable per-object randomness so a tree does not reshuffle every frame */
function srnd(seed) {
  let s = (seed*2654435761) >>> 0;
  return () => { s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
}
function pxEllipse(c,cx,cy,rx,ry,col) {
  c.fillStyle = col;
  cx = Math.round(cx); cy = Math.round(cy);
  for (let y=-ry;y<=ry;y++) {
    const k = 1-(y/ry)*(y/ry); if (k < 0) continue;
    const w = Math.floor(rx*Math.sqrt(k));
    c.fillRect(cx-w, cy+y, w*2+1, 1);
  }
}
function pxDither(c,x,y,w,h,col,phase) {
  c.fillStyle = col;
  for (let j=0;j<h;j++) for (let i=(j+(phase||0))%2;i<w;i+=2) c.fillRect(Math.round(x+i),Math.round(y+j),1,1);
}

/* a fat pixel cloud built from overlapping lumps */
function drawCloud(c,x,y,s,alpha) {
  c.globalAlpha = alpha == null ? 1 : alpha;
  const lumps = [[0,0,10,6],[-9,2,7,4],[9,2,7,4],[-4,-4,7,5],[5,-3,6,4]];
  for (const [dx,dy,rx,ry] of lumps) pxEllipse(c, x+dx*s, y+dy*s, rx*s, ry*s, '#ffffff');
  for (const [dx,dy,rx,ry] of lumps) pxEllipse(c, x+dx*s, y+dy*s+ry*s*.55, rx*s*.85, ry*s*.4, '#d8ecff');
  c.globalAlpha = 1;
}

/* the sky behind everything: banded gradient, sun, parallax clouds */
function drawSky(c, t, opt) {
  opt = opt || {};
  const top = opt.top || '#2c7ff0', mid = opt.mid || '#6cc8ff', bot = opt.bot || '#b6ecff';
  const gr = c.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0, top); gr.addColorStop(.55, mid); gr.addColorStop(1, bot);
  c.fillStyle = gr; c.fillRect(0,0,VW,VH);
  /* banding — a gradient with visible steps reads as pixel art, not CSS */
  for (let y=0;y<VH;y+=8) { c.fillStyle = rgba('#ffffff', .022*(y/VH)); c.fillRect(0,y,VW,4); }
  if (opt.sun !== false) {
    const sx = opt.sunX == null ? 292 : opt.sunX, sy = opt.sunY == null ? 74 : opt.sunY;
    c.globalAlpha = .18; pxEllipse(c,sx,sy,34,34,'#fff0a8');
    c.globalAlpha = .3;  pxEllipse(c,sx,sy,24,24,'#fff0a8'); c.globalAlpha = 1;
    pxEllipse(c,sx,sy,14,14,'#ffe57a'); pxEllipse(c,sx,sy,11,11,'#fffdf5');
  }
  if (opt.stars) {
    const r = srnd(7);
    for (let i=0;i<46;i++) {
      const x = r()*VW, y = r()*VH*.6, tw = .5+.5*Math.sin(t*3+i);
      c.globalAlpha = .3+tw*.7; c.fillStyle = '#fffdf5';
      c.fillRect(Math.round(x),Math.round(y),1,1);
      if (tw > .9) { c.fillRect(Math.round(x)-1,Math.round(y),3,1); c.fillRect(Math.round(x),Math.round(y)-1,1,3); }
    }
    c.globalAlpha = 1;
  }
  const layers = opt.cloudLayers || [[.22,.55,120,.55],[.45,.85,210,.75]];
  for (let li=0;li<layers.length;li++) {
    const [yf, sc, period, al] = layers[li];
    const r = srnd(31+li*17);
    for (let i=0;i<5;i++) {
      const base = r()*period, yy = VH*yf + r()*70 - 35;
      const xx = ((base - t*(6+li*9)) % (VW+150) + VW+150) % (VW+150) - 75;
      drawCloud(c, xx, yy, sc*(0.7+r()*.6), al);
    }
  }
}

/* a floating island: grass cap, dirt body, a rocky point, hanging roots */
function drawFloatIsland(c, cx, topY, w, opt) {
  opt = opt || {};
  const seed = opt.seed == null ? 3 : opt.seed;
  const r = srnd(seed);
  const depth = opt.depth || Math.round(w*.62);
  const grassH = opt.grassH || 7;
  const g1 = opt.grass || P.grass, g2 = opt.grass2 || P.grass2, g3 = opt.grass3 || P.grass3;
  const d1 = opt.dirt || P.dirt, d2 = opt.dirt2 || P.dirt2, d3 = opt.dirt3 || P.dirt3;

  /* the underside: a stack of shrinking rows ending in a blunt point */
  for (let i=0;i<depth;i++) {
    const k = i/depth;
    let hw = Math.round((w/2) * Math.pow(1-k, .72));
    hw += Math.round(Math.sin(i*.55+seed)*1.6*(1-k));
    if (hw < 1) break;
    const y = topY + grassH + i;
    c.fillStyle = k < .28 ? d1 : k < .62 ? d2 : d3;
    c.fillRect(Math.round(cx-hw), Math.round(y), hw*2, 1);
    c.fillStyle = rgba('#000000', .18);          /* rim shade on the right */
    c.fillRect(Math.round(cx+hw-Math.max(1,Math.round(hw*.18))), Math.round(y), Math.max(1,Math.round(hw*.18)), 1);
    if (i%7 === 3) pxDither(c, cx-hw+2, y, hw*2-4, 1, rgba(d3,.5), i);
  }
  /* embedded rocks */
  for (let i=0;i<Math.max(2,Math.round(w/34));i++) {
    const rx = cx + (r()-.5)*w*.7, ry = topY + grassH + 6 + r()*depth*.5, rr = 2+r()*3;
    pxEllipse(c, rx, ry, rr, rr*.75, P.stone2);
    pxEllipse(c, rx, ry-1, rr*.6, rr*.4, P.stone);
  }
  /* grass cap with a bumpy silhouette and a bright lip */
  for (let i=0;i<grassH;i++) {
    const hw = Math.round(w/2 - i*0.35);
    c.fillStyle = i === 0 ? P.grassLt : i < 3 ? g1 : i < 5 ? g2 : g3;
    c.fillRect(Math.round(cx-hw), Math.round(topY+i), hw*2, 1);
  }
  pxDither(c, cx-w/2+3, topY+3, w-6, 2, rgba(P.grassLt,.55), 0);
  /* tufts along the top edge */
  for (let i=0;i<Math.round(w/9);i++) {
    const tx = Math.round(cx - w/2 + 4 + r()*(w-8)), th = 1+Math.round(r()*2);
    c.fillStyle = P.grassLt; c.fillRect(tx, topY-th, 1, th);
    if (r() > .6) c.fillRect(tx+1, topY-Math.max(1,th-1), 1, Math.max(1,th-1));
  }
  /* hanging roots and vines */
  if (opt.vines !== false) {
    for (let i=0;i<Math.max(2,Math.round(w/26));i++) {
      const vx = Math.round(cx - w/2 + 6 + r()*(w-12));
      const vl = 6 + r()*18, off = Math.abs(vx-cx)/(w/2);
      const len = Math.round(vl*(1-off*.6));
      for (let j=0;j<len;j++) {
        c.fillStyle = j > len*.6 ? P.grass3 : P.grass2;
        c.fillRect(vx + Math.round(Math.sin(j*.4+i)*1.2), Math.round(topY+grassH+j), 1, 1);
      }
    }
  }
}

/* a leafy tree — trunk, three canopy lumps, highlight, dither, shadow */
function drawTree(c, x, groundY, s, seed, opt) {
  opt = opt || {};
  const r = srnd(seed || 1);
  const th = Math.round((14 + r()*6) * s);
  const tw2 = Math.max(2, Math.round(3*s));
  const leaf = opt.leaf || P.grass2, leafLt = opt.leafLt || P.grass, leafDk = opt.leafDk || P.grass3;
  c.globalAlpha = .22; pxEllipse(c, x+2, groundY+1, Math.round(9*s), Math.round(3*s), '#000000'); c.globalAlpha = 1;
  /* trunk with a lit left edge */
  c.fillStyle = P.wood2; c.fillRect(Math.round(x-tw2/2), Math.round(groundY-th), tw2, th);
  c.fillStyle = P.wood;  c.fillRect(Math.round(x-tw2/2), Math.round(groundY-th), 1, th);
  c.fillStyle = P.wood3; c.fillRect(Math.round(x+tw2/2)-1, Math.round(groundY-th), 1, th);
  /* a couple of branches */
  c.fillStyle = P.wood2;
  c.fillRect(Math.round(x-tw2/2-2*s), Math.round(groundY-th*.72), Math.round(2*s), 1);
  c.fillRect(Math.round(x+tw2/2), Math.round(groundY-th*.85), Math.round(2*s), 1);
  const cy = groundY - th - Math.round(4*s);
  const lumps = [[0,-2,11,9],[-8,2,8,6],[8,2,8,6],[-3,-7,7,5],[4,-6,7,5]];
  for (const [dx,dy,rx,ry] of lumps) pxEllipse(c, x+dx*s, cy+dy*s, Math.round(rx*s), Math.round(ry*s), leafDk);
  for (const [dx,dy,rx,ry] of lumps) pxEllipse(c, x+dx*s-1, cy+dy*s-1, Math.round(rx*s*.92), Math.round(ry*s*.92), leaf);
  for (const [dx,dy,rx,ry] of lumps) pxEllipse(c, x+dx*s-Math.round(2*s), cy+dy*s-Math.round(2*s), Math.round(rx*s*.5), Math.round(ry*s*.5), leafLt);
  pxDither(c, x-10*s, cy-4*s, 9*s, 6*s, rgba(leafLt,.5), 0);
  if (opt.fruit) for (let i=0;i<3;i++) {
    const fx = x + (r()-.5)*18*s, fy = cy + (r()-.3)*12*s;
    pxEllipse(c, fx, fy, Math.max(1,Math.round(1.5*s)), Math.max(1,Math.round(1.5*s)), opt.fruit);
  }
}
function drawBush(c,x,y,s,seed,col) {
  const r = srnd(seed||2);
  const a = col || P.grass2;
  c.globalAlpha = .2; pxEllipse(c,x+1,y+1,6*s,2*s,'#000'); c.globalAlpha = 1;
  pxEllipse(c,x,y-3*s,7*s,4*s,shade(a,-.2));
  pxEllipse(c,x-4*s,y-1*s,4*s,3*s,shade(a,-.2));
  pxEllipse(c,x+4*s,y-1*s,4*s,3*s,shade(a,-.2));
  pxEllipse(c,x-1,y-4*s,5*s,3*s,a);
  pxEllipse(c,x-2*s,y-5*s,2*s,1*s,shade(a,.3));
  if (r() > .5) { c.fillStyle = P.pink; c.fillRect(Math.round(x+2*s),Math.round(y-4*s),1,1); }
}
function drawRock(c,x,y,s,seed) {
  const r = srnd(seed||5);
  c.globalAlpha = .2; pxEllipse(c,x+1,y+1,6*s,2*s,'#000'); c.globalAlpha = 1;
  pxEllipse(c,x,y-3*s,6*s,4*s,P.stone2);
  pxEllipse(c,x-1,y-4*s,4*s,3*s,P.stone);
  pxEllipse(c,x-2*s,y-5*s,2*s,1*s,'#cfd9ee');
  pxEllipse(c,x+3*s,y-1*s,3*s,2*s,P.stone3);
  if (r() > .55) { c.fillStyle = P.cyan; c.fillRect(Math.round(x+2*s),Math.round(y-4*s),1,2); }
}
function drawWaterfall(c,x,y,w,h,t) {
  c.fillStyle = rgba('#6cc8ff',.75); c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
  c.fillStyle = rgba('#b6ecff',.8);
  for (let i=0;i<w;i+=3) {
    const off = ((t*60 + i*13) % h);
    c.fillRect(Math.round(x+i), Math.round(y+off), 1, Math.min(6, h-off));
  }
  c.fillStyle = rgba('#ffffff',.6);
  for (let i=0;i<4;i++) c.fillRect(Math.round(x+((t*40+i*17)%w)), Math.round(y+h-2), 2, 2);
}

/* =========================================================================
   BUILDINGS — every base structure, drawn from rectangles so the same
   sawmill can be three sizes and three upgrade levels without new art.
   ========================================================================= */
function roofTri(c,cx,baseY,halfW,h,col,col2) {
  for (let i=0;i<h;i++) {
    const hw = Math.round(halfW*(1 - i/h));
    c.fillStyle = i < 2 ? (col2||shade(col,.3)) : col;
    c.fillRect(Math.round(cx-hw), Math.round(baseY-i), hw*2, 1);
  }
  c.fillStyle = shade(col,-.35);
  c.fillRect(Math.round(cx-halfW-1), Math.round(baseY), halfW*2+2, 1);
}
function planks(c,x,y,w,h,col) {
  c.fillStyle = col; c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
  c.fillStyle = shade(col,-.22);
  for (let j=3;j<h;j+=4) c.fillRect(Math.round(x),Math.round(y+j),Math.round(w),1);
  c.fillStyle = shade(col,.22); c.fillRect(Math.round(x),Math.round(y),Math.round(w),1);
}
function window4(c,x,y,w,h,lit) {
  c.fillStyle = P.ink; c.fillRect(Math.round(x-1),Math.round(y-1),Math.round(w+2),Math.round(h+2));
  c.fillStyle = lit ? '#ffd23f' : '#8fd8ff';
  c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
  c.fillStyle = lit ? '#fff0a8' : '#d8f4ff';
  c.fillRect(Math.round(x),Math.round(y),Math.round(w/2),Math.round(h/2));
  c.fillStyle = P.wood3;
  c.fillRect(Math.round(x+w/2),Math.round(y),1,Math.round(h));
  c.fillRect(Math.round(x),Math.round(y+h/2),Math.round(w),1);
}
/* type: house sawmill quarry well forge nest library gym */
function drawBuilding(c, type, cx, groundY, lvl, t, s) {
  s = s || 1; lvl = lvl || 1;
  const W = Math.round(30*s), H = Math.round(26*s + lvl*2*s);
  const L = Math.round(cx - W/2), Ty = Math.round(groundY - H);
  c.globalAlpha = .22; pxEllipse(c, cx+1, groundY+1, W*.55, 3*s, '#000'); c.globalAlpha = 1;
  const outline = (x,y,w,h) => { c.fillStyle = P.ink; c.fillRect(Math.round(x-1),Math.round(y-1),Math.round(w+2),Math.round(h+2)); };

  if (type === 'house') {
    outline(L, Ty+10*s, W, H-10*s);
    planks(c, L, Ty+10*s, W, H-10*s, P.wood);
    roofTri(c, cx, Ty+11*s, W/2+3*s, 11*s, P.red, '#ff8a92');
    window4(c, L+5*s, Ty+16*s, 7*s, 6*s, true);
    c.fillStyle = P.wood3; c.fillRect(Math.round(cx+3*s), Math.round(groundY-11*s), Math.round(8*s), Math.round(11*s));
    c.fillStyle = P.gold;  c.fillRect(Math.round(cx+9*s), Math.round(groundY-6*s), 1, 1);
    /* chimney + smoke */
    c.fillStyle = P.stone2; c.fillRect(Math.round(cx+7*s), Math.round(Ty+2*s), Math.round(5*s), Math.round(9*s));
    c.fillStyle = P.stone3; c.fillRect(Math.round(cx+7*s), Math.round(Ty+2*s), Math.round(5*s), 1);
  } else if (type === 'sawmill') {
    outline(L, Ty+8*s, W, H-8*s);
    planks(c, L, Ty+8*s, W, H-8*s, P.wood2);
    roofTri(c, cx, Ty+9*s, W/2+2*s, 9*s, '#7a4f2a', P.wood);
    /* the wheel, which actually turns */
    const wx = L-2*s, wy = groundY-10*s, rr = 9*s, a = t*1.4;
    c.fillStyle = P.ink; pxEllipse(c,wx,wy,rr+1,rr+1,P.ink);
    pxEllipse(c,wx,wy,rr,rr,P.wood3); pxEllipse(c,wx,wy,rr-3*s,rr-3*s,'#8fd8ff');
    for (let i=0;i<8;i++) {
      const aa = a + i*TAU/8;
      c.fillStyle = P.wood;
      c.fillRect(Math.round(wx+Math.cos(aa)*rr*.7)-1, Math.round(wy+Math.sin(aa)*rr*.7)-1, 3, 3);
    }
    for (let i=0;i<3;i++) { c.fillStyle = P.wood; c.fillRect(Math.round(L+8*s+i*5*s), Math.round(groundY-3*s), Math.round(4*s), Math.round(3*s)); }
  } else if (type === 'quarry') {
    outline(L, Ty+12*s, W, H-12*s);
    c.fillStyle = P.stone2; c.fillRect(L, Ty+12*s, W, H-12*s);
    pxDither(c, L, Ty+12*s, W, H-12*s, P.stone3, 0);
    c.fillStyle = P.stone; c.fillRect(L, Ty+12*s, W, 2*s);
    roofTri(c, cx, Ty+13*s, W/2+2*s, 8*s, P.stone3, P.stone2);
    /* mine mouth */
    c.fillStyle = P.ink; pxEllipse(c, cx, groundY-1, 8*s, 8*s, P.ink);
    c.fillStyle = P.shadow; pxEllipse(c, cx, groundY, 6*s, 6*s, '#0d0720');
    c.fillStyle = P.wood2;
    c.fillRect(Math.round(cx-9*s), Math.round(groundY-10*s), Math.round(2*s), Math.round(10*s));
    c.fillRect(Math.round(cx+7*s), Math.round(groundY-10*s), Math.round(2*s), Math.round(10*s));
    c.fillRect(Math.round(cx-9*s), Math.round(groundY-11*s), Math.round(18*s), Math.round(2*s));
    spr(c,'i_stone', cx+8*s, groundY-8*s, { center:true });
  } else if (type === 'well') {
    outline(L+4*s, Ty+14*s, W-8*s, H-14*s);
    c.fillStyle = P.stone2; c.fillRect(L+4*s, Ty+14*s, W-8*s, H-14*s);
    pxDither(c, L+4*s, Ty+14*s, W-8*s, H-14*s, P.stone3, 1);
    /* glowing water */
    const gl = .6+.4*Math.sin(t*2.2);
    c.fillStyle = P.purple2; c.fillRect(Math.round(L+6*s), Math.round(Ty+14*s), Math.round(W-12*s), Math.round(4*s));
    c.globalAlpha = gl; c.fillStyle = P.purple;
    c.fillRect(Math.round(L+6*s), Math.round(Ty+14*s), Math.round(W-12*s), Math.round(3*s));
    c.globalAlpha = 1;
    c.fillStyle = P.wood2;
    c.fillRect(Math.round(L+4*s), Math.round(Ty+2*s), Math.round(2*s), Math.round(13*s));
    c.fillRect(Math.round(L+W-6*s), Math.round(Ty+2*s), Math.round(2*s), Math.round(13*s));
    roofTri(c, cx, Ty+4*s, W/2, 7*s, P.purple2, P.purple);
    c.fillStyle = P.wood3; c.fillRect(Math.round(cx-1), Math.round(Ty+6*s), 2, Math.round(6*s));
    c.globalAlpha = .5; pxEllipse(c, cx, Ty+13*s, 10*s*gl, 5*s*gl, P.purple); c.globalAlpha = 1;
  } else if (type === 'forge') {
    outline(L, Ty+9*s, W, H-9*s);
    c.fillStyle = P.stone3; c.fillRect(L, Ty+9*s, W, H-9*s);
    pxDither(c, L, Ty+9*s, W, H-9*s, P.stone2, 0);
    roofTri(c, cx, Ty+10*s, W/2+2*s, 9*s, '#5b3a1b', P.wood2);
    /* forge mouth, breathing */
    const f = .7+.3*Math.sin(t*6.1);
    c.fillStyle = P.ink; c.fillRect(Math.round(cx-7*s), Math.round(groundY-11*s), Math.round(14*s), Math.round(11*s));
    c.fillStyle = P.red2; c.fillRect(Math.round(cx-6*s), Math.round(groundY-10*s), Math.round(12*s), Math.round(10*s));
    c.globalAlpha = f; c.fillStyle = P.orange;
    c.fillRect(Math.round(cx-5*s), Math.round(groundY-8*s), Math.round(10*s), Math.round(8*s));
    c.fillStyle = P.gold; c.fillRect(Math.round(cx-3*s), Math.round(groundY-5*s), Math.round(6*s), Math.round(5*s));
    c.globalAlpha = 1;
    spr(c,'anvil', cx+10*s, groundY-10*s, { center:true });
  } else if (type === 'nest') {
    outline(L+2*s, Ty+12*s, W-4*s, H-12*s);
    planks(c, L+2*s, Ty+12*s, W-4*s, H-12*s, '#d9a45c');
    roofTri(c, cx, Ty+13*s, W/2+2*s, 10*s, P.green2, P.green);
    /* straw nest with an egg in it */
    c.fillStyle = '#e0c060'; pxEllipse(c, cx, groundY-6*s, 9*s, 4*s, '#e0c060');
    c.fillStyle = '#c09a3a'; pxEllipse(c, cx, groundY-5*s, 8*s, 3*s, '#c09a3a');
    spr(c,'i_egg', cx, groundY-10*s, { center:true, scale:s });
    c.fillStyle = P.ink;
    for (let i=0;i<5;i++) c.fillRect(Math.round(cx-9*s+i*4*s), Math.round(groundY-7*s), Math.round(3*s), 1);
  } else if (type === 'library') {
    outline(L, Ty+9*s, W, H-9*s);
    c.fillStyle = '#e7dcc6'; c.fillRect(L, Ty+9*s, W, H-9*s);
    c.fillStyle = '#cbbfa4'; for (let j=0;j<4;j++) c.fillRect(L, Ty+(12+j*5)*s, W, 1);
    roofTri(c, cx, Ty+10*s, W/2+3*s, 10*s, P.blue2, P.blue);
    /* columns */
    c.fillStyle = '#fffdf5';
    c.fillRect(Math.round(L+3*s), Math.round(Ty+12*s), Math.round(3*s), Math.round(H-12*s));
    c.fillRect(Math.round(L+W-6*s), Math.round(Ty+12*s), Math.round(3*s), Math.round(H-12*s));
    /* shelves of little books */
    for (let i=0;i<5;i++) { c.fillStyle = [P.red,P.blue,P.green,P.gold,P.purple][i];
      c.fillRect(Math.round(L+9*s+i*3*s), Math.round(Ty+15*s), Math.round(2*s), Math.round(5*s)); }
    c.fillStyle = P.wood3; c.fillRect(Math.round(cx-4*s), Math.round(groundY-9*s), Math.round(8*s), Math.round(9*s));
    spr(c,'i_book', cx, Ty+3*s, { center:true, scale:s });
  } else if (type === 'gym') {
    outline(L+2*s, Ty+11*s, W-4*s, H-11*s);
    planks(c, L+2*s, Ty+11*s, W-4*s, H-11*s, P.wood2);
    roofTri(c, cx, Ty+12*s, W/2+2*s, 9*s, P.orange, '#ffc48a');
    /* a straw dummy that wobbles */
    const wob = Math.sin(t*3)*2*s;
    c.fillStyle = P.wood3; c.fillRect(Math.round(cx-1+wob*.3), Math.round(groundY-14*s), 2, Math.round(14*s));
    c.fillStyle = '#e0c060'; pxEllipse(c, cx+wob, groundY-16*s, 5*s, 5*s, '#e0c060');
    c.fillStyle = '#c09a3a'; pxEllipse(c, cx+wob, groundY-15*s, 4*s, 3*s, '#c09a3a');
    c.fillStyle = P.wood3; c.fillRect(Math.round(cx-7*s+wob), Math.round(groundY-13*s), Math.round(14*s), Math.round(2*s));
  }
  /* upgrade pips on the roof ridge */
  for (let i=0;i<Math.min(lvl,5);i++)
    spr(c, 'i_star', cx - (Math.min(lvl,5)*6*s)/2 + i*6*s + 3*s, Ty - 2*s, { center:true, scale:Math.max(1,Math.round(s*.6)) });
  return { x:L, y:Ty, w:W, h:H };
}

/* A home island with a real plateau: a grass disc seen at an angle, sitting
   on a cone of dirt. Everything can then stand *on* it at a believable
   depth instead of floating in front of a flat cut-out. */
function drawPlateau(c, cx, cy, rx, ry, depth, opt) {
  opt = opt || {};
  const r = srnd(opt.seed || 7);
  const g1 = opt.grass || P.grass, g2 = opt.grass2 || P.grass2, g3 = opt.grass3 || P.grass3;
  const d1 = opt.dirt || P.dirt, d2 = opt.dirt2 || P.dirt2, d3 = opt.dirt3 || P.dirt3;

  /* the cone underneath, widest where the disc is widest */
  for (let i=0;i<depth;i++) {
    const k = i/depth;
    let hw = Math.round(rx*Math.pow(1-k,.72) + Math.sin(i*.42+(opt.seed||7))*2*(1-k));
    if (hw < 1) break;
    const y = Math.round(cy + i);
    c.fillStyle = k < .16 ? d1 : k < .5 ? d2 : d3;
    c.fillRect(Math.round(cx-hw), y, hw*2, 1);
    c.fillStyle = rgba('#000000',.16);
    const sh = Math.max(1, Math.round(hw*.2));
    c.fillRect(Math.round(cx+hw-sh), y, sh, 1);
    c.fillStyle = rgba('#ffffff',.06);
    c.fillRect(Math.round(cx-hw), y, Math.max(1,Math.round(hw*.12)), 1);
    if (i % 9 === 4) pxDither(c, cx-hw+3, y, hw*2-6, 1, rgba(d3,.45), i);
    if (i % 17 === 8) { c.fillStyle = rgba(d3,.55); c.fillRect(Math.round(cx-hw+2), y, hw*2-4, 1); }
    if (i % 17 === 9) { c.fillStyle = rgba('#ffffff',.07); c.fillRect(Math.round(cx-hw+2), y, hw*2-4, 1); }
  }
  /* rocks poking out of the cone */
  for (let i=0;i<Math.max(3,Math.round(rx/26));i++) {
    const k = .1 + r()*.55;
    const hw = rx*Math.pow(1-k,.72);
    const x = cx + (r()-.5)*hw*1.5, y = cy + k*depth, rr = 2+r()*3;
    pxEllipse(c, x, y, rr, rr*.72, P.stone2);
    pxEllipse(c, x, y-1, rr*.6, rr*.38, P.stone);
  }
  /* the grass disc */
  for (let j=-ry;j<=ry;j++) {
    const k = 1-(j/ry)*(j/ry); if (k < 0) continue;
    const hw = Math.floor(rx*Math.sqrt(k));
    const y = Math.round(cy+j);
    const depthK = (j+ry)/(ry*2);             /* 0 at the back, 1 at the front */
    c.fillStyle = depthK < .1 ? g2 : depthK < .78 ? g1 : g2;
    c.fillRect(Math.round(cx-hw), y, hw*2, 1);
    if (depthK > .9) { c.fillStyle = g3; c.fillRect(Math.round(cx-hw), y, hw*2, 1); }
  }
  /* bright lip along the back edge, dark line along the front */
  for (let j=-ry;j<-ry+3;j++) {
    const k = 1-(j/ry)*(j/ry); if (k < 0) continue;
    const hw = Math.floor(rx*Math.sqrt(k));
    c.fillStyle = P.grassLt; c.fillRect(Math.round(cx-hw), Math.round(cy+j), hw*2, 1);
  }
  pxDither(c, cx-rx*.7, cy-ry*.4, rx*1.4, ry*1.1, rgba(P.grassLt,.4), 0);
  /* tufts around the whole rim */
  for (let i=0;i<Math.round(rx/5);i++) {
    const a = r()*TAU;
    const x = Math.round(cx + Math.cos(a)*rx*.97), y = Math.round(cy + Math.sin(a)*ry*.97);
    const h = 1 + Math.round(r()*2);
    c.fillStyle = P.grassLt; c.fillRect(x, y-h, 1, h);
  }
  /* roots hanging off the front rim */
  for (let i=0;i<Math.round(rx/18);i++) {
    const t2 = (r()-.5)*1.6;
    const x = Math.round(cx + Math.sin(t2)*rx*.9), y = Math.round(cy + Math.cos(t2)*ry*.92);
    const len = Math.round(6 + r()*16);
    for (let j=0;j<len;j++) {
      c.fillStyle = j > len*.6 ? P.grass3 : P.grass2;
      c.fillRect(x + Math.round(Math.sin(j*.4+i)*1.2), y+j, 1, 1);
    }
  }
}
</script>
<script>
/* =========================================================================
   AVATAR — you, made of about four hundred pixels.

   The body is painted procedurally so hair colour, shirt colour and skin
   tone are live values rather than twelve hand-drawn variants. Each finished
   pose is then stamped with a hard outline (draw the silhouette four times,
   one pixel out, then the art on top) which is what gives everything that
   sticker look.
   ========================================================================= */
const AV = (() => {
  const W = 26, H = 34, FEET = H-2;
  const cache = new Map();

  const SKINS  = ['#ffd2ab','#f0b184','#d18a5c','#a86238','#7a4526','#5a3320'];
  const HAIRS  = ['#3a2a1e','#6b4423','#c98b3a','#ffd23f','#e0523a','#ff5fb8','#a35cff','#49a7ff','#3fe07a','#e7dcc6','#1b1030','#46ecd5'];
  const SHIRTS = ['#ff4d5e','#49a7ff','#3fe07a','#ffd23f','#a35cff','#ff5fb8','#46ecd5','#ff9330','#fffdf5','#2e1b50'];
  const PANTS  = ['#2358c9','#434f74','#8a5a2c','#1b1030','#6a27c8','#1d9a52'];
  const STYLES = ['short','long','spike','bun','curly','buzz'];
  const TOPS   = ['plain','stripe','hoodie'];

  const defaults = () => ({
    body:1, skin:0, hair:0, hairCol:1, shirt:0, shirtCol:0, pants:0, top:0
  });

  /* ---- the painter. everything positions off the feet ------------------- */
  function paint(c, cfg, pose, f) {
    const skin = SKINS[cfg.skin % SKINS.length];
    const skinD = shade(skin,-.22), skinL = shade(skin,.22);
    const hair = HAIRS[cfg.hairCol % HAIRS.length];
    const hairD = shade(hair,-.3), hairL = shade(hair,.3);
    const shirt = SHIRTS[cfg.shirtCol % SHIRTS.length];
    const shirtD = shade(shirt,-.25), shirtL = shade(shirt,.28);
    const pant = PANTS[cfg.pants % PANTS.length], pantD = shade(pant,-.28);
    const slim = cfg.body === 0;                       /* silhouette width */
    const cx = Math.round(W/2);
    const R = (x,y,w,h,col) => { c.fillStyle = col; c.fillRect(Math.round(cx+x), Math.round(FEET+y), Math.round(w), Math.round(h)); };

    /* pose offsets: body bob, lean, leg split, arm angle */
    let bob = 0, lean = 0, legA = 0, legB = 0, armA = 0, armB = 0, headT = 0, squash = 0;
    if (pose === 'idle')  { bob = f === 1 ? -1 : 0; armA = f === 1 ? -1 : 0; }
    else if (pose === 'walk') {
      const k = f % 4;
      bob  = (k === 1 || k === 3) ? -1 : 0;
      legA = [0,-2,0,2][k]; legB = -legA;
      armA = [0,2,0,-2][k]; armB = -armA;
    } else if (pose === 'dance') {
      lean = f % 2 ? 2 : -2; bob = f % 2 ? -2 : 0;
      armA = -7; armB = -7; headT = f % 2 ? -1 : 1; legA = f % 2 ? -1 : 1; legB = -legA;
    } else if (pose === 'cheer') { bob = -2; armA = -9; armB = -9; }
    else if (pose === 'wave')    { armB = -8; bob = f === 1 ? -1 : 0; }
    else if (pose === 'sit')     { bob = 4; legA = 0; legB = 0; }
    else if (pose === 'sleep')   { bob = 0; }
    else if (pose === 'attack')  { lean = 3; armB = -6; bob = -1; }
    else if (pose === 'hurt')    { lean = -3; bob = 1; squash = 1; }

    /* --- sleeping is drawn lying down, so it gets its own little routine -- */
    if (pose === 'sleep') {
      const yy = -6;
      R(-11,yy+4,22,6,shirt); R(-11,yy+8,22,2,shirtD);
      R(6,yy+4,6,6,pant); R(9,yy+9,4,2,pantD);
      /* head on the left, hair spread on the ground */
      R(-16,yy+1,8,8,skin); R(-16,yy+1,8,2,skinL); R(-16,yy+7,8,2,skinD);
      R(-18,yy,10,3,hair); R(-18,yy+3,3,6,hair); R(-18,yy,10,1,hairL);
      R(-13,yy+4,1,1,P.ink); R(-11,yy+4,1,1,P.ink);   /* closed eyes: dashes */
      R(-13,yy+4,2,1,P.ink); R(-10,yy+4,2,1,P.ink);
      R(-1,yy+3,3,1,shirtL);
      return;
    }

    const y0 = bob;                                    /* feet stay planted */
    /* --- legs ------------------------------------------------------------ */
    if (pose === 'sit') {
      R(-6+lean,-8+y0,5,7,pant); R(1+lean,-8+y0,5,7,pant);
      R(-6+lean,-2+y0,5,2,pantD); R(1+lean,-2+y0,5,2,pantD);
      R(-8+lean,-2+y0,4,2,'#2e1b50'); R(4+lean,-2+y0,4,2,'#2e1b50');
    } else {
      R(-5+lean+legA*0.4,-8+y0,4,6,pant);  R(1+lean+legB*0.4,-8+y0,4,6,pant);
      R(-5+lean+legA*0.4,-4+y0,4,2,pantD); R(1+lean+legB*0.4,-4+y0,4,2,pantD);
      R(-6+lean+legA*0.6,-2+y0,5,2,'#2e1b50'); R(1+lean+legB*0.6,-2+y0,5,2,'#2e1b50');
      R(-6+lean+legA*0.6,-2+y0,5,1,'#4a3a70'); R(1+lean+legB*0.6,-2+y0,5,1,'#4a3a70');
    }
    /* --- torso ----------------------------------------------------------- */
    const bw = slim ? 9 : 11, bx = -Math.floor(bw/2) + lean;
    R(bx,-17+y0+squash,bw,10-squash,shirt);
    R(bx,-17+y0+squash,bw,2,shirtL);
    R(bx,-9+y0,bw,2,shirtD);
    if (cfg.top === 1) { R(bx,-14+y0,bw,2,shirtL); R(bx,-11+y0,bw,1,shirtL); }
    if (cfg.top === 2) {                              /* hoodie: hood + pocket */
      R(bx-1,-18+y0,bw+2,3,shirtD);
      R(bx+2,-12+y0,bw-4,3,shirtD);
      R(cx*0-0+lean,-19+y0,1,2,shirtL);
    }
    /* --- arms ------------------------------------------------------------ */
    const aw = 3;
    R(bx-aw,-16+y0+armA*0.5,aw,7,shirtD);
    R(bx+bw,-16+y0+armB*0.5,aw,7,shirtD);
    R(bx-aw,-10+y0+armA,aw,3,skin);                   /* hands */
    R(bx+bw,-10+y0+armB,aw,3,skin);
    /* --- head ------------------------------------------------------------ */
    const hy = -27+y0, hx = lean + headT;
    R(hx-5,hy,10,10,skin);
    R(hx-5,hy,10,1,skinL); R(hx-5,hy+9,10,1,skinD);
    R(hx-6,hy+2,1,6,skin); R(hx+5,hy+2,1,6,skin);     /* ears */
    R(hx-6,hy+4,1,2,skinD); R(hx+5,hy+4,1,2,skinD);
    /* eyes — a white, a pupil, a glint */
    const blink = pose === 'blink';
    if (blink) { R(hx-4,hy+5,3,1,P.ink); R(hx+1,hy+5,3,1,P.ink); }
    else {
      R(hx-4,hy+4,3,3,'#ffffff'); R(hx+1,hy+4,3,3,'#ffffff');
      R(hx-3,hy+5,2,2,P.ink);     R(hx+2,hy+5,2,2,P.ink);
      R(hx-3,hy+5,1,1,'#ffffff'); R(hx+2,hy+5,1,1,'#ffffff');
    }
    R(hx-5,hy+7,2,1,rgba('#ff8090',.6)); R(hx+3,hy+7,2,1,rgba('#ff8090',.6));  /* blush */
    if (pose === 'cheer' || pose === 'dance') { R(hx-2,hy+8,4,2,'#8a2a3a'); R(hx-1,hy+8,2,1,'#ff97a4'); }
    else if (pose === 'hurt') { R(hx-2,hy+8,4,1,'#8a2a3a'); R(hx-2,hy+7,1,1,'#8a2a3a'); R(hx+1,hy+7,1,1,'#8a2a3a'); }
    else R(hx-1,hy+8,3,1,'#8a2a3a');
    /* --- hair ------------------------------------------------------------ */
    const st = STYLES[cfg.hair % STYLES.length];
    R(hx-5,hy-1,10,3,hair); R(hx-6,hy+1,1,3,hair); R(hx+5,hy+1,1,3,hair);
    R(hx-5,hy-1,10,1,hairL);
    if (st === 'short') { R(hx-5,hy+2,3,2,hair); R(hx+3,hy+2,2,1,hairD); }
    else if (st === 'buzz') { R(hx-5,hy-1,10,2,hairD); R(hx-5,hy-1,10,1,hair); }
    else if (st === 'long') {
      R(hx-7,hy+1,2,11,hair); R(hx+5,hy+1,2,11,hair);
      R(hx-7,hy+10,2,2,hairD); R(hx+5,hy+10,2,2,hairD);
      R(hx-7,hy+1,1,7,hairL);
    } else if (st === 'spike') {
      for (let i=0;i<5;i++) { R(hx-5+i*2,hy-2-(i%2?2:1),2,3,hair); R(hx-5+i*2,hy-2-(i%2?2:1),1,1,hairL); }
      R(hx-6,hy+1,2,3,hair);
    } else if (st === 'bun') {
      R(hx-2,hy-5,5,4,hair); R(hx-2,hy-5,5,1,hairL); R(hx-3,hy-4,1,2,hairD); R(hx+3,hy-4,1,2,hairD);
      R(hx+5,hy+2,2,5,hair);
    } else if (st === 'curly') {
      R(hx-7,hy,3,3,hair); R(hx+4,hy,3,3,hair); R(hx-4,hy-3,4,3,hair); R(hx+1,hy-3,4,3,hair);
      R(hx-7,hy+2,2,4,hair); R(hx+5,hy+2,2,4,hair); R(hx-4,hy-3,2,1,hairL);
    }
  }

  /* outline pass — the thing that makes it pop off the background */
  function render(cfg, pose, f) {
    const key = [cfg.body,cfg.skin,cfg.hair,cfg.hairCol,cfg.shirtCol,cfg.pants,cfg.top,pose,f].join(',');
    if (cache.has(key)) return cache.get(key);
    const base = surface(W,H), b = base.getContext('2d');
    paint(b, cfg, pose, f);
    const sil = surface(W,H), s = sil.getContext('2d');
    s.drawImage(base,0,0); s.globalCompositeOperation = 'source-in';
    s.fillStyle = P.ink; s.fillRect(0,0,W,H);
    const out = surface(W,H), o = out.getContext('2d');
    o.drawImage(sil,-1,0); o.drawImage(sil,1,0); o.drawImage(sil,0,-1); o.drawImage(sil,0,1);
    o.drawImage(base,0,0);
    if (cache.size > 260) cache.clear();
    cache.set(key,out);
    return out;
  }

  return {
    W, H, SKINS, HAIRS, SHIRTS, PANTS, STYLES, TOPS, defaults, render,
    /* draw with feet at (x,y) */
    draw(c, x, y, cfg, pose, f, opt) {
      opt = opt || {};
      const img = render(cfg, pose||'idle', f||0);
      const sc = opt.scale || 1;
      const dx = Math.round(x - (W/2)*sc), dy = Math.round(y - (H-2)*sc);
      if (opt.shadow !== false) {
        c.globalAlpha = .22;
        pxEllipse(c, Math.round(x), Math.round(y), Math.round(7*sc), Math.round(2.5*sc), '#000');
        c.globalAlpha = 1;
      }
      if (opt.alpha != null) c.globalAlpha = opt.alpha;
      if (opt.flip) { c.save(); c.translate(dx+W*sc, dy); c.scale(-1,1); c.drawImage(img,0,0,W*sc,H*sc); c.restore(); }
      else c.drawImage(img, dx, dy, W*sc, H*sc);
      c.globalAlpha = 1;
      if (opt.glow) {
        c.globalAlpha = .3 + .2*Math.sin(performance.now()/180);
        c.globalCompositeOperation = 'lighter';
        c.drawImage(img, dx, dy-1, W*sc, H*sc);
        c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
      }
    },
    randomCfg() {
      return { body:rndi(0,1), skin:rndi(0,SKINS.length-1), hair:rndi(0,STYLES.length-1),
               hairCol:rndi(0,HAIRS.length-1), shirt:0, shirtCol:rndi(0,SHIRTS.length-1),
               pants:rndi(0,PANTS.length-1), top:rndi(0,2) };
    }
  };
})();

  Q.cells = [
    ['Which part is the control centre of the cell?','Nucleus','Ribosome','Vacuole','Cell wall'],
    ['Where does aerobic respiration happen?','Mitochondria','Nucleus','Chloroplast','Cytoplasm'],

    ['What is the correct order of mitosis?','Prophase, Metaphase, Anaphase, Telophase','Metaphase, Prophase, Anaphase, Telophase','Anaphase, Telophase, Prophase, Metaphase','Telophase, Anaphase, Metaphase, Prophase'],
    ['In prophase the chromosomes...','Condense and become visible','Line up in the middle','Are pulled apart','Form two new nuclei'],
    ['In metaphase the chromosomes...','Line up along the equator','Condense','Are pulled to the poles','Disappear'],
    ['In anaphase...','Sister chromatids are pulled apart','Chromosomes line up','The cell wall forms','DNA is copied'],
    ['In telophase...','Two new nuclei form','Chromosomes line up','DNA replicates','The cell grows'],
    ['What is cytokinesis?','The cytoplasm divides in two','DNA copying','Chromosomes condensing','The nucleus forming'],
    ['How many daughter cells does mitosis produce?','2','4','1','8'],
    ['Daughter cells from mitosis are...','Genetically identical','All different','Half the chromosomes','Always smaller forever'],
    ['A plant cell wall is made of...','Cellulose','Protein','Fat','Chitin'],

    ['Meiosis produces...','4 cells with half the chromosomes','2 identical cells','1 large cell','8 identical cells'],

  Q.elements = [

    ['Friction always acts...','Opposite to motion','With the motion','Downwards','Upwards'],
    ['At terminal velocity the forces are...','Balanced','Unbalanced','Zero','Increasing'],
    ['100 m travelled in 20 s is a speed of...','5 m/s','2 m/s','2000 m/s','0.2 m/s'],
    ['KE = 0.5mv^2. m = 2 kg, v = 3 m/s. KE = ?','9 J','6 J','18 J','3 J'],
    ['The SI unit of mass is the...','Kilogram','Newton','Gram','Pound'],
    ['GPE = mgh. m = 2, g = 10, h = 5. GPE = ?','100 J','17 J','25 J','50 J'],
    ['Speed is a...','Scalar','Vector','Force','Unit'],
    ['A vector has magnitude and...','Direction','Mass','Energy','Time'],
    ['Work done = force x ...','Distance moved','Time','Mass','Speed'],
    ['A resultant force of zero means...','No acceleration','No movement ever','Instant stop','Infinite speed'],

    ['Doubling the speed of a car multiplies its KE by...','4','2','8','1']

  /* ==== MATCHING & SEQUENCING SETS ====================================== */
  const MATCHES = {
    cells: [['Nucleus','Holds the DNA'],['Mitochondria','Releases energy'],['Chloroplast','Makes glucose'],
            ['Ribosome','Builds proteins'],['Cell membrane','Controls entry'],['Vacuole','Stores cell sap']],
    elements: [['Na','Sodium'],['Fe','Iron'],['K','Potassium'],['Au','Gold'],['O','Oxygen'],['He','Helium']],
    forces: [['Newton','Force'],['Joule','Energy'],['Watt','Power'],['m/s','Speed'],['Kilogram','Mass'],['Pascal','Pressure']],
    graphs: [['m','Gradient'],['c','y-intercept'],['Origin','(0, 0)'],['Parabola','y = x squared'],
             ['Horizontal','y = 4'],['Vertical','x = 4']],
    algebra: [['3(x+2)','3x + 6'],['x^2 + 2x','x(x + 2)'],['4a + 3a','7a'],['x^3 x x^2','x^5'],
              ['2x = 10','x = 5'],['x/4 = 3','x = 12']],

  };
  /* graph minigame rounds: match the line y = mx + c */
  const GRAPHS = {
    graphs: [ {m:1,c:0}, {m:2,c:1}, {m:-1,c:3}, {m:0.5,c:-2}, {m:-2,c:4}, {m:3,c:-1} ],
    algebra:[ {m:2,c:0}, {m:-1,c:2}, {m:1,c:-3}, {m:-0.5,c:1} ],
    forces: [ {m:2,c:0}, {m:5,c:0}, {m:-1,c:5}, {m:0.5,c:2} ]
  };

  /* ==== ISLANDS ========================================================== */
  /* node kinds: fight elite boss match seq graph gather rest */
  const trail = (kinds) => kinds.map((k,i) => ({ kind:k, i }));
  const PACKS = [
    { id:'algebra', name:'EMBER ALGEBRA', sub:'solve for x, or else',
      col:'#ff9330', col2:'#ff4d5e', el:'fire', icon:'i_flame', sky:{ top:'#e0522a', mid:'#ff9330', bot:'#ffd7a8' },
      bank:'algebra', enemies:['slime','bat','shroom','batB','golem'], boss:'seraph',
      nodes:trail(['fight','match','fight','gather','elite','seq','fight','graph','fight','boss']) },
    { id:'graphs', name:'PRISM PEAK', sub:'lines, gradients, intercepts',
      col:'#49a7ff', col2:'#2358c9', el:'water', icon:'i_bolt', sky:{ top:'#2358c9', mid:'#49a7ff', bot:'#b6ecff' },
      bank:'graphs', enemies:['wisp','bat','slimeB','wispB','golem'], boss:'wyrm',
      nodes:trail(['fight','graph','fight','match','elite','gather','graph','seq','fight','boss']) },
    { id:'fractions', name:'CASCADE FALLS', sub:'fractions, ratio, percent',
      col:'#46ecd5', col2:'#1a9e93', el:'water', icon:'i_flask', sky:{ top:'#1a9e93', mid:'#46ecd5', bot:'#ccfff6' },
      bank:'fractions', enemies:['slimeB','slime','wisp','shroom','batB'], boss:'golemB',
      nodes:trail(['fight','match','gather','fight','seq','elite','fight','match','fight','boss']) },
    { id:'cells', name:'VERDANT GROVE', sub:'cells, mitosis, life',
      col:'#3fe07a', col2:'#1d9a52', el:'nature', icon:'i_paw', sky:{ top:'#1d9a52', mid:'#54d64a', bot:'#ddffc0' },
      bank:'cells', enemies:['shroom','slime','shroomB','bat','golem'], boss:'wyrm',
      nodes:trail(['fight','seq','fight','match','gather','elite','seq','fight','fight','boss']) },
    { id:'elements', name:'CINDER FORGE', sub:'atoms, bonds, the table',
      col:'#a35cff', col2:'#6a27c8', el:'arcane', icon:'i_essence', sky:{ top:'#3b1e6e', mid:'#8b3fa8', bot:'#ffb0c8' },
      bank:'elements', enemies:['golem','batB','wispB','shroomB','golemB'], boss:'seraph',
      nodes:trail(['fight','match','fight','seq','elite','gather','fight','match','fight','boss']) },
    { id:'forces', name:'STORMCLIFF', sub:'forces, motion, energy',
      col:'#ffd23f', col2:'#f0a022', el:'storm', icon:'i_star', sky:{ top:'#2c3f8f', mid:'#6c8cff', bot:'#ffe9a8' },
      bank:'forces', enemies:['wisp','wispB','golem','wyrm','batB'], boss:'seraphB',
      nodes:trail(['fight','graph','fight','match','elite','seq','gather','fight','graph','boss']) }
  ];

  /* ==== expansion ======================================================== */
  function expand(row) {
    return { q:row[0], a:row[1], o:shuffle([row[1],row[2],row[3],row[4]]) };
  }
  const bags = {};
  function question(bankId) {
    const bank = Q[bankId] || Q.algebra;
    if (!bags[bankId]) bags[bankId] = Bag(bank);
    return expand(bags[bankId].next());
  }
  /* a custom deck of {term, def} becomes a question bank, with the wrong
     options drawn from the other cards in the same deck */
  function deckToBank(deck) {
    const cards = deck.cards.filter(c => c.term && c.def);
    if (cards.length < 2) return [];
    return cards.map(c => {
      const others = shuffle(cards.filter(o => o !== c)).slice(0,3).map(o => o.def);
      while (others.length < 3) others.push('None of these');
      return [ (deck.prompt || 'What matches:') + ' ' + c.term, c.def, others[0], others[1], others[2] ];
    });
  }
  function customQuestion(deck) {
    const key = 'custom:'+deck.id;
    if (!bags[key] || bags[key].size !== deck.cards.length) {
      const bank = deckToBank(deck);
      if (!bank.length) return { q:'This deck is empty. Add two cards.', a:'OK', o:['OK'] };
      bags[key] = Bag(bank);
    }
    return expand(bags[key].next());
  }
  function deckMatches(deck) {
    return shuffle(deck.cards.filter(c => c.term && c.def)).slice(0,6).map(c => [c.term, c.def]);
  }

  return { ENEMIES, ELEM, CARDS, POWERS, PACKS, Q, MATCHES, SEQUENCES, GRAPHS,
           question, customQuestion, deckToBank, deckMatches,
           pack: id => PACKS.find(p => p.id === id) };
})();

<script>
/* =========================================================================
   STATE — the save file, the economy, the ladder.

   Everything persistent lives in S. Resource buildings keep producing while
   the tab is shut, which is the quiet idle half of the game; the loud half
   is the trophy ladder, where rivals drift up and down while you are away
   so the leaderboard is never the same twice.
   ========================================================================= */
const SAVE_KEY = 'aetheria.save.v1';

/* ---- building catalogue -------------------------------------------------- */
const BUILDINGS = {
  house:   { name:'COTTAGE',  desc:'Home. Sleep here to bank your streak.', icon:'i_heart',
             cost:{}, res:null, rate:0, cap:0, maxLvl:5, up:{ coins:120, wood:40 } },
  sawmill: { name:'SAWMILL',  desc:'Turns the grove into planks.', icon:'i_wood',
             cost:{ coins:60 }, res:'wood', rate:7, cap:90, maxLvl:6, up:{ coins:140, wood:50 } },
  quarry:  { name:'QUARRY',   desc:'Chews rock into blocks.', icon:'i_stone',
             cost:{ coins:110, wood:30 }, res:'stone', rate:5, cap:70, maxLvl:6, up:{ coins:180, stone:40 } },
  well:    { name:'MANA WELL',desc:'Draws essence out of the cloud.', icon:'i_essence',
             cost:{ coins:200, stone:40 }, res:'essence', rate:3, cap:45, maxLvl:6, up:{ coins:260, essence:25 } },
  forge:   { name:'FORGE',    desc:'Hammers resources into armour.', icon:'i_sword',
             cost:{ coins:250, wood:60, stone:60 }, res:null, rate:0, cap:0, maxLvl:5, up:{ coins:320, stone:80 } },
  nest:    { name:'NESTRY',   desc:'Warms eggs between battles.', icon:'i_egg',
             cost:{ coins:180, wood:80 }, res:null, rate:0, cap:0, maxLvl:4, up:{ coins:240, wood:100 } },
  library: { name:'LIBRARY',  desc:'Writes your custom lessons. Trickles XP.', icon:'i_book',
             cost:{ coins:150, wood:50 }, res:'xp', rate:2, cap:30, maxLvl:5, up:{ coins:220, essence:20 } },
  gym:     { name:'TRAINING', desc:'+12 max HP per level.', icon:'i_shield',
             cost:{ coins:220, wood:70, stone:40 }, res:null, rate:0, cap:0, maxLvl:5, up:{ coins:280, stone:70 } }
};
/* where a building can stand on the home island */
const PLOTS = [
  { x: 86, y:334 }, { x:180, y:324 }, { x:274, y:334 },
  { x: 54, y:370 }, { x:306, y:370 },
  { x:112, y:410 }, { x:250, y:410 }, { x:180, y:428 }
];

/* ---- gear ---------------------------------------------------------------- */
const GEAR = {
  weapon: { name:'BLADE',  icon:'i_sword',  stat:'atk', per:4, cost:l => ({ wood:20+l*18, stone:10+l*14, coins:40+l*40 }) },
  armour: { name:'PLATE',  icon:'i_shield', stat:'def', per:5, cost:l => ({ stone:24+l*20, wood:10+l*10, coins:50+l*45 }) },
  charm:  { name:'CHARM',  icon:'i_essence',stat:'hp',  per:9, cost:l => ({ essence:12+l*12, coins:60+l*50 }) }
};
const GEAR_NAMES = ['PLAIN','COPPER','IRON','SILVER','GOLD','AETHER','STARFORGED'];

/* ---- ranks --------------------------------------------------------------- */
const RANKS = [
  { at:0,    name:'SPROUT',   col:'#8fd86a' }, { at:100,  name:'PEBBLE',   col:'#b9c6dd' },
  { at:220,  name:'BRONZE',   col:'#c08a4a' }, { at:400,  name:'SILVER',   col:'#d9e4ff' },
  { at:620,  name:'GOLD',     col:'#ffd23f' }, { at:900,  name:'PLATINUM', col:'#46ecd5' },
  { at:1250, name:'DIAMOND',  col:'#49a7ff' }, { at:1700, name:'MYTHIC',   col:'#a35cff' },
  { at:2300, name:'LEGEND',   col:'#ff5fb8' }
];
function rankOf(tr) {
  let r = RANKS[0], next = null;
  for (let i=0;i<RANKS.length;i++) if (tr >= RANKS[i].at) { r = RANKS[i]; next = RANKS[i+1] || null; }
  const span = next ? next.at - r.at : 1;
  return { ...r, next, prog: next ? clamp((tr-r.at)/span,0,1) : 1, idx:RANKS.indexOf(r) };
}

const RIVAL_NAMES = ['NOVA','PIXEL','KAI','JUNIPER','ZED','MIRA','OSCAR','LUMI','BRAM','SAGE','TOFU','ECHO',
                     'WREN','ATLAS','CLOVER','RIO','VESPER','QUILL','ONYX','MOSS','SUNNY','BYTE','FERN','ROOK'];

/* ------------------------------------------------------------------------- */
const S = (() => {
  const fresh = () => ({
    v:1, created:Date.now(), name:'SCHOLAR', cfg:AV.defaults(), made:false,
    lvl:1, xp:0, trophies:0, best:0,
    coins:120, gems:5, wood:30, stone:10, essence:0,
    gear:{ weapon:0, armour:0, charm:0 },
    progress:{}, buildings:[{ type:'house', plot:1, lvl:1, stock:0, last:Date.now() }],
    pets:[], activePet:null, eggs:[],
    decks:[], dex:{}, relics:{},
    stats:{ answered:0, correct:0, best:0, battles:0, wins:0, chests:0, chopped:0 },
    dayStreak:1, lastDay:today(), sound:true, seenIntro:false,
    chests:[], rivals:null, lastSeen:Date.now()
  });

  let d = store.get(SAVE_KEY, null);
  if (!d || d.v !== 1) d = fresh();
  else d = Object.assign(fresh(), d, { cfg: Object.assign(AV.defaults(), d.cfg||{}) });

  const api = {
    get d() { return d; },
    save() { d.lastSeen = Date.now(); store.set(SAVE_KEY, d); },
    reset() { d = fresh(); api.save(); },

    /* --- economy -------------------------------------------------------- */
    can(cost) { for (const k in cost) if ((d[k]||0) < cost[k]) return false; return true; },
    pay(cost) { if (!api.can(cost)) return false; for (const k in cost) d[k] -= cost[k]; api.save(); return true; },
    give(res, n) {
      if (res === 'xp') return api.addXp(n);
      d[res] = (d[res]||0) + n; api.save();
    },
    costText(cost) { return Object.keys(cost).map(k => cost[k]+' '+k.toUpperCase()).join('  '); },

    /* --- levels --------------------------------------------------------- */
    xpNeed: lvl => 50 + (lvl-1)*38,
    addXp(n) {
      d.xp += n;
      let ups = 0;
      while (d.xp >= api.xpNeed(d.lvl)) { d.xp -= api.xpNeed(d.lvl); d.lvl++; ups++; }
      api.save();
      return ups;
    },
    maxHp() {
      const gym = api.building('gym');
      return 100 + (d.lvl-1)*8 + d.gear.charm*GEAR.charm.per + (gym ? gym.lvl*12 : 0);
    },
    atk() { return 1 + d.gear.weapon*0.14; },
    def() { return d.gear.armour*GEAR.armour.per; },

    /* --- trophies ------------------------------------------------------- */
    addTrophies(n) {
      d.trophies = Math.max(0, d.trophies + n);
      d.best = Math.max(d.best, d.trophies);
      api.save();
      return rankOf(d.trophies);
    },
    rank() { return rankOf(d.trophies); },

    /* --- rivals, the reason the ladder feels alive ---------------------- */
    rivals() {
      if (!d.rivals) {
        d.rivals = shuffle(RIVAL_NAMES).slice(0,11).map((n,i) => ({
          n, t: Math.max(20, Math.round(120 + i*95 + rnd(-60,60))), cfg: AV.randomCfg()
        }));
      }
      const gone = Math.min(8, (Date.now() - (d.lastSeen||Date.now()))/3600000);
      if (gone > 0.02) {
        for (const r of d.rivals) r.t = Math.max(15, Math.round(r.t + rnd(-14,26)*gone));
        d.lastSeen = Date.now();
      }
      const all = d.rivals.concat([{ n:d.name, t:d.trophies, me:true, cfg:d.cfg }]);
      all.sort((a,b) => b.t - a.t);
      return all;
    },

    /* --- progress ------------------------------------------------------- */
    prog(packId) {
      if (!d.progress[packId]) d.progress[packId] = { cleared:0, stars:{} };
      return d.progress[packId];
    },
    unlockedPacks() {
      const out = [];
      for (let i=0;i<CONTENT.PACKS.length;i++) {
        const p = CONTENT.PACKS[i];
        const prev = i === 0 ? null : S.prog(CONTENT.PACKS[i-1].id);
        out.push({ pack:p, open: i === 0 || (prev && prev.cleared >= 4) });
      }
      return out;
    },
    clearNode(packId, idx, stars) {
      const pr = api.prog(packId);
      pr.stars[idx] = Math.max(pr.stars[idx]||0, stars);
      if (idx >= pr.cleared) pr.cleared = idx+1;
      api.save();
    },
    totalStars() {
      let n = 0;
      for (const k in d.progress) for (const i in d.progress[k].stars) n += d.progress[k].stars[i];
      return n;
    },

    /* --- buildings, including what happened while you were away --------- */
    building(type) { return d.buildings.find(b => b.type === type); },
    place(type, plot) {
      const def = BUILDINGS[type];
      if (!def || !api.pay(def.cost)) return false;
      d.buildings.push({ type, plot, lvl:1, stock:0, last:Date.now() });
      api.save(); return true;
    },
    upgradeCost(b) {
      const def = BUILDINGS[b.type], out = {};
      for (const k in def.up) out[k] = Math.round(def.up[k] * Math.pow(1.55, b.lvl-1));
      return out;
    },
    upgrade(b) {
      const def = BUILDINGS[b.type];
      if (b.lvl >= def.maxLvl) return false;
      if (!api.pay(api.upgradeCost(b))) return false;
      b.lvl++; api.save(); return true;
    },
    prodRate(b) { const def = BUILDINGS[b.type]; return def.rate ? def.rate * b.lvl : 0; },
    prodCap(b)  { const def = BUILDINGS[b.type]; return def.cap ? def.cap * b.lvl : 0; },
    tickBuildings() {                     /* call on load and every second */
      const now = Date.now();
      for (const b of d.buildings) {
        const def = BUILDINGS[b.type];
        if (!def.res) { b.last = now; continue; }
        const mins = (now - (b.last||now)) / 60000;
        if (mins <= 0) continue;
        b.stock = Math.min(api.prodCap(b), (b.stock||0) + mins*api.prodRate(b));
        b.last = now;
      }
    },
    collect(b) {
      const def = BUILDINGS[b.type];
      const n = Math.floor(b.stock||0);
      if (!def.res || n < 1) return 0;
      b.stock -= n; api.give(def.res, n); api.save();
      return n;
    },
    plotFree(i) { return !d.buildings.some(b => b.plot === i); },

    /* --- pets ----------------------------------------------------------- */
    PET_TYPES: [
      { id:'drake',    name:'DRAKE',   el:'nature', dmg:7,  spr:'pet_drake' },
      { id:'owlet',    name:'OWLET',   el:'arcane', dmg:6,  spr:'pet_owlet' },
      { id:'slimepup', name:'PUDDLE',  el:'water',  dmg:8,  spr:'pet_slimepup' },
      { id:'sparkfox', name:'SPARKFOX',el:'storm',  dmg:9,  spr:'pet_sparkfox' }
    ],
    addEgg(type) {
      if (d.eggs.length >= 3) return false;
      const nest = api.building('nest');
      d.eggs.push({ type, heat:0, need: Math.max(6, 14 - (nest ? nest.lvl*2 : 0)) });
      api.save(); return true;
    },
    hatch(egg) {
      const t = api.PET_TYPES.find(p => p.id === egg.type) || api.PET_TYPES[0];
      const pet = { type:t.id, name:t.name, lvl:1, xp:0 };
      d.pets.push(pet);
      d.eggs.splice(d.eggs.indexOf(egg),1);
      if (!d.activePet) d.activePet = d.pets.length-1;
      api.save();
      return pet;
    },
    pet() { return d.activePet != null ? d.pets[d.activePet] : null; },
    petDef(p) { return p ? api.PET_TYPES.find(t => t.id === p.type) : null; },

    /* --- the flashcard dex ---------------------------------------------- */
    sawCard(bank, q, a) {
      const key = bank + '|' + q;
      const e = d.dex[key] || { q, a, bank, seen:0, right:0 };
      e.seen++; d.dex[key] = e;
      return e;
    },
    gotCard(bank, q, right) {
      const e = d.dex[bank + '|' + q];
      if (e && right) e.right++;
    },
    dexList(bank) {
      return Object.keys(d.dex).map(k => d.dex[k]).filter(e => !bank || e.bank === bank);
    },

    /* --- daily streak --------------------------------------------------- */
    checkDay() {
      const t = today();
      if (d.lastDay === t) return 0;
      const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
      d.dayStreak = d.lastDay === y ? d.dayStreak+1 : 1;
      d.lastDay = t;
      const reward = 40 + d.dayStreak*10;
      d.coins += reward; d.gems += 1;
      api.save();
      return reward;
    },

    /* --- chests --------------------------------------------------------- */
    pushChest(rarity, packId) { d.chests.push({ rarity, packId, at:Date.now() }); api.save(); },
    rollRarity(bonus) {
      const r = Math.random() + (bonus||0);
      return r > .965 ? 'legendary' : r > .86 ? 'epic' : r > .6 ? 'rare' : 'common';
    }
  };

  api.tickBuildings();
  return api;
})();

/* the daily goal — the thing that actually gets you to open the app */
S.DAILY_GOAL = 20;
S.daily = function() {
  const d = S.d;
  if (!d.dailyQ || d.dailyQ.day !== today()) d.dailyQ = { day:today(), n:0, claimed:false };
  return d.dailyQ;
};
S.dailyTick = function(n) { const g = S.daily(); g.n += (n||1); S.save(); return g; };
S.claimDaily = function() {
  const g = S.daily();
  if (g.claimed || g.n < S.DAILY_GOAL) return 0;
  g.claimed = true;
  const reward = 80 + S.d.dayStreak*15;
  S.d.coins += reward; S.d.gems += 2;
  S.pushChest(S.rollRarity(.12), null);
  S.save();
  return reward;
};
</script>
<script>
/* =========================================================================
   UI — immediate-mode pixel widgets. A scene calls UI.btn(...) while it
   draws and gets back true on the frame the button is released, so there is
   no widget tree to keep in sync with anything.
   ========================================================================= */
const UI = (() => {
  const press = new Map();          /* id -> 0..1 squash */
  let held = null, toasts = [], time = 0;

  function id(x,y,label) { return label + '@' + Math.round(x) + ',' + Math.round(y); }

  const api = {
    frame(dt) {
      time += dt;
      for (const [k,v] of press) {
        const target = (held === k) ? 1 : 0;
