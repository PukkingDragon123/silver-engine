      if (foe.rival) {
        AV.draw(c, fx, 178, foe.cfg, phase === 'resolve' && act && act.type === 'foeStrike' ? 'attack' : 'idle',
                Math.floor(t*3)%2, { scale:2.6 });
      } else {
        const sq = shakeFoe > 0 ? 1 + shakeFoe*.4 : 1;
        const fsc = foe.boss ? 5 : 4;
        c.globalAlpha = .25; pxEllipse(c, fx, 172, 8*fsc, 2.4*fsc, '#000'); c.globalAlpha = 1;
        spr(c, foe.spr, fx, fy, { center:true, scale:fsc, swap:foe.swap });
        if (foeFlash > 0) spr(c, foe.spr, fx, fy, { center:true, scale:fsc, swap:foe.swap, tint:'#ffffff', tintAmt:foeFlash*4 });
      }
      /* name + hp */
      const hpW = 190;
      ctxt(c, VW/2, 34, foe.name, P.white, 1, P.ink);
      bar(c, VW/2-hpW/2, 44, hpW, 9, foe.hp/foe.maxHp, foe.boss ? P.purple : P.red, { shine:t*.8 });
      if (mode !== 'duel') ctxt(c, VW/2, 56, Math.ceil(foe.hp) + ' / ' + foe.maxHp, P.bone, 1, P.ink);
      else ctxt(c, VW/2 - hpW/2 - 26, 45, Math.ceil(foe.hp), P.bone, 1, P.ink);
      /* intent */
      if (phase !== 'intro' && !foe.rival) {
        const ix = VW/2 + hpW/2 + 10;
        pbox(c, ix-4, 40, 30, 18, rgba(P.ink,.8), 3);
        spr(c, intent <= 1 ? 'i_flame' : 'i_sword', ix, 44, { scale:1 });
        txt(c, ix+13, 45, String(Math.max(1,intent)), intent <= 1 ? P.red : P.gold, 1);
      }
      if (mode === 'duel' && phase === 'q') {
        bar(c, VW/2-hpW/2, 56, hpW, 6, 1 - clamp((me.rivalT||8)/8,0,1), P.pink);
        ctxt(c, VW/2, 66, 'THEY ARE THINKING...', P.pink, 1, P.ink);
      }

      /* --- focus bar (the bar that fills up) ---------------------------- */
      const fby = 210;
      txt(c, 12, fby-1, 'FOCUS', P.cyan, 1, P.ink);
      bar(c, 48, fby-2, 200, 9, me.focus, ultReady ? P.gold : P.cyan, { shine:t*1.4, ticks:5 });
      if (me.combo > 1) {
        const s = 1 + Math.min(me.combo,10)*.06;
        ctxt(c, 300, fby-6, 'x' + me.combo, P.gold, Math.round(clamp(s,1,2)), P.ink);
        ctxt(c, 300, fby+6, 'COMBO', P.orange, 1, P.ink);
      }

      /* --- question ------------------------------------------------------ */
      if (phase === 'q' || phase === 'resolve') {
        const qy = 218;
        panel(c, 8, qy, VW-16, 84, '#241640', { r:4 });
        pbox(c, 8, qy, VW-16, 4, pack.col, 3);
        const lines = wrap(q.q, VW-36, 1);
        const sc = lines.length > 3 ? 1 : 1;
        lines.slice(0,5).forEach((l,i) => ctxt(c, VW/2, qy + 16 + i*11, l, P.white, sc, P.shadow));
        /* time ring */
        const frac = clamp(timeLeft/timeLimit,0,1);
        bar(c, 14, qy+72, VW-28, 6, frac, frac > .5 ? P.lime : frac > .25 ? P.gold : P.red, { shine:t*2 });
        txt(c, 14, qy+62, 'Q' + (answered+1), P.grey, 1);
        txt(c, VW-48, qy+62, Math.ceil(Math.max(0,timeLeft)) + 's', frac > .25 ? P.grey : P.red, 1);
      }

      /* --- answer cards --------------------------------------------------- */
      if ((phase === 'q' || phase === 'resolve') && !keypad) {
        const cw = 166, ch = 84, gx = 10, gy = 308;
        for (let i=0;i<cards.length;i++) {
          const cd = cards[i];
          const col = i%2, row = Math.floor(i/2);
          let x = gx + col*(cw+8), y = gy + row*(ch+8);
          let scale = 1, tilt = cd.tilt;
          /* entry bounce */
          const k = ease.back(cd.in);
          y += (1-k)*40; scale = .8 + .2*k;
          /* the chosen card flies at the enemy */
          if (act && act.i === i && act.type === 'strike') {
            const p2 = clamp(act.t/(act.dur*.55),0,1);
            const e2 = ease.in(p2);
            x = lerp(x, foe.x-cw/2, e2); y = lerp(y, foe.y-ch/2, e2);
            scale = lerp(1, .45, e2); tilt = lerp(cd.tilt, .9, e2);
            FX.trail(x+cw/2, y+ch/2, CONTENT.ELEM[cd.card.el].col);
          } else if (act && act.type === 'strike' && act.t < act.dur) {
            const e3 = ease.out(clamp(act.t/.3,0,1));
            y += e3*20; c.globalAlpha = 1-e3*.7;
          }
          if (act && act.type === 'miss' && act.i === i) {
            x += Math.sin(act.t*60)*5;
          }
          if (cd.dead) c.globalAlpha = .28;
          UI.card(c, x, y, cw, ch, { el:cd.card.el, tilt, scale, dim:cd.dead });
          /* card face */
          c.save();
          c.translate(x+cw/2, y+ch/2); if (tilt) c.rotate(tilt); if (scale!==1) c.scale(scale,scale);
          c.translate(-cw/2,-ch/2);
          const el = CONTENT.ELEM[cd.card.el];
          spr(c, el.icon, 6, 5, { scale:1 });
          txt(c, 21, 7, cd.card.n, rgba(P.white,.92), 1, P.shadow);
          pbox(c, cw-24, 4, 20, 14, rgba(P.ink,.7), 3);
          ctxt(c, cw-14, 7, String(cd.card.d), P.gold, 1);
          ctext(c, cw/2, 45, cd.opt, cw-22, 40, P.white, P.shadow, 2);
          hline(c, 8, ch-14, cw-16, rgba('#ffffff',.25));
          ctxt(c, cw/2, ch-11, el.name, rgba(P.white,.55), 1);
          c.restore();
          c.globalAlpha = 1;
          if (phase === 'q' && !cd.dead) {
            const z = UI.zone(x, y, cw, ch, 'c'+i);
            if (z.over) { c.globalAlpha = .18; pbox(c, x-2, y-2, cw+4, ch+4, P.white, 4); c.globalAlpha = 1; }
            if (z.click) answer(i);
          }
        }
      }

      /* --- type-it-in round ---------------------------------------------- */
      if ((phase === 'q' || phase === 'resolve') && keypad) {
        const gy = 318;
        ctxt(c, VW/2, 306, 'SOLVE IT - TYPE THE NUMBER', P.cyan, 1, P.ink);
        panel(c, 40, gy, VW-80, 34, '#2e1b50');
        ctxt(c, VW/2, gy+10, (typed || '?') + (Math.floor(t*2)%2 ? '_' : ''), P.gold, 3);
        const keys = ['789','456','123','-0.'];
        let ky = gy+42;
        for (let r=0;r<keys.length;r++) {
          for (let i=0;i<3;i++) {
            const ch2 = keys[r][i];
            if (UI.btn(c, 62 + i*80, ky, 72, 26, ch2, { col:'#3a2a5e', col2:'#5a4790', scale:2, key:'kp'+r+i })
                && phase === 'q') { if (typed.length < 7) typed += ch2; }
          }
          ky += 30;
        }
        if (UI.btn(c, 12, gy+42, 44, 26, 'DEL', { col:'#8a2a3a', col2:P.red }) && phase === 'q') typed = typed.slice(0,-1);
        if (UI.btn(c, VW-56, gy+42, 44, 86, 'GO', { col:'#1a7331', col2:'#3fe07a', scale:2 }) && phase === 'q') {
          const ok = typed !== '' && Math.abs(parseFloat(typed) - parseFloat(keypad)) < 1e-6;
          const i = cards.findIndex(cd => cd.opt === q.a);
          if (ok) answer(i); else { const w = cards.findIndex(cd => cd.opt !== q.a); answer(w < 0 ? 0 : w); }
        }
      }

      /* --- player strip --------------------------------------------------- */
      const py = 500;
      pbox(c, -2, py-6, VW+4, 60, rgba(P.ink,.85), 4);
      const pose = phase === 'resolve' && act && act.type === 'strike' ? 'attack'
                 : meFlash > 0 ? 'hurt' : phase === 'win' ? 'cheer' : 'idle';
      AV.draw(c, me.x, me.y, S.d.cfg, pose, Math.floor(t*3)%2, { scale:1.5 });
      if (meFlash > 0) { c.globalAlpha = meFlash*2; c.fillStyle = P.red;
                         c.fillRect(me.x-20, me.y-46, 40, 46); c.globalAlpha = 1; }
      txt(c, 96, py, S.d.name, P.white, 1, P.shadow);
      bar(c, 96, py+11, 150, 9, me.hp/me.maxHp, me.hp/me.maxHp > .3 ? P.green : P.red, { shine:t });
      txt(c, 96, py+23, Math.ceil(me.hp) + '/' + me.maxHp, P.bone, 1);
      spr(c, 'i_heart', 250, py+10);
      /* pet + egg */
      const p = S.pet();
      if (p) { const pd = S.petDef(p);
        spr(c, pd.spr, 288, py+18 + Math.sin(t*5)*2, { center:true });
        txt(c, 276, py+30, pd.name, P.lime, 1, P.shadow); }
      const egg = S.d.eggs[0];
      if (egg) { spr(c, 'i_egg', 330, py+10);
        bar(c, 322, py+24, 28, 4, egg.heat/egg.need, P.pink); }
      /* relics you have picked up */
      for (let i=0;i<relics.length;i++) {
        const rp = CONTENT.POWERS.find(x => x.id === relics[i]);
        const rx = 96 + i*15, ry = py+32;
        pbox(c, rx-1, ry-1, 14, 14, rgba(rp.col,.35), 2);
        spr(c, rp.icon, rx, ry, { scale:1 });
      }

      /* --- bottom: items + ultimate ---------------------------------------- */
      const by = 566;
      let ix = 8;
      for (const k in ITEMS) {
        const n = (S.items()[k]||0);
        const def = ITEMS[k];
        if (UI.btn(c, ix, by, 58, 30, 'x'+n, { col: n?'#2e1b50':'#1b1030', col2: n?'#4a3a70':'#241640',
                                               icon:def.icon, disabled: !n || phase !== 'q', key:'it'+k })) {
          if (S.useItem(k)) {
            if (k === 'elixir') { me.hp = Math.min(me.maxHp, me.hp+34); FX.float(me.x, me.y-46, '+34', P.green, { scale:2 }); SFX.play('heal'); }
            if (k === 'bomb')   { hitFoe(32, true, 'RUNE BOMB'); }
            if (k === 'hourglass') { timeLeft += 8; FX.float(VW/2, 290, '+8s', P.cyan, { scale:2 }); SFX.play('power'); }
            if (k === 'lens')   { burnOne(2); SFX.play('power'); FX.float(VW/2, 290, 'TWO BURNED', P.blue, { scale:1 }); }
          }
        }
        ix += 62;
      }
      if (UI.btn(c, 256, by, 96, 30, ultReady ? 'UNLEASH' : 'ULTIMATE',
                 { col: ultReady ? '#b3600f' : '#241640', col2: ultReady ? P.gold : '#3a2a5e',
                   txt: ultReady ? P.ink : P.grey, glow: ultReady ? P.white : null,
                   disabled: !ultReady || phase !== 'q' })) {
        phase = 'ult'; phaseT = 0; act = { landed:false };
        SFX.play('ult'); FX.slow(.5); FX.shake(9,.6);
      }

      /* --- overlays --------------------------------------------------------- */
      if (phase === 'intro') drawIntro(c);
      if (phase === 'ult') drawUlt(c);
      if (phase === 'hatch') drawHatch(c);
      if (draft) drawDraft(c);
      if (phase === 'win' || phase === 'lose') drawResult(c);

      if (phase === 'q' && UI.btn(c, VW-44, 4, 38, 18, 'FLEE', { col:'#3a2a5e', col2:'#5a4790' })) {
        S.addTrophies(mode === 'duel' ? -10 : -2); leave();
      }
    }
  };

  /* ---- overlays ---------------------------------------------------------- */
  function drawIntro(c) {
    const k = clamp(phaseT/1.5,0,1);
    c.globalAlpha = k < .8 ? 1 : 1-(k-.8)/.2;
    const slide = ease.back(clamp(phaseT/.7,0,1));
    const y = 300;
    pbox(c, -20 + (1-slide)*-300, y, VW+40, 44, rgba(P.ink,.9), 4);
    ctxt(c, VW/2 + (1-slide)*-300, y+6, mode === 'boss' ? 'BOSS FIGHT' : mode === 'duel' ? 'RANKED DUEL' : 'BATTLE', P.red, 2, P.shadow);
    ctxt(c, VW/2 + (1-slide)*300, y+26, foe.name, P.white, 2, P.shadow);
    c.globalAlpha = 1;
  }
  function drawUlt(c) {
    const k = clamp(phaseT/1.3,0,1);
    c.fillStyle = rgba(P.ink, .5*(1-k)); c.fillRect(0,0,VW,VH);
    /* speed lines */
    for (let i=0;i<22;i++) {
      const y = (i*31 + t*400) % VH;
      c.fillStyle = rgba(pack.col, .5*(1-k));
      c.fillRect(0, y, VW, 2);
    }
    /* cut-in portrait */
    const slide = ease.back(clamp(phaseT/.35,0,1));
    const px2 = lerp(-120, 60, slide);
    AV.draw(c, px2, 340, S.d.cfg, 'attack', 1, { scale:4, glow:true });
    ctxt(c, VW/2+40, 250, 'ULTIMATE', P.gold, 4, P.ink);
    ctxt(c, VW/2+40, 290, S.d.name, P.white, 2, P.ink);
    /* slashes */
    if (phaseT > .3) {
      for (let i=0;i<5;i++) {
        const a = (phaseT-.3)*6 - i*.15;
        if (a < 0 || a > 1) continue;
        c.save(); c.translate(foe.x, foe.y); c.rotate(-.6 + i*.3);
        c.globalAlpha = 1-a;
        c.fillStyle = P.white;
        c.fillRect(-140*a, -2, 280*a, 4);
        c.restore(); c.globalAlpha = 1;
      }
    }
  }
  function drawHatch(c) {
    c.fillStyle = rgba(P.shadow,.93); c.fillRect(0,0,VW,VH);
    const k = clamp(phaseT/2.4,0,1);
    const pop = ease.back(clamp(phaseT/.6,0,1));
    ctxt(c, VW/2, 200, 'IT HATCHED!', P.gold, 3, P.ink);
    const pd = S.petDef(hatchPet);
    for (let i=0;i<12;i++) {
      const a = t*2 + i*TAU/12;
      c.fillStyle = rgba(P.pink,.6);
      c.fillRect(Math.round(VW/2+Math.cos(a)*(50+k*30)), Math.round(300+Math.sin(a)*(50+k*30)), 3, 3);
    }
    spr(c, pd.spr, VW/2, 300, { center:true, scale: 3*pop });
    ctxt(c, VW/2, 350, pd.name, P.lime, 2, P.ink);
    ctxt(c, VW/2, 372, '+' + pd.dmg + ' damage companion', P.white, 1, P.ink);
  }
  function drawDraft(c) {
    c.fillStyle = rgba(P.shadow,.95); c.fillRect(0,0,VW,VH);
    ctxt(c, VW/2, 120, 'FIVE ANSWERS.', P.white, 2, P.ink);
    ctxt(c, VW/2, 144, 'TAKE A RELIC', P.gold, 3, P.ink);
    for (let i=0;i<draft.length;i++) {
      const d = draft[i], p = d.p;
      const k = ease.back(clamp(d.in - i*.12, 0, 1));
      const y = 190 + i*120 + (1-k)*60;
      if (k <= 0) continue;
      c.globalAlpha = k;
      panel(c, 24, y, VW-48, 104, '#241640', { r:4 });
      pbox(c, 24, y, VW-48, 4, p.col, 3);
      /* the animated icon: spinning ring + bouncing sprite */
      const cx = 64, cy = y+52;
      for (let j=0;j<6;j++) {
        const a = t*2 + j*TAU/6;
        c.fillStyle = rgba(p.col,.65);
        c.fillRect(Math.round(cx+Math.cos(a)*22), Math.round(cy+Math.sin(a)*22), 3, 3);
      }
      c.globalAlpha = k*(.25+.15*Math.sin(t*4+i)); pxEllipse(c, cx, cy, 24, 24, p.col); c.globalAlpha = k;
      spr(c, p.icon, cx, cy + Math.sin(t*4+i)*3, { center:true, scale:2 });
      txt(c, 100, y+30, p.n, p.col, 2, P.shadow);
      wrap(p.d, VW-140, 1).forEach((l,j) => txt(c, 100, y+52+j*11, l, P.bone, 1));
      c.globalAlpha = 1;
      if (UI.btn(c, 100, y+72, 120, 24, 'TAKE IT', { col:'#1a7331', col2:'#3fe07a', key:'dr'+i })) { takeRelic(p); return; }
    }
  }
  function drawResult(c) {
    const won = phase === 'win';
    c.fillStyle = rgba(P.shadow,.95); c.fillRect(0,0,VW,VH);
    const k = ease.back(clamp(phaseT/.7,0,1));
    c.save(); c.translate(VW/2, 120); c.scale(k,k); c.translate(-VW/2,-120);
    ctxt(c, VW/2, 96, won ? 'VICTORY' : 'DEFEATED', won ? P.gold : P.red, 4, P.ink);
    c.restore();
    if (won) UI.stars(c, VW/2, 156, stars, 3, 2);
    AV.draw(c, VW/2, 260, S.d.cfg, won ? 'cheer' : 'hurt', Math.floor(t*3)%2, { scale:3 });

    panel(c, 30, 286, VW-60, 150, '#241640', { r:4 });
    const rows = [
      ['ACCURACY', Math.round((answered?correct/answered:0)*100) + '%   (' + correct + '/' + answered + ')', P.cyan],
      ['BEST COMBO', 'x' + me.best, P.orange],
      ['XP', '+' + rewards.xp, P.lime],
      ['COINS', '+' + rewards.coins, P.gold],
      ['TROPHIES', (rewards.trophies >= 0 ? '+' : '') + rewards.trophies, rewards.trophies >= 0 ? P.gold : P.red]
    ];
    if (rewards.wood) rows.push(['MATERIALS', '+' + rewards.wood + ' WOOD  +' + rewards.stone + ' STONE', P.bone]);
    rows.forEach((r,i) => {
      const y = 296 + i*22;
      if (phaseT < .3 + i*.12) return;
      txt(c, 42, y, r[0], P.grey, 1);
      const w = tw(r[1],1);
      txt(c, VW-42-w, y, r[1], r[2], 1, P.shadow);
    });
    if (rewards.chest && phaseT > 1) {
      const bob = Math.sin(t*3)*2;
      ctxt(c, VW/2, 446, 'A CHEST DROPPED', RARITY[rewards.chest].col, 1, P.ink);
      spr(c, 'chestSm', VW/2, 476+bob, { center:true, scale:2 });
      c.globalAlpha = .3+.2*Math.sin(t*5);
      pxEllipse(c, VW/2, 476, 30, 14, RARITY[rewards.chest].glow); c.globalAlpha = 1;
    }
    if (UI.btn(c, 30, 520, 140, 34, 'HOME', { col:'#3a2a5e', col2:'#5a4790', scale:1 })) leave('island');
    if (UI.btn(c, 190, 520, 140, 34, won ? 'CONTINUE' : 'RETRY',
               { col:'#1a7331', col2:'#3fe07a', glow:P.gold, scale:1 })) {
      if (!won) Game.go('battle', { mode, packId, node, rival:foeRival, deckId: deck ? deck.id : null });
      else if (S.d.chests.length) Game.go('chest');
      else leave();
    }
  }
  function leave(where) {
    if (where === 'island' || mode === 'duel') Game.go(mode === 'duel' ? 'rank' : 'island');
    else if (mode === 'custom') Game.go('map');
    else Game.go('map', { packId });
  }
})());
</script>
<script>
/* =========================================================================
   MINI GAMES — the stops that are not a fight.

   MATCH-UP   pair the term with the meaning before the clock runs out
   SEQUENCE   put the stages in order (mitosis, solving steps, sizes)
   GRAPH LAB  drag a line onto a mystery line and read off m and c
   CHOP/MINE  a timing bar, a swinging axe, and questions for bonus hauls
   ========================================================================= */
Game.register('minigame', (() => {
  let t, kind, packId, node, pack, bank, done, res, sub;

  function finish(ok, score, loot, statLine) {
    done = { ok, score, loot, statLine, t:0 };
    if (ok) {
      const stars = score >= .92 ? 3 : score >= .7 ? 2 : 1;
      if (packId != null && node != null) S.clearNode(packId, node, stars);
      done.stars = stars;
      for (const k in loot) S.give(k, loot[k]);
      S.pushChest(S.rollRarity(score > .9 ? .2 : 0), packId);
      S.addTrophies(4 + stars*2);
      SFX.play('win'); FX.confetti(VW/2, 220, 60);
    } else { SFX.play('lose'); }
    S.save();
  }
  function leave() {
    if (packId != null) Game.go('map', { packId });
    else Game.go('island');
  }

  function drawDone(c) {
    c.fillStyle = rgba(P.shadow,.95); c.fillRect(0,0,VW,VH);
    const k = ease.back(clamp(done.t/.7,0,1));
    c.save(); c.translate(VW/2,160); c.scale(k,k); c.translate(-VW/2,-160);
    ctxt(c, VW/2, 140, done.ok ? 'CLEARED' : 'MISSED IT', done.ok ? P.gold : P.red, 4, P.ink);
    c.restore();
    if (done.ok) UI.stars(c, VW/2, 200, done.stars, 3, 2);
    AV.draw(c, VW/2, 320, S.d.cfg, done.ok ? 'cheer' : 'idle', Math.floor(t*3)%2, { scale:3 });
    panel(c, 40, 340, VW-80, 110, '#241640', { r:4 });
    ctxt(c, VW/2, 352, done.statLine, P.cyan, 1);
    let i = 0;
    if (!done.ok || !Object.keys(done.loot||{}).length)
      ctxt(c, VW/2, 396, 'no haul this time — the stop stays open', P.grey, 1);
    for (const key in (done.loot||{})) {
      const y = 372 + i*20; i++;
      spr(c, key === 'xp' ? 'i_book' : 'i_'+key, 70, y);
      txt(c, 90, y+3, '+' + done.loot[key] + '  ' + key.toUpperCase(), P.gold, 1, P.shadow);
    }
    if (UI.btn(c, 40, 470, 130, 32, 'AGAIN', { col:'#3a2a5e', col2:'#5a4790' }))
      Game.go('minigame', { kind, packId, node });
    if (UI.btn(c, 190, 470, 130, 32, 'DONE', { col:'#1a7331', col2:'#3fe07a', glow:P.gold })) leave();
  }

  /* ==== MATCH-UP ======================================================== */
  const Match = {
    init(bank) {
      const pairs = (CONTENT.MATCHES[bank] || CONTENT.MATCHES.cells).slice(0,6);
      const tiles = [];
      pairs.forEach((p,i) => { tiles.push({ txt:p[0], pair:i, gone:false, pop:0 });
                               tiles.push({ txt:p[1], pair:i, gone:false, pop:0 }); });
      return { tiles:shuffle(tiles), sel:-1, left:6, time:60, wrong:0, flash:0 };
    },
    update(dt, s, finish) {
      s.time -= dt;
      if (s.flash > 0) s.flash -= dt;
      for (const tl of s.tiles) if (tl.pop > 0) tl.pop -= dt;
      if (s.time <= 0) finish(false, 0, {}, 'ran out of time');
    },
    draw(c, s, t) {
      UI.header(c, 34, 'MATCH-UP', 'pair each one with its meaning', P.blue);
      bar(c, 30, 78, VW-60, 8, s.time/60, s.time > 15 ? P.lime : P.red, { shine:t });
      ctxt(c, VW/2, 90, Math.ceil(s.time) + 's   ' + (6-s.left) + '/6 PAIRED   ' + s.wrong + ' MISSES', P.bone, 1);
      const cols = 2, tw2 = 166, th = 74, gx = 12, gy = 106;
      for (let i=0;i<s.tiles.length;i++) {
        const tl = s.tiles[i];
        const x = gx + (i%cols)*(tw2+8), y = gy + Math.floor(i/cols)*(th+8);
        if (tl.gone && tl.pop <= 0) continue;
        let sc = 1;
        if (tl.pop > 0) sc = 1 + Math.sin((1-tl.pop/.4)*Math.PI)*.35;
        const selected = s.sel === i;
        c.save(); c.translate(x+tw2/2, y+th/2); c.scale(sc,sc); c.translate(-tw2/2,-th/2);
        panel(c, 0, 0, tw2, th, selected ? '#6a4a10' : tl.gone ? '#1a5a33' : '#2e1b50', { r:3 });
        if (selected) pbox(c, 0, 0, tw2, 3, P.gold, 2);
        ctext(c, tw2/2, th/2, tl.txt, tw2-14, th-10, tl.gone ? P.lime : P.white, P.shadow, 2);
        c.restore();
        if (!tl.gone) {
          const z = UI.zone(x, y, tw2, th, 'm'+i);
          if (z.click) {
            SFX.play('tap');
            if (s.sel === i) s.sel = -1;
            else if (s.sel < 0) s.sel = i;
            else {
              const a = s.tiles[s.sel];
              if (a.pair === tl.pair) {
                a.gone = tl.gone = true; a.pop = tl.pop = .4; s.left--;
                SFX.play('correct');
                FX.stars(x+tw2/2, y+th/2, 12, P.lime);
                FX.float(x+tw2/2, y, 'PAIR!', P.lime, { scale:2 });
                S.dailyTick(1);
                if (s.left === 0) {
                  const score = clamp(1 - s.wrong*.12, .3, 1);
                  finish(true, score, { wood:14, coins:40, xp:26 },
                         'paired all six with ' + s.wrong + ' ' + plural(s.wrong,'miss','misses'));
                }
              } else {
                s.wrong++; s.time -= 3; SFX.play('wrong'); FX.shake(4,.2);
                FX.float(x+tw2/2, y, '-3s', P.red, { scale:2 });
              }
              s.sel = -1;
            }
          }
        }
      }
    }
  };

  /* ==== SEQUENCE ======================================================== */
  const Seq = {
    init(bank) {
      const d = CONTENT.SEQUENCES[bank] || CONTENT.SEQUENCES.cells;
      return { title:d.title, order:d.items, pool:shuffle(d.items.map((x,i)=>({ x, i }))),
               slots:[], tries:0, shake:0 };
    },
    update(dt, s) { if (s.shake > 0) s.shake -= dt; },
    draw(c, s, t, finishArg) {
      UI.header(c, 34, 'SEQUENCE', 'tap them in the right order', P.cyan);
      wrap(s.title, VW-40, 1).forEach((l,i) => ctxt(c, VW/2, 76+i*11, l, P.gold, 1));
      /* slots */
      for (let i=0;i<s.order.length;i++) {
        const y = 100 + i*44, has = s.slots[i];
        const jitter = s.shake > 0 ? Math.sin(t*50)*4 : 0;
        panel(c, 16+jitter, y, VW-32, 38, has ? '#1a5a33' : '#241640', { r:3 });
        pbox(c, 20+jitter, y+9, 20, 20, rgba(P.gold,.25), 3);
        ctxt(c, 30+jitter, y+14, String(i+1), P.gold, 1);
        if (has) {
          ctext(c, (VW+40)/2+jitter, y+19, has.x, VW-110, 30, P.white, P.shadow, 2);
          const z = UI.zone(16, y, VW-32, 38, 'sl'+i);
          if (z.click) { s.pool.push(has); s.slots[i] = null; SFX.play('back');
                         s.slots = s.slots.filter(Boolean); }
        }
      }
      /* pool */
      let py = 100 + s.order.length*44 + 4;
      txt(c, 16, py, 'TAP TO PLACE', P.grey, 1); py += 12;
      for (let i=0;i<s.pool.length;i++) {
        const x = 16 + (i%2)*(166+8), y = py + Math.floor(i/2)*30;
        if (UI.btnWrap(c, x, y, 166, 26, s.pool[i].x, { key:'pl'+i, maxScale:1 })) {
          s.slots.push(s.pool[i]); s.pool.splice(i,1);
          SFX.play('tap'); FX.stars(x+80, y+12, 4, P.cyan);
          break;
        }
      }
      pbox(c, 10, VH-46, VW-20, 38, rgba(P.ink,.8), 3);
      ctxt(c, VW/2, VH-38, 'it checks itself the moment all ' + s.order.length + ' are placed', P.grey, 1);
      ctxt(c, VW/2, VH-26, 'tap a placed one to send it back   ' + s.tries + ' wrong ' + plural(s.tries,'order'),
           s.tries ? P.red : P.grey, 1);
    }
  };
  Seq.update = function(dt, s, finish) {
    if (s.shake > 0) s.shake -= dt;
    if (s.slots.length === s.order.length && !s.checked) {
      s.checked = true;
      const ok = s.slots.every((v,i) => v.x === s.order[i]);
      if (ok) {
        SFX.play('correct');
        finish(true, clamp(1 - s.tries*.18, .3, 1), { essence:6, coins:44, xp:30 },
               'ordered it in ' + (s.tries+1) + ' ' + plural(s.tries+1,'try','tries'));
      } else {
        s.tries++; s.shake = .4; SFX.play('wrong'); FX.shake(6,.3);
        UI.toast('not quite — the wrong ones came back', P.red);
        /* keep the ones that are right, return the rest */
        const keep = [];
        s.slots.forEach((v,i) => { if (v.x === s.order[i]) keep[i] = v; else s.pool.push(v); });
        s.slots = keep.filter(Boolean);
        s.pool = shuffle(s.pool);
        s.checked = false;
        if (s.tries >= 4) finish(false, 0, {}, 'four wrong orders');
      }
    }
  };

  /* ==== GRAPH LAB ======================================================= */
  const Graph = {
    init(bank) {
      const rounds = (CONTENT.GRAPHS[bank] || CONTENT.GRAPHS.graphs).slice();
      return { rounds:shuffle(rounds).slice(0,4), idx:0, m:0, c:0, tries:0, ok:0, msg:'', msgT:0, win:0 };
    },
    update(dt, s, finish) {
      if (s.msgT > 0) s.msgT -= dt;
      if (s.win > 0) {
        s.win -= dt;
        if (s.win <= 0) {
          s.idx++;
          if (s.idx >= s.rounds.length)
            finish(true, clamp(1 - s.tries*.1, .3, 1), { essence:8, coins:50, xp:34 },
                   'four lines matched, ' + s.tries + ' ' + plural(s.tries,'retry','retries'));
          else { s.m = 0; s.c = 0; }
        }
      }
    },
    draw(c, s, t, pack) {
      const tgt = s.rounds[s.idx] || s.rounds[0];
      UI.header(c, 34, 'GRAPH LAB', 'move your line onto the ghost line', P.purple);
      ctxt(c, VW/2, 78, 'ROUND ' + (s.idx+1) + ' OF ' + s.rounds.length, P.grey, 1);

      /* --- the grid --------------------------------------------------- */
      const GX = 30, GY = 96, GW = 300, GH = 300, U = GW/12;   /* -6..6 */
      const px = (x) => GX + GW/2 + x*U, py = (y) => GY + GH/2 - y*U;
      panel(c, GX-4, GY-4, GW+8, GH+8, '#120a24', { r:3 });
      c.fillStyle = '#1c1136'; c.fillRect(GX, GY, GW, GH);
      for (let i=-6;i<=6;i++) {
        c.fillStyle = i === 0 ? rgba(P.white,.55) : rgba(P.white,.13);
        c.fillRect(Math.round(px(i)), GY, 1, GH);
        c.fillRect(GX, Math.round(py(i)), GW, 1);
      }
      for (let i=-6;i<=6;i+=2) if (i) {
        txt(c, px(i)-3, py(0)+3, String(i), rgba(P.white,.4), 1);
        txt(c, px(0)+4, py(i)-3, String(i), rgba(P.white,.4), 1);
      }
      /* ghost target */
      for (let x=-6;x<=6;x+=.12) {
        const y = tgt.m*x + tgt.c;
        if (y < -6.2 || y > 6.2) continue;
        c.fillStyle = rgba(P.white,.42);
        c.fillRect(Math.round(px(x)), Math.round(py(y)), 2, 2);
      }
      /* two points on the ghost, labelled — this is the thing to read off.
         Pick the widest pair that actually lands inside the window. */
      const onGrid = [];
      for (let xi=-6; xi<=6; xi++) {
        const yv = tgt.m*xi + tgt.c;
        if (yv >= -6 && yv <= 6 && Math.abs(yv*2 - Math.round(yv*2)) < 1e-6) onGrid.push(xi);
      }
      const marks = onGrid.length >= 2 ? [onGrid[0], onGrid[onGrid.length-1]] : onGrid;
      for (const gx3 of marks) {
        const gy3 = tgt.m*gx3 + tgt.c;
        pbox(c, px(gx3)-4, py(gy3)-4, 8, 8, P.ink, 2);
        pbox(c, px(gx3)-3, py(gy3)-3, 6, 6, P.white, 2);
        txt(c, clamp(px(gx3)+6, 32, GX+GW-54), py(gy3)-11, '(' + gx3 + ',' + fmt(gy3) + ')', P.white, 1, P.ink);
      }
      /* your line */
      const good = Math.abs(s.m-tgt.m) < .01 && Math.abs(s.c-tgt.c) < .01;
      for (let x=-6;x<=6;x+=.06) {
        const y = s.m*x + s.c;
        if (y < -6.2 || y > 6.2) continue;
        c.fillStyle = good ? P.lime : pack.col;
        c.fillRect(Math.round(px(x)), Math.round(py(y)), 2, 2);
      }
      /* the two handles, which you can also drag */
      const hx = px(0), hy = py(s.c);
      pbox(c, hx-4, hy-4, 8, 8, P.ink, 2); pbox(c, hx-3, hy-3, 6, 6, P.gold, 2);
      const gx2 = px(2), gy2 = py(s.m*2 + s.c);
      pbox(c, gx2-4, gy2-4, 8, 8, P.ink, 2); pbox(c, gx2-3, gy2-3, 6, 6, P.cyan, 2);
      if (Input.down && s.win <= 0) {
        if (dist(Input.x,Input.y,hx,hy) < 26 && Math.abs(Input.x-hx) < 40) {
          s.c = clamp(Math.round((GY+GH/2 - Input.y)/U*2)/2, -6, 6);
        } else if (dist(Input.x,Input.y,gx2,gy2) < 26) {
          const yv = (GY+GH/2 - Input.y)/U;
          s.m = clamp(Math.round(((yv - s.c)/2)*4)/4, -6, 6);
        }
      }

      /* --- readout + steppers ------------------------------------------ */
      panel(c, 20, 406, VW-40, 58, '#241640', { r:3 });
      ctxt(c, VW/2, 412, 'YOUR LINE:  y = ' + fmt(s.m) + 'x ' + (s.c < 0 ? '- ' + fmt(-s.c) : '+ ' + fmt(s.c)),
           good ? P.lime : P.white, 2, P.shadow);
      txt(c, 30, 436, 'GRADIENT m', P.cyan, 1);
      if (UI.btn(c, 104, 430, 26, 22, '-', { col:'#3a2a5e', col2:'#5a4790', key:'m-' })) s.m = clamp(s.m-.25,-6,6);
      if (UI.btn(c, 134, 430, 26, 22, '+', { col:'#3a2a5e', col2:'#5a4790', key:'m+' })) s.m = clamp(s.m+.25,-6,6);
      txt(c, 176, 436, 'INTERCEPT c', P.gold, 1);
      if (UI.btn(c, 262, 430, 26, 22, '-', { col:'#3a2a5e', col2:'#5a4790', key:'c-' })) s.c = clamp(s.c-.5,-6,6);
      if (UI.btn(c, 292, 430, 26, 22, '+', { col:'#3a2a5e', col2:'#5a4790', key:'c+' })) s.c = clamp(s.c+.5,-6,6);

      if (s.msgT > 0) ctxt(c, VW/2, 474, s.msg, s.msg[0] === 'M' ? P.lime : P.red, 2, P.ink);
      if (UI.btn(c, 60, 494, VW-120, 34, 'CHECK THE LINE', { col:'#6a27c8', col2:P.purple, glow:P.gold, scale:1 })
          && s.win <= 0) {
        if (good) {
          s.ok++; s.win = .9; s.msg = 'MATCHED!'; s.msgT = 1.2;
          SFX.play('correct'); FX.confetti(VW/2, 240, 40); S.dailyTick(1);
        } else {
          s.tries++; s.msg = 'not yet — check m and c'; s.msgT = 1.4;
          SFX.play('wrong'); FX.shake(5,.25);
        }
      }
      pbox(c, 10, 540, VW-20, 58, rgba(P.ink,.8), 3);
      ctxt(c, VW/2, 546, 'READ IT OFF THE TWO WHITE POINTS', P.gold, 1);
      ctxt(c, VW/2, 560, 'gradient m = change in y / change in x', P.bone, 1);
      ctxt(c, VW/2, 572, 'intercept c = where the ghost crosses the y axis', P.bone, 1);
      ctxt(c, VW/2, 586, 'or drag the gold dot for c and the cyan dot for m', P.grey, 1);
    }
  };
  const fmt = v => (Math.round(v*100)/100).toString();

  /* ==== CHOP / MINE ===================================================== */
  const Swing = {
    init(kind) {
      return { kind, pos:0, dir:1, speed:1.15, hits:0, need:8, misses:0, swing:0,
               bonusQ:null, bonusT:0, tree:1, loot:0, shakeT:0 };
    },
    update(dt, s, finish) {
      if (s.bonusQ) return;
      s.pos += s.dir*s.speed*dt;
      if (s.pos > 1) { s.pos = 1; s.dir = -1; }
      if (s.pos < 0) { s.pos = 0; s.dir = 1; }
      if (s.swing > 0) s.swing -= dt;
      if (s.shakeT > 0) s.shakeT -= dt;
      if (s.misses >= 4) finish(false, 0, {}, 'the axe slipped four times');
      if (s.hits >= s.need) {
        const score = clamp(1 - s.misses*.16, .3, 1);
        const loot = s.kind === 'chop' ? { wood: 18 + s.loot, coins:30, xp:20 }
                                       : { stone: 14 + s.loot, coins:30, xp:20 };
        S.d.stats.chopped += s.hits;
        finish(true, score, loot, s.hits + ' clean ' + (s.kind === 'chop' ? 'cuts' : 'strikes') +
               ', ' + s.misses + ' ' + plural(s.misses,'slip'));
      }
    },
    draw(c, s, t, pack) {
      const chop = s.kind === 'chop';
      UI.header(c, 34, chop ? 'CHOPPING' : 'MINING', 'stop the marker in the green', chop ? P.green : P.stone);
      ctxt(c, VW/2, 76, s.hits + ' / ' + s.need + '   MISSES ' + s.misses + '/4', P.bone, 1);

      /* the patch of ground you are working */
      const gy2 = 300, jitter = s.shakeT > 0 ? rnd(-3,3) : 0;
      drawPlateau(c, VW/2, gy2 + 8, 136, 22, 74, { seed:12 });
      if (chop) drawTree(c, VW/2 + 34 + jitter, gy2, 2.3, 5, { fruit:P.red });
      else { drawRock(c, VW/2 + 34 + jitter, gy2, 2.6, 8); drawRock(c, VW/2 + 78, gy2+8, 1.3, 9); }
      /* your character mid-swing */
      const swinging = s.swing > 0;
      AV.draw(c, VW/2 - 46, gy2 + 4, S.d.cfg, swinging ? 'attack' : 'idle', Math.floor(t*4)%2, { scale:2 });
      /* the axe/pick */
      const ang = swinging ? lerp(-1.1, .5, 1 - s.swing/.25) : -1.1 + Math.sin(t*2)*.08;
      c.save(); c.translate(VW/2-26, gy2-26); c.rotate(ang);
      c.fillStyle = P.wood2; c.fillRect(0,-2,26,4);
      c.fillStyle = P.ink; c.fillRect(24,-9,4,18);
      c.fillStyle = chop ? '#cfd9ee' : '#9aa6c4'; c.fillRect(25,-8,3,16);
      c.restore();

      /* --- the timing bar --------------------------------------------- */
      const bx = 30, by = 404, bw = VW-60, bh = 34;
      panel(c, bx, by, bw, bh, '#241640', { r:3 });
      const perfW = 26, goodW = 74;
      const cxp = bx + bw/2;
      c.fillStyle = rgba(P.lime,.45); c.fillRect(cxp-goodW/2, by+3, goodW, bh-6);
      c.fillStyle = rgba(P.gold,.8);   c.fillRect(cxp-perfW/2, by+3, perfW, bh-6);
      c.fillStyle = P.gold; c.fillRect(cxp-perfW/2, by+3, 1, bh-6); c.fillRect(cxp+perfW/2, by+3, 1, bh-6);
      const mx = bx + 6 + s.pos*(bw-12);
      pbox(c, mx-3, by-4, 6, bh+8, P.ink, 2);
      pbox(c, mx-2, by-3, 4, bh+6, P.white, 2);
      ctxt(c, VW/2, by+bh+8, 'GOLD = PERFECT', P.grey, 1);

      if (UI.btn(c, 60, 462, VW-120, 42, chop ? 'CHOP!' : 'STRIKE!',
                 { col: chop?'#1a7331':'#434f74', col2: chop?'#3fe07a':'#9aa6c4', glow:P.gold, scale:2 })
          && !s.bonusQ) {
        const off = Math.abs(mx - cxp);
        s.swing = .25; s.shakeT = .2;
        if (off < perfW/2) {
          s.hits++; s.loot += 3; s.speed += .1;
          SFX.play(chop ? 'chop' : 'mine'); FX.shake(5,.2);
          FX.float(VW/2, 250, 'PERFECT +3', P.gold, { scale:2 });
          if (chop) FX.leaves(VW/2, 250, 14); else FX.burst(VW/2, 280, 14, [P.stone,'#cfd9ee'], { speed:120 });
          if (s.hits % 3 === 0) { s.bonusQ = CONTENT.question(pack.bank); s.bonusT = 9; }
        } else if (off < goodW/2) {
          s.hits++; s.loot += 1; s.speed += .06;
          SFX.play(chop ? 'chop' : 'mine'); FX.shake(3,.15);
          FX.float(VW/2, 250, 'GOOD +1', P.lime, { scale:2 });
          if (chop) FX.leaves(VW/2, 250, 8); else FX.dust(VW/2, 290, 8, P.stone);
        } else {
          s.misses++; SFX.play('wrong'); FX.shake(4,.2);
          FX.float(VW/2, 250, 'SLIP', P.red, { scale:2 });
        }
      }
      /* the haul so far */
      pbox(c, 10, 522, VW-20, 62, rgba(P.ink,.82), 3);
      ctxt(c, VW/2, 528, 'THE HAUL', P.gold, 1);
      spr(c, chop ? 'i_wood' : 'i_stone', 96, 544, { scale:2 });
      txt(c, 124, 548, '+' + ((chop?18:14) + s.loot), P.lime, 2, P.shadow);
      spr(c, 'i_coin', 210, 544, { scale:2 });
      txt(c, 238, 548, '+30', P.gold, 2, P.shadow);
      ctxt(c, VW/2, 572, chop ? 'every third clean cut wakes something up' :
                                'every third clean strike splits a geode', P.grey, 1);

      /* --- the bonus question ------------------------------------------ */
      if (s.bonusQ) {
        s.bonusT -= 1/60;
        c.fillStyle = rgba(P.shadow,.95); c.fillRect(0,0,VW,VH);
        ctxt(c, VW/2, 120, 'BONUS HAUL', P.gold, 3, P.ink);
        panel(c, 16, 160, VW-32, 70, '#241640', { r:4 });
        wrap(s.bonusQ.q, VW-50, 1).forEach((l,i) => ctxt(c, VW/2, 172+i*11, l, P.white, 1, P.shadow));
        bar(c, 30, 236, VW-60, 6, clamp(s.bonusT/9,0,1), P.gold);
        for (let i=0;i<s.bonusQ.o.length;i++) {
          const y = 256 + i*48;
          if (UI.btnWrap(c, 30, y, VW-60, 40, s.bonusQ.o[i], { key:'bq'+i })) {
            const ok = s.bonusQ.o[i] === s.bonusQ.a;
            S.dailyTick(1);
            if (ok) { s.loot += 10; SFX.play('correct'); FX.confetti(VW/2, 300, 40);
                      UI.toast('+10 BONUS MATERIALS', P.gold, 'i_wood'); }
            else { SFX.play('wrong'); UI.toast('no bonus this time', P.red); }
            s.bonusQ = null;
          }
        }
        if (s.bonusT <= 0) { s.bonusQ = null; UI.toast('too slow', P.red); }
      }
    }
  };
  return {
    enter(data) {
      t = 0; done = null;
      kind = data.kind; packId = data.packId; node = data.node;
      pack = CONTENT.pack(packId) || CONTENT.PACKS[0];
      bank = pack.bank;
      if (kind === 'match') sub = Match.init(bank);
      else if (kind === 'seq') sub = Seq.init(bank);
      else if (kind === 'graph') sub = Graph.init(bank);
      else sub = Swing.init(kind);
      SFX.music(false); SFX.duck(.06);
    },
    exit() { SFX.duck(.16); SFX.music(true); },
    back() { leave(); },
    update(dt) {
      t += dt;
      if (done) { done.t += dt; return; }
      if (kind === 'match') Match.update(dt, sub, finish);
      else if (kind === 'seq') Seq.update(dt, sub, finish);
      else if (kind === 'graph') Graph.update(dt, sub, finish);
      else Swing.update(dt, sub, finish);
    },
    draw(c) {
      drawSky(c, t*.4, Object.assign({ sun:false }, pack.sky));
      c.fillStyle = rgba(P.ink,.45); c.fillRect(0,0,VW,VH);
      if (kind === 'match') Match.draw(c, sub, t);
      else if (kind === 'seq') Seq.draw(c, sub, t);
      else if (kind === 'graph') Graph.draw(c, sub, t, pack);
      else Swing.draw(c, sub, t, pack);
      if (UI.btn(c, 8, 8, 40, 22, '<', { col:'#4a3a70', col2:'#6b56a0' })) leave();
      if (done) drawDone(c);
    }
  };
})());
</script>
<script>
/* =========================================================================
   CHEST — the payoff loop. Answer one question to get the lid open, swipe
   it apart with your thumb, then flip the rewards over one at a time and
   find out how lucky you were.
   ========================================================================= */
Game.register('chest', (() => {
  let t, chest, phase, phaseT, q, crack, swipeAcc, lastX, lastY, rewards, revealed, shake, rar;

  const SLOT_POOL = [
    { key:'coins',   icon:'i_coin',    base:70,  spread:90 },
    { key:'wood',    icon:'i_wood',    base:22,  spread:30 },
    { key:'stone',   icon:'i_stone',   base:16,  spread:24 },
    { key:'essence', icon:'i_essence', base:7,   spread:12 },
    { key:'gems',    icon:'i_gem',     base:1,   spread:2 },
    { key:'egg',     icon:'i_egg',     base:1,   spread:0 }
  ];
  const RMUL = { common:1, rare:1.7, epic:2.8, legendary:4.6 };

  function rollRewards() {
    const n = { common:3, rare:4, epic:4, legendary:5 }[chest.rarity];
    const out = [];
    const pool = SLOT_POOL.filter(s => s.key !== 'egg' || chest.rarity !== 'common');
    for (let i=0;i<n;i++) {
      const s = i === n-1 && (chest.rarity === 'epic' || chest.rarity === 'legendary')
                ? (Math.random() < .55 ? SLOT_POOL[5] : SLOT_POOL[4]) : pick(pool);
      const amt = s.key === 'egg' ? 1
                : Math.max(1, Math.round((s.base + rnd(0,s.spread)) * RMUL[chest.rarity] * (bonus ? 1.25 : 1)));
      /* each slot rolls its own little rarity for the flash */
      const r = amt > (s.base+s.spread)*RMUL[chest.rarity]*.8 ? 'epic'
              : amt > (s.base+s.spread*.5)*RMUL[chest.rarity]*.6 ? 'rare' : 'common';
      out.push({ ...s, amt, rar: s.key === 'egg' ? 'legendary' : s.key === 'gems' ? 'epic' : r, flip:0 });
    }
    return out;
  }
  let bonus = false;

  function grant(r) {
    if (r.key === 'egg') S.addEgg(pick(S.PET_TYPES).id);
    else S.give(r.key, r.amt);
    S.save();
  }

  return {
    enter() {
      t = 0; phaseT = 0; crack = 0; swipeAcc = 0; lastX = null; lastY = null; revealed = -1; shake = 0; bonus = false;
      chest = S.d.chests[0];
      if (!chest) { Game.go('island', null, true); return; }
      rar = RARITY[chest.rarity];
      const pk = CONTENT.pack(chest.packId);
      q = CONTENT.question(pk ? pk.bank : pick(CONTENT.PACKS).bank);
      phase = 'quiz';
      rewards = [];
      SFX.music(false); SFX.duck(.05);
    },
    exit() { SFX.duck(.16); SFX.music(true); },
    back() { if (phase === 'done') Game.go('island'); },

    update(dt) {
      t += dt; phaseT += dt;
      if (shake > 0) shake -= dt;
      if (phase === 'swipe') {
        if (Input.down) {
          if (lastX != null) swipeAcc += Math.abs(Input.x - lastX) + Math.abs(Input.y - (lastY||Input.y))*.5;
          lastX = Input.x; lastY = Input.y;
          if (swipeAcc > 110) {
            swipeAcc = 0; crack++;
            shake = .25; SFX.play('swipe'); FX.shake(5,.2);
            FX.burst(VW/2, 300, 16, [rar.col, P.white, P.gold], { speed:150, g:180 });
            FX.ring(VW/2, 300, rar.glow, { r1:70 });
            if (crack >= 3) {
              phase = 'burst'; phaseT = 0;
              rewards = rollRewards();
              SFX.play('chest'); SFX.play('rarity', ['common','rare','epic','legendary'].indexOf(chest.rarity));
              FX.confetti(VW/2, 300, 90); FX.flash(rar.glow, .2); FX.shake(9,.5);
            }
          }
        } else { lastX = null; lastY = null; }
      }
      if (phase === 'burst' && phaseT > .8) { phase = 'reveal'; phaseT = 0; revealed = 0; flipIn(); }
      if (phase === 'reveal' && rewards[revealed]) rewards[revealed].flip = Math.min(1, rewards[revealed].flip + dt*3.4);
    },

    draw(c) {
      /* --- vault backdrop ---------------------------------------------- */
      drawSky(c, t*.3, { top:'#150a2e', mid:'#2e1b50', bot:shade(rar.col,-.55), sun:false, stars:true });
      c.fillStyle = rgba(P.ink,.58); c.fillRect(0,0,VW,VH);
      /* god rays */
      for (let i=0;i<10;i++) {
        const a = t*.35 + i*TAU/10;
        c.save(); c.translate(VW/2, 300); c.rotate(a);
        c.globalAlpha = phase === 'quiz' ? .07 : .16;
        c.fillStyle = rar.glow;
        c.beginPath(); c.moveTo(0,0); c.lineTo(400,-22); c.lineTo(400,22); c.closePath(); c.fill();
        c.restore(); c.globalAlpha = 1;
      }

      ctxt(c, VW/2, 40, rar.name + ' CHEST', rar.col, 3, P.ink);
      ctxt(c, VW/2, 68, S.d.chests.length + ' ' + plural(S.d.chests.length,'chest') + ' waiting', P.grey, 1);

      /* --- the chest itself --------------------------------------------- */
      if (phase !== 'reveal' && phase !== 'done') {
        const jit = shake > 0 ? rnd(-4,4) : 0;
        const bob = Math.sin(t*2)*3;
        const sc = phase === 'burst' ? 6 + ease.out(clamp(phaseT/.4,0,1))*3 : 6;
        const al = phase === 'burst' ? 1 - clamp(phaseT/.7,0,1) : 1;
        for (let g=3;g>0;g--) {
          c.globalAlpha = (.07 + .04*Math.sin(t*4)) * g;
          pxEllipse(c, VW/2, 318, 26*g, 9*g, rar.glow);
        }
        c.globalAlpha = 1;
        spr(c, 'chestSm', VW/2 + jit, 284 + bob, { center:true, scale:sc, alpha:al });
        /* cracks */
        c.globalAlpha = al;
        for (let i=0;i<crack;i++) {
          c.fillStyle = P.white;
          const r = srnd(90+i);
          for (let j=0;j<9;j++) {
            const x = VW/2 - 30 + r()*60, y = 258 + r()*52;
            c.fillRect(Math.round(x), Math.round(y), 2, 2);
          }
        }
        c.globalAlpha = 1;
      }

      /* --- phases -------------------------------------------------------- */
      if (phase === 'quiz') {
        panel(c, 12, 388, VW-24, 68, '#241640', { r:4 });
        ctxt(c, VW/2, 372, 'ANSWER TO UNLOCK IT', P.gold, 1, P.ink);
        wrap(q.q, VW-44, 1).forEach((l,i) => ctxt(c, VW/2, 398+i*11, l, P.white, 1, P.shadow));
        for (let i=0;i<q.o.length;i++) {
          const x = 12 + (i%2)*(170+8), y = 466 + Math.floor(i/2)*50;
          if (UI.btnWrap(c, x, y, 170, 42, q.o[i], { key:'q'+i })) {
            const ok = q.o[i] === q.a;
            S.dailyTick(1); S.sawCard('chest', q.q, q.a); S.gotCard('chest', q.q, ok);
            bonus = ok;
            if (ok) { SFX.play('correct'); FX.stars(VW/2, 300, 16, P.gold);
                      UI.toast('CORRECT — RICHER CHEST', P.gold, 'i_star'); }
            else { SFX.play('wrong'); UI.toast('wrong — it still opens, just meaner', P.red); }
            phase = 'swipe'; phaseT = 0;
          }
        }
      } else if (phase === 'swipe') {
        ctxt(c, VW/2, 396, 'SWIPE TO CRACK IT OPEN', P.white, 2, P.ink);
        const hand = Math.sin(t*3)*40;
        c.fillStyle = rgba(P.white,.5);
        for (let i=0;i<6;i++) c.fillRect(Math.round(VW/2 - 60 + i*22 + hand*.2), 424, 12, 3);
        bar(c, 60, 440, VW-120, 10, crack/3 + swipeAcc/110/3, rar.col, { shine:t*2, ticks:3 });
        ctxt(c, VW/2, 458, (3-crack) + ' ' + plural(3-crack,'lock') + ' left', P.grey, 1);
      } else if (phase === 'burst') {
        ctxt(c, VW/2, 420, 'OPEN!', rar.col, 4, P.ink);
      } else if (phase === 'reveal' || phase === 'done') {
        drawReveal(c);
      }

      if (phase !== 'reveal' && phase !== 'done' &&
          UI.btn(c, 8, 8, 40, 22, '<', { col:'#4a3a70', col2:'#6b56a0' })) Game.go('island');
    }
  };

  function flipIn() {
    const r = rewards[revealed];
    if (!r) return;
    SFX.play('rarity', ['common','rare','epic','legendary'].indexOf(r.rar));
    FX.confetti(VW/2, 300, r.rar === 'legendary' ? 70 : 30);
    FX.ring(VW/2, 300, RARITY[r.rar].glow, { r1:90, w:3 });
    if (r.rar === 'legendary') { FX.flash(RARITY[r.rar].glow, .18); FX.shake(7,.4); }
    grant(r);
  }

  function drawReveal(c) {
    const r = rewards[revealed];
    /* the little row of pips showing how many are left */
    for (let i=0;i<rewards.length;i++) {
      const x = VW/2 - rewards.length*9 + i*18;
      pbox(c, x, 100, 12, 12, i <= revealed ? RARITY[rewards[i].rar].col : '#3a2a5e', 2);
    }
    if (r) {
      const k = ease.back(r.flip);
      const rr = RARITY[r.rar];
      /* rays behind the card */
      for (let i=0;i<14;i++) {
        const a = t*.8 + i*TAU/14;
        c.save(); c.translate(VW/2, 300); c.rotate(a);
        c.globalAlpha = .18*k; c.fillStyle = rr.glow;
        c.beginPath(); c.moveTo(0,0); c.lineTo(340,-16); c.lineTo(340,16); c.closePath(); c.fill();
        c.restore(); c.globalAlpha = 1;
      }
      c.save(); c.translate(VW/2, 300); c.scale(k, k); c.translate(-VW/2, -300);
      panel(c, VW/2-76, 210, 152, 180, shade(rr.col,-.62), { r:4 });
      pbox(c, VW/2-76, 210, 152, 5, rr.col, 3);
      spr(c, r.icon, VW/2, 282, { center:true, scale:4 });
      ctxt(c, VW/2, 330, r.key === 'egg' ? 'MYSTERY EGG' : 'x' + commas(r.amt), P.white, 3, P.ink);
      ctxt(c, VW/2, 358, r.key.toUpperCase(), rr.col, 1);
      ctxt(c, VW/2, 372, rr.name, rr.col, 1);
      c.restore();
      /* sparkle halo for the good ones */
      if (r.rar === 'legendary' || r.rar === 'epic') {
        for (let i=0;i<8;i++) {
          const a = t*2 + i*TAU/8, rad = 100 + Math.sin(t*3+i)*10;
          c.fillStyle = rr.glow;
          c.fillRect(Math.round(VW/2+Math.cos(a)*rad), Math.round(300+Math.sin(a)*rad*.7), 3, 3);
        }
      }
    }
    const last = revealed >= rewards.length-1;
    if (UI.btn(c, 70, 430, VW-140, 38, last ? 'TAKE IT ALL' : 'NEXT', { col:'#1a7331', col2:'#3fe07a', glow:P.gold, scale:2 })) {
      if (last) {
        S.d.chests.shift(); S.save();
        SFX.play('levelup'); FX.confetti(VW/2, 300, 60);
        if (S.d.chests.length) Game.go('chest', null, true); else Game.go('island');
      } else { revealed++; flipIn(); }
    }
    ctxt(c, VW/2, 486, 'everything here is already in your pack', P.grey, 1);
    if (S.d.chests.length > 1 && last) ctxt(c, VW/2, 500, 'another chest is waiting', P.gold, 1);
  }
})());
</script>
<script>
/* =========================================================================
   DECK — the study side of the study game.

   DEX      every card you have met, how often you got it right
   REVIEW   a ten-card quickfire built out of the ones you keep missing
   CUSTOM   write your own lesson and take it into a real battle
   ========================================================================= */

/* a pixel keyboard that any screen can borrow */
const KeyIn = (() => {
  let active = null;
  const ROWS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  return {
    open(title, value, max, cb) { active = { title, v:value||'', max:max||28, cb, num:false }; },
    get open2() { return !!active; },
    get isOpen() { return !!active; },
    close() { active = null; },
    draw(c) {
      if (!active) return true;
      c.fillStyle = rgba(P.shadow,.92); c.fillRect(0,0,VW,VH);
      ctxt(c, VW/2, 120, active.title, P.gold, 2, P.ink);
      panel(c, 20, 148, VW-40, 30, '#241640');
      const shown = active.v.length > 22 ? '…' + active.v.slice(-21) : active.v;
      ctxt(c, VW/2, 158, shown + (Math.floor(UI.time*2)%2 ? '_' : ''), P.white, 2);
      ctxt(c, VW/2, 182, active.v.length + '/' + active.max, P.grey, 1);
      let y = 200;
      const set = active.num ? ['1234567890','+-=/*.,()','<>%:?!'] : ROWS;
      for (let r=0;r<set.length;r++) {
        const row = set[r], kw = 32, gap = 3;
        const total = row.length*kw + (row.length-1)*gap;
        for (let i=0;i<row.length;i++) {
          if (UI.btn(c, VW/2-total/2 + i*(kw+gap), y, kw, 28, row[i],
                     { col:'#3a2a5e', col2:'#5a4790', scale:1, key:'ki'+r+i })) {
            if (active.v.length < active.max) active.v += row[i];
          }
        }
        y += 32;
      }
      if (UI.btn(c, 20, y, 80, 28, 'SPACE', { col:'#3a2a5e', col2:'#5a4790' }))
        { if (active.v.length < active.max) active.v += ' '; }
      if (UI.btn(c, 108, y, 70, 28, active.num ? 'ABC' : '123', { col:'#2358c9', col2:P.blue }))
        active.num = !active.num;
      if (UI.btn(c, 186, y, 70, 28, 'DEL', { col:'#8a2a3a', col2:P.red })) active.v = active.v.slice(0,-1);
      if (UI.btn(c, 264, y, 76, 28, 'OK', { col:'#1a7331', col2:'#3fe07a' })) {
        const cb = active.cb, v = active.v.trim(); active = null; cb(v);
      }
      if (UI.btn(c, VW/2-50, y+34, 100, 24, 'CANCEL', { col:'#3a2a5e', col2:'#5a4790' })) active = null;
      return false;
    },
    key(k) {
      if (!active) return;
      if (k === 'Backspace') active.v = active.v.slice(0,-1);
      else if (k === 'Enter') { const cb = active.cb, v = active.v.trim(); active = null; cb(v); }
      else if (k.length === 1 && active.v.length < active.max) active.v += k.toUpperCase();
    }
  };
})();

Game.register('dex', (() => {
  let t, tab, bankSel, cardSel, flip, scroll, editing, review;
  const TABS = ['DEX','REVIEW','CUSTOM'];
  const BANKS = () => CONTENT.PACKS.map(p => ({ id:p.bank, name:p.name, col:p.col, icon:p.icon }));

  return {
    enter(data) {
      t = 0; tab = (data && data.tab) || 0; bankSel = null; cardSel = null;
      flip = 0; scroll = 0; editing = null; review = null;
    },
    back() {
      if (KeyIn.isOpen) { KeyIn.close(); return; }
      if (review) { review = null; return; }
      if (editing) { editing = null; return; }
      if (cardSel != null) { cardSel = null; return; }
      if (bankSel) { bankSel = null; return; }
      Game.go('island');
    },
    key(k) { KeyIn.key(k); },
    update(dt) {
      t += dt;
      if (cardSel != null) flip = Math.min(1, flip + dt*3);
      if (!KeyIn.isOpen && Input.down && Math.abs(Input.dy) > 4) scroll = clamp(scroll - Input.dy*.05, 0, 400);
      scroll = clamp(scroll + Input.wheel*10, 0, 400);
      if (review) reviewUpdate(dt);
    },
    draw(c) {
      drawSky(c, t*.3, { top:'#0f1f4a', mid:'#2358c9', bot:'#6cc8ff', sun:false, stars:true });
      c.fillStyle = rgba(P.ink,.45); c.fillRect(0,0,VW,VH);
      UI.topBar(c);
      if (review) { drawReview(c); return; }
      if (editing) { drawEditor(c); KeyIn.draw(c); return; }

      UI.header(c, 32, 'YOUR DECK', 'every card you have met', P.cyan);
      for (let i=0;i<TABS.length;i++)
        if (UI.btn(c, 10 + i*114, 72, 110, 24, TABS[i],
                   { col: tab===i?'#2358c9':'#2e1b50', col2: tab===i?P.blue:'#3f2a68', txt: tab===i?P.white:P.grey })) {
          tab = i; bankSel = null; cardSel = null; scroll = 0;
        }
      if (tab === 0) drawDex(c);
      else if (tab === 1) drawReviewMenu(c);
      else drawCustom(c);

      if (UI.btn(c, 8, 34, 36, 22, '<', { col:'#4a3a70', col2:'#6b56a0' })) this.back();
      KeyIn.draw(c);
    }
  };

  /* ==== DEX ============================================================= */
  function drawDex(c) {
    if (cardSel) { drawCardFlip(c); return; }
    if (!bankSel) {
      let y = 106;
      const all = S.dexList();
      panel(c, 10, y, VW-20, 30, '#241640');
      txt(c, 18, y+6, 'CARDS MET', P.gold, 1);
      txt(c, 18, y+18, all.length + ' of ' + (Object.values(CONTENT.Q).reduce((a,b)=>a+b.length,0)) + ' in the world', P.bone, 1);
      const mastered = all.filter(e => e.right >= 2).length;
      txt(c, 220, y+6, 'MASTERED', P.lime, 1);
      txt(c, 220, y+18, String(mastered), P.white, 2);
      y += 38;
      for (const b of BANKS()) {
        const list = S.dexList(b.id);
        const total = (CONTENT.Q[b.id]||[]).length;
        panel(c, 10, y, VW-20, 44, '#2e1b50');
        spr(c, b.icon, 18, y+16, { scale:1 });
        txt(c, 36, y+6, b.name, b.col, 1, P.shadow);
        bar(c, 36, y+20, 200, 6, total ? list.length/total : 0, b.col, { shine:t });
        txt(c, 36, y+30, list.length + ' / ' + total + ' seen   ' +
                         list.filter(e=>e.right>=2).length + ' mastered', P.grey, 1);
        if (UI.btn(c, VW-70, y+10, 52, 24, 'OPEN', { col:'#2358c9', col2:P.blue, key:'dx'+b.id,
                   disabled: !list.length })) { bankSel = b; scroll = 0; }
        y += 48;
      }
      if (S.dexList().length === 0) ctxt(c, VW/2, y+20, 'play a battle to start collecting', P.grey, 1);
      return;
    }
    /* card list for one bank */
    txt(c, 12, 104, bankSel.name, bankSel.col, 2, P.shadow);
    if (UI.btn(c, VW-70, 100, 58, 22, 'BACK', { col:'#4a3a70', col2:'#6b56a0' })) { bankSel = null; return; }
    const list = S.dexList(bankSel.id);
    c.save(); c.beginPath(); c.rect(0,126,VW,VH-126); c.clip();
    let y = 128 - scroll;
    for (let i=0;i<list.length;i++) {
      const e = list[i];
      if (y > VH) break;
      if (y > 110) {
        const mastered = e.right >= 2;
        panel(c, 10, y, VW-20, 34, mastered ? '#1a5a33' : '#2e1b50');
        const lines = wrap(e.q, VW-90, 1);
        lines.slice(0,2).forEach((l,j) => txt(c, 18, y+6+j*11, l, P.white, 1, P.shadow));
        spr(c, mastered ? 'i_star' : 'i_book', VW-40, y+11);
        txt(c, VW-58, y+14, e.right + '/' + e.seen, mastered ? P.gold : P.grey, 1);
        const z = UI.zone(10, y, VW-20, 34, 'cd'+i);
        if (z.click) { cardSel = e; flip = 0; SFX.play('tap'); }
      }
      y += 38;
    }
    c.restore();
  }
  function drawCardFlip(c) {
    const e = cardSel;
    const k = ease.back(clamp(flip,0,1));
    const w = 280, h = 180, x = VW/2-w/2, y = 200;
    const squash = Math.abs(Math.cos(Math.min(flip,1)*Math.PI));
    c.save();
    c.translate(VW/2, y+h/2); c.scale(flip < .5 ? squash : 1, 1); c.translate(-VW/2, -(y+h/2));
    panel(c, x, y, w, h, '#241640', { r:4 });
    pbox(c, x, y, w, 5, P.cyan, 3);
    if (flip < .5) {
      ctxt(c, VW/2, y+16, 'QUESTION', P.grey, 1);
      wrap(e.q, w-24, 1).forEach((l,i) => ctxt(c, VW/2, y+50+i*13, l, P.white, 1, P.shadow));
    } else {
      ctxt(c, VW/2, y+16, 'ANSWER', P.gold, 1);
      wrap(e.a, w-24, 1).forEach((l,i) => ctxt(c, VW/2, y+64+i*15, l, P.lime, 2, P.shadow));
      ctxt(c, VW/2, y+h-28, 'seen ' + e.seen + '   right ' + e.right, P.grey, 1);
    }
    c.restore();
    if (flip >= 1 && UI.btn(c, 60, 420, VW-120, 30, 'BACK TO THE LIST', { col:'#4a3a70', col2:'#6b56a0' }))
      { cardSel = null; }
    ctxt(c, VW/2, 464, 'tap a card in the list to flip it', P.grey, 1);
  }

  /* ==== REVIEW ========================================================== */
  function buildReview() {
    const entries = S.dexList();
    const rows = [];
    for (const e of entries) {
      const bank = CONTENT.Q[e.bank];
      if (!bank) continue;
      const row = bank.find(r => r[0] === e.q);
      if (row) rows.push({ row, weak: e.seen - e.right });
    }
    if (!rows.length) return null;
    rows.sort((a,b) => b.weak - a.weak);
    const pool = shuffle(rows.slice(0, Math.max(10, Math.ceil(rows.length*.6)))).slice(0,10);
    return { qs: pool.map(r => ({ q:r.row[0], a:r.row[1], o:shuffle(r.row.slice(1)) })),
             i:0, right:0, pick:-1, lock:0, done:false };
  }
  function drawReviewMenu(c) {
    const weak = S.dexList().filter(e => e.right < e.seen);
    panel(c, 10, 106, VW-20, 70, '#241640');
    txt(c, 18, 114, 'QUICKFIRE REVIEW', P.gold, 2, P.shadow);
    txt(c, 18, 134, 'ten cards, weighted towards the ones', P.bone, 1);
    txt(c, 18, 146, 'you keep getting wrong. no monsters.', P.bone, 1);
    txt(c, 18, 162, weak.length + ' shaky ' + plural(weak.length,'card') + ' on file', P.red, 1);
    if (UI.btn(c, 40, 190, VW-80, 36, 'START REVIEW', { col:'#1a7331', col2:'#3fe07a', glow:P.gold, scale:1,
               disabled: S.dexList().length < 4 })) {
      review = buildReview();
      if (!review) UI.toast('meet a few cards first', P.red);
    }
    if (S.dexList().length < 4) ctxt(c, VW/2, 236, 'play a battle first — you need cards', P.grey, 1);
    /* stats block */
    panel(c, 10, 256, VW-20, 120, '#2e1b50');
    txt(c, 18, 264, 'YOUR NUMBERS', P.cyan, 1);
    const st = S.d.stats;
    const rows = [
      ['QUESTIONS ANSWERED', st.answered],
      ['CORRECT', st.correct + '  (' + (st.answered ? Math.round(st.correct/st.answered*100) : 0) + '%)'],
      ['BATTLES WON', st.wins + ' / ' + st.battles],
      ['CHESTS OPENED', st.chests],
      ['STARS EARNED', S.totalStars()],
      ['DAY STREAK', S.d.dayStreak]
    ];
    rows.forEach((r,i) => {
      txt(c, 18, 280+i*15, r[0], P.grey, 1);
      const s = String(r[1]);
      txt(c, VW-26-tw(s,1), 280+i*15, s, P.white, 1, P.shadow);
    });
  }
  function reviewUpdate(dt) {
    if (review.lock > 0) {
      review.lock -= dt;
      if (review.lock <= 0) {
        review.pick = -1;
        review.i++;
        if (review.i >= review.qs.length) review.done = true;
      }
    }
  }
  function drawReview(c) {
    if (review.done) {
      const acc = review.right/review.qs.length;
      ctxt(c, VW/2, 140, 'REVIEW DONE', P.gold, 3, P.ink);
      ctxt(c, VW/2, 180, review.right + ' / ' + review.qs.length, P.white, 4, P.ink);
      UI.stars(c, VW/2, 240, acc >= .9 ? 3 : acc >= .6 ? 2 : 1, 3, 2);
      AV.draw(c, VW/2, 380, S.d.cfg, acc >= .6 ? 'cheer' : 'idle', Math.floor(t*3)%2, { scale:3 });
      if (!review.paid) {
        review.paid = true;
        const coins = 20 + review.right*8, xp = 10 + review.right*4;
        S.give('coins', coins); S.addXp(xp);
        UI.toast('+' + coins + ' COINS  +' + xp + ' XP', P.gold, 'i_coin');
        if (acc >= .9) { S.pushChest(S.rollRarity(.1), null); UI.toast('A CHEST FOR THAT', P.gold, 'i_trophy'); }
        S.save();
      }
      if (UI.btn(c, 80, 440, VW-160, 34, 'DONE', { col:'#1a7331', col2:'#3fe07a', scale:1 })) review = null;
      return;
    }
    const q = review.qs[review.i];
    ctxt(c, VW/2, 40, 'CARD ' + (review.i+1) + ' OF ' + review.qs.length, P.grey, 1);
    bar(c, 40, 56, VW-80, 8, review.i/review.qs.length, P.cyan, { shine:t });
    panel(c, 12, 90, VW-24, 100, '#241640', { r:4 });
    wrap(q.q, VW-44, 1).forEach((l,i) => ctxt(c, VW/2, 110+i*13, l, P.white, 1, P.shadow));
    for (let i=0;i<q.o.length;i++) {
      const y = 214 + i*62;
      const isRight = q.o[i] === q.a;
      const show = review.pick >= 0;
      const col = show ? (isRight ? '#1a7331' : (review.pick === i ? '#8a2a3a' : '#2e1b50')) : '#3a2a5e';
      const col2 = show ? (isRight ? '#3fe07a' : (review.pick === i ? P.red : '#3f2a68')) : '#5a4790';
      if (UI.btnWrap(c, 20, y, VW-40, 52, q.o[i], { col, col2, key:'rv'+i, disabled:show }) && review.pick < 0) {
        review.pick = i; review.lock = 1;
        const ok = isRight;
        if (ok) { review.right++; SFX.play('correct'); FX.stars(VW/2, y+26, 10, P.lime); }
        else { SFX.play('wrong'); FX.shake(4,.2); }
        S.dailyTick(1);
        S.sawCard('review', q.q, q.a); S.gotCard('review', q.q, ok);
      }
    }
    if (UI.btn(c, 8, 8, 40, 22, 'X', { col:'#8a2a3a', col2:P.red })) review = null;
  }

  /* ==== CUSTOM ========================================================== */
  function drawCustom(c) {
    txt(c, 12, 104, 'YOUR OWN LESSONS', P.gold, 1);
    txt(c, 12, 116, 'write cards, then fight with them', P.grey, 1);
    let y = 132;
    for (let i=0;i<S.d.decks.length;i++) {
      const d = S.d.decks[i];
      const n = d.cards.filter(x => x.term && x.def).length;
      panel(c, 10, y, VW-20, 44, '#2e1b50');
      spr(c, 'i_book', 18, y+16);
      txt(c, 36, y+6, d.name, P.cyan, 1, P.shadow);
      txt(c, 36, y+20, n + ' ' + plural(n,'card') + (n < 2 ? '  (need 2 to fight)' : ''), n < 2 ? P.red : P.lime, 1);
      if (UI.btn(c, VW-136, y+10, 56, 24, 'EDIT', { col:'#2358c9', col2:P.blue, key:'ed'+i }))
        { editing = d; scroll = 0; }
      if (UI.btn(c, VW-74, y+10, 56, 24, 'FIGHT', { col:'#1a7331', col2:'#3fe07a', key:'fg'+i, disabled:n < 2 }))
        Game.go('battle', { mode:'custom', deckId:d.id });
      y += 48;
      if (y > VH-90) break;
    }
    if (!S.d.decks.length) {
      panel(c, 10, y, VW-20, 46, '#241640');
      ctxt(c, VW/2, y+12, 'no lessons yet', P.grey, 1);
      ctxt(c, VW/2, y+26, 'make one from tonight\'s homework', P.grey, 1);
      y += 52;
    }
    if (UI.btn(c, 40, Math.min(y+6, VH-60), VW-80, 32, 'NEW LESSON', { col:'#6a27c8', col2:P.purple, glow:P.gold })) {
      KeyIn.open('NAME THE LESSON', '', 22, v => {
        if (!v) return;
        const d = { id:'d'+Date.now(), name:v.toUpperCase(), prompt:'WHAT GOES WITH', cards:[] };
        S.d.decks.push(d); S.save(); editing = d;
        UI.toast('lesson created', P.cyan, 'i_book');
      });
    }
  }
  function drawEditor(c) {
    const d = editing;
    UI.header(c, 32, d.name, 'term on the left, answer on the right', P.cyan);
    if (UI.btn(c, 8, 34, 36, 22, '<', { col:'#4a3a70', col2:'#6b56a0' })) { editing = null; return; }
    if (UI.btn(c, VW-66, 34, 58, 22, 'DELETE', { col:'#8a2a3a', col2:P.red })) {
      S.d.decks.splice(S.d.decks.indexOf(d),1); S.save(); editing = null;
      UI.toast('lesson deleted', P.red); return;
    }
    c.save(); c.beginPath(); c.rect(0,72,VW,VH-132); c.clip();
    let y = 78 - scroll;
    for (let i=0;i<d.cards.length;i++) {
      const card = d.cards[i];
      if (y > VH-60) break;
      if (y > 60) {
        panel(c, 10, y, VW-20, 40, '#2e1b50');
        txt(c, 16, y+5, String(i+1), P.grey, 1);
        const tlines = wrap(card.term || '(tap to write a term)', 130, 1);
        tlines.slice(0,2).forEach((l,j) => txt(c, 28, y+5+j*11, l, card.term ? P.white : P.grey, 1));
        c.fillStyle = rgba(P.white,.2); c.fillRect(166, y+4, 1, 32);
        const dlines = wrap(card.def || '(the answer)', 130, 1);
        dlines.slice(0,2).forEach((l,j) => txt(c, 174, y+5+j*11, l, card.def ? P.lime : P.grey, 1));
        const zt = UI.zone(10, y, 156, 40, 'ct'+i), zd = UI.zone(166, y, 130, 40, 'cd'+i);
        if (zt.click) KeyIn.open('TERM', card.term||'', 40, v => { card.term = v; S.save(); });
        if (zd.click) KeyIn.open('ANSWER', card.def||'', 40, v => { card.def = v; S.save(); });
        if (UI.btn(c, VW-40, y+9, 26, 22, 'X', { col:'#8a2a3a', col2:P.red, key:'rm'+i }))
          { d.cards.splice(i,1); S.save(); break; }
      }
      y += 44;
    }
    c.restore();
    const n = d.cards.filter(x => x.term && x.def).length;
    pbox(c, -2, VH-62, VW+4, 64, rgba(P.ink,.92), 4);
    if (UI.btn(c, 10, VH-54, 150, 28, 'ADD A CARD', { col:'#2358c9', col2:P.blue })) {
      d.cards.push({ term:'', def:'' }); S.save();
      scroll = clamp(d.cards.length*44 - 200, 0, 400);
    }
    if (UI.btn(c, 172, VH-54, 176, 28, n >= 2 ? 'FIGHT WITH IT' : 'NEEDS 2 CARDS',
               { col: n>=2?'#1a7331':'#3a2a5e', col2: n>=2?'#3fe07a':'#5a4790', disabled:n < 2 }))
      Game.go('battle', { mode:'custom', deckId:d.id });
    ctxt(c, VW/2, VH-20, n + ' usable ' + plural(n,'card') + ' — drag to scroll', P.grey, 1);
  }
})());
</script>
