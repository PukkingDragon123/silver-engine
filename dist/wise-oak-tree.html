<title>THE WISE OAK TREE</title>
<style>
/* ==========================================================================
   THE WISE OAK TREE — interface
   Chunky, pixel-adjacent UI built to sit around a 256x192 canvas.
   ========================================================================== */
:root {
  --bg:      #14100f;
  --bg2:     #1e1815;
  --panel:   #2a211c;
  --panel2:  #3a2e26;
  --ink:     #f2e6d0;
  --ink-dim: #b9a88c;
  --gold:    #ffd24a;
  --green:   #6cc73f;
  --red:     #d64545;
  --purple:  #a06bd8;
  --edge:    #0a0807;
  --font: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Consolas", "Liberation Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 50% 0%, #2a211c 0%, #14100f 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px);
  color: var(--ink);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  min-height: 100%;
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  margin: 0 auto;
  padding: 10px 12px 28px;
  max-width: 100%;
}

/* ---------------- top bar ---------------- */
#topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 8px;
}
#topbar h1 {
  font-size: 15px; letter-spacing: 3px; margin: 0;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--edge);
}
#topbar nav { display: flex; flex-wrap: wrap; gap: 6px; }

button {
  font-family: var(--font); font-size: 11px; letter-spacing: 1px;
  cursor: pointer; color: var(--ink);
  background: var(--panel2);
  border: 2px solid var(--edge);
  box-shadow: inset -2px -2px 0 rgba(0,0,0,.35), inset 2px 2px 0 rgba(255,255,255,.08);
  padding: 6px 10px;
  text-transform: uppercase;
}
button:hover { background: #4a3b30; }
button:active { transform: translate(1px, 1px); box-shadow: inset 2px 2px 0 rgba(0,0,0,.4); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.danger { color: #ffb3b3; }
.key {
  display: inline-block; margin-left: 4px; padding: 0 3px;
  background: var(--edge); color: var(--ink-dim); font-size: 9px;
}

/* ---------------- screen ---------------- */
#screen { position: relative; line-height: 0; }
#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border: 3px solid var(--edge);
  box-shadow: 0 0 0 3px #3a2e26, 0 10px 30px rgba(0,0,0,.6);
  background: #79c7f2;
  width: 100%;
  touch-action: manipulation;
}

/* ---------------- hud ---------------- */
#hud {
  position: absolute; top: 8px; left: 8px;
  display: flex; align-items: center; gap: 6px; line-height: 1;
}
.pill {
  background: rgba(10,8,7,.75); border: 2px solid var(--edge);
  padding: 4px 8px; font-size: 12px; color: var(--ink);
  display: flex; align-items: center; gap: 5px;
}
.leaficon { color: var(--green); font-size: 14px; }
#items { display: flex; gap: 3px; }
.itemicon {
  width: 22px; height: 22px; image-rendering: pixelated;
  background: rgba(10,8,7,.7); border: 2px solid var(--edge); padding: 1px;
}

/* ---------------- toasts (minecraft style) ---------------- */
#toasts {
  position: absolute; top: 8px; right: 8px;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 8px;
  background: #2a211c; border: 2px solid var(--edge);
  border-left: 4px solid var(--green);
  padding: 6px 10px 6px 8px;
  transform: translateX(130%); opacity: 0;
  transition: transform .45s cubic-bezier(.2,1.3,.5,1), opacity .3s;
  line-height: 1.25; min-width: 190px;
  box-shadow: 0 4px 0 rgba(0,0,0,.4);
}
.toast.in { transform: translateX(0); opacity: 1; }
.toast.goal { border-left-color: var(--gold); }
.toast.chal { border-left-color: var(--purple); background: #241c2c; }
.ticon { width: 26px; height: 26px; image-rendering: pixelated; flex: none; }
.tkind { font-size: 10px; color: var(--gold); letter-spacing: 1px; }
.toast.chal .tkind { color: var(--purple); }
.tname { font-size: 12px; color: var(--ink); }

/* ---------------- dialogue ---------------- */
.dialogue {
  border: 3px solid var(--edge);
  background: var(--panel);
  box-shadow: inset 0 0 0 2px #4a3b30, 0 6px 0 rgba(0,0,0,.35);
  padding: 10px 12px 12px;
  margin-top: 10px;
  min-height: 86px;
  line-height: 1.55;
}
.dialogue.hidden { display: none; }
#speaker {
  font-size: 11px; letter-spacing: 2px; color: var(--gold);
  margin-bottom: 6px;
}
#dtext { font-size: 13px; color: var(--ink); }
#dtext::after { content: '▌'; opacity: .5; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.dialogue.serious { background: #1c2028; box-shadow: inset 0 0 0 2px #2e3a48, 0 6px 0 rgba(0,0,0,.35); }
.dialogue.serious #speaker { color: #8fb8d8; }
.dialogue.heaven { background: #e8f2fb; box-shadow: inset 0 0 0 2px #ffffff, 0 6px 0 rgba(0,0,0,.35); }
.dialogue.heaven #dtext { color: #22364a; }
.dialogue.heaven #speaker { color: #4a7ba8; }

/* ---------------- action buttons ---------------- */
#actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.act { font-size: 11px; padding: 7px 12px; }
.act.good { border-bottom: 3px solid #3f7a28; }
.act.bad  { border-bottom: 3px solid #7a2a2a; color: #ffc9c9; }
.act.bad:hover { background: #5a2a24; }

#tip { color: var(--ink-dim); font-size: 11px; margin: 12px 0 0; line-height: 1.6; }

/* ---------------- squirrel shop ---------------- */
.panel {
  position: absolute; right: 8px; bottom: 8px; width: min(300px, calc(100% - 16px));
  background: var(--panel); border: 3px solid var(--edge);
  box-shadow: 0 6px 0 rgba(0,0,0,.4); line-height: 1.4;
}
.panel.hidden, .hidden { display: none !important; }
.paneltop {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel2); padding: 6px 8px;
  font-size: 11px; letter-spacing: 2px; color: var(--gold);
  border-bottom: 2px solid var(--edge);
}
.paneltop button { padding: 0 6px; font-size: 14px; line-height: 1; background: transparent; border: none; box-shadow: none; }
#shoplist { max-height: 210px; overflow-y: auto; }
.shoprow {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-bottom: 1px solid #1a1411;
}
.shoprow.owned { opacity: .5; }
.shopinfo { flex: 1; display: flex; flex-direction: column; }
.shopinfo b { font-size: 12px; color: var(--ink); }
.shopinfo span { font-size: 10px; color: var(--ink-dim); }
.buy { font-size: 11px; padding: 5px 8px; color: var(--green); }
.shoprow.poor .buy { color: #a08a70; }
.panelfoot { font-size: 10px; color: var(--ink-dim); padding: 6px 8px; border-top: 2px solid var(--edge); }

#hint {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(10,8,7,.7); border: 2px solid var(--edge);
  padding: 4px 10px; font-size: 11px; color: var(--ink); line-height: 1.3;
  white-space: nowrap;
}

/* ---------------- modal ---------------- */
#modal {
  position: fixed; inset: 0; background: rgba(6,4,3,.85);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40;
}
.modalbox {
  background: var(--panel); border: 3px solid var(--edge);
  box-shadow: 0 8px 0 rgba(0,0,0,.5);
  width: min(680px, 100%); max-height: 86vh; display: flex; flex-direction: column;
}
#modalbody { padding: 12px; overflow-y: auto; line-height: 1.6; }
#modalbody p { margin: 0 0 10px; }
.small { font-size: 11px; color: var(--ink-dim); }
.modalbtns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.tro {
  display: flex; gap: 8px; align-items: flex-start;
  background: var(--bg2); border: 2px solid var(--edge);
  border-left: 4px solid var(--green);
  padding: 6px 8px; line-height: 1.3;
}
.tro.goal { border-left-color: var(--gold); }
.tro.chal { border-left-color: var(--purple); }
.tro.locked { border-left-color: #4a4038; opacity: .55; }
.tro b { font-size: 11px; display: block; color: var(--ink); }
.tro span { font-size: 10px; color: var(--ink-dim); }
.troicon { width: 22px; height: 22px; image-rendering: pixelated; flex: none; }

/* ---------------- ending card ---------------- */
#endingcard {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(4,3,2,.94);
  display: flex; align-items: center; justify-content: center; padding: 16px;
  animation: fadein .6s ease;
}
@keyframes fadein { from { opacity: 0; } }
.ecard {
  width: min(560px, 100%); text-align: center;
  border: 3px solid var(--gold); background: #1a1512;
  box-shadow: 0 0 0 3px var(--edge), 0 0 40px rgba(255,210,74,.15);
  padding: 22px 20px;
}
.ecard canvas { width: 48px; height: 48px; image-rendering: pixelated; }
.etop { font-size: 10px; letter-spacing: 4px; color: var(--ink-dim); margin: 8px 0 4px; }
.ename { font-size: 20px; letter-spacing: 3px; color: var(--gold); text-shadow: 2px 2px 0 var(--edge); }
.etitle { font-size: 13px; color: var(--ink); margin-top: 10px; }
.ebody { font-size: 12px; color: var(--ink-dim); line-height: 1.7; margin: 12px 0 18px; text-align: left; }

@media (max-width: 560px) {
  #topbar h1 { font-size: 12px; }
  button { font-size: 10px; padding: 5px 7px; }
  .panel { width: calc(100% - 16px); }
  #hint { white-space: normal; width: 90%; text-align: center; }
}

/* ---------------- cinematic caption ---------------- */
#caption {
  position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
  color: #f6ecd6; font-size: 13px; letter-spacing: 2px; text-align: center;
  text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.9);
  white-space: nowrap; pointer-events: none;
  animation: capin .8s ease both;
}
@keyframes capin { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }

/* ---------------- hall of trophies ---------------- */
#halllabel {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
  background: rgba(10,8,7,.8); border: 2px solid var(--edge);
  padding: 5px 12px; text-align: center; line-height: 1.35; max-width: 90%;
  pointer-events: none;
}
#halllabel b { color: var(--gold); font-size: 12px; display: block; letter-spacing: 1px; }
#halllabel span { color: var(--ink-dim); font-size: 10px; }
#halllabel.locked b { color: #9aa8b8; }

#hint.cine {
  bottom: auto; top: 8px; left: auto; right: 8px; transform: none;
  font-size: 10px; color: var(--ink-dim); opacity: .75;
}
</style>
<div id="stage">

  <header id="topbar">
    <h1>THE WISE OAK TREE</h1>
    <nav>
      <button id="btnTrophies" class="chrome">Trophies <span class="key">T</span></button>
      <button id="btnEndings" class="chrome">Endings <span class="key">E</span></button>
      <button id="btnShop" class="chrome">Trade</button>
      <button id="btnMute" class="chrome">Sound: on</button>
      <button id="btnReset" class="chrome danger">Erase</button>
    </nav>
  </header>

  <div id="screen">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="pill"><span class="leaficon">&#9752;</span> <span id="leafcount">0</span></div>
      <div class="pill" id="seasonpill">spring</div>
      <div id="items"></div>
    </div>

    <div id="toasts"></div>

    <div id="shop" class="panel hidden">
      <div class="paneltop">SQUIRREL'S GOODS <button id="shopclose">&times;</button></div>
      <div id="shoplist"></div>
      <div class="panelfoot">leaves only. no refunds. no memory of this conversation.</div>
    </div>

    <div id="halllabel" class="hidden"></div>
    <div id="hint" class="hidden"></div>
    <div id="caption" class="hidden"></div>
  </div>

  <div id="dialogue" class="dialogue hidden">
    <div id="speaker">THE WISE OAK TREE</div>
    <div id="dtext"></div>
  </div>

  <div id="actions"></div>

  <p id="tip">Click the tree to talk &middot; he never says the same thing twice &middot; pick up fallen leaves &middot; the squirrel deals in goods</p>
</div>

<div id="modal" class="hidden">
  <div class="modalbox">
    <div class="paneltop"><span id="modaltitle">TROPHY ROOM</span><button id="modalclose">&times;</button></div>
    <div id="modalbody"></div>
  </div>
</div>

<div id="endingcard" class="hidden"></div>
<script>
/* =========================================================================
   THE WISE OAK TREE — content data
   Dialogue, achievements, endings, trades, and squirrel chatter.
   Everything here is plain data so it is easy to extend.
   ========================================================================= */

const DATA = {};

/* -------------------------------------------------------------------------
   TREE DIALOGUE
   Each line: { id, text, mood, tag }
   mood  -> face expression: 'idle' | 'happy' | 'sad' | 'smug' | 'shock' | 'sleepy'
   tag   -> 'goofy' | 'wise' | 'world' | 'meta' | 'weird'
   The engine draws from a shuffled bag, so you never hear the same line twice
   until you have heard all of them.
   ------------------------------------------------------------------------- */
DATA.lines = [
  /* ---------- GOOFY ---------- */
  { id: 'g01', tag: 'goofy', mood: 'happy', text: "I am four hundred years old and I have never once had to find parking." },
  { id: 'g02', tag: 'goofy', mood: 'smug',  text: "People say 'touch grass'. I say: touch bark. Grass is a coward. Grass runs from winter." },
  { id: 'g03', tag: 'goofy', mood: 'idle',  text: "A woodpecker lives in my elbow. He pays no rent. We are, legally speaking, roommates." },
  { id: 'g04', tag: 'goofy', mood: 'shock', text: "Do NOT look up. There is a squirrel up there doing something unspeakable with a walnut." },
  { id: 'g05', tag: 'goofy', mood: 'happy', text: "My branches are extremely strong. Do not test this. Two children tested this. They were fine. I was not." },
  { id: 'g06', tag: 'goofy', mood: 'idle',  text: "I have been standing in the exact same spot since 1613. Ask me about my cardio." },
  { id: 'g07', tag: 'goofy', mood: 'smug',  text: "I invented shade. Legally I cannot prove this. Emotionally, I am certain." },
  { id: 'g08', tag: 'goofy', mood: 'sad',   text: "A dog has claimed me. Every Tuesday. I have accepted this as weather." },
  { id: 'g09', tag: 'goofy', mood: 'happy', text: "In autumn I do a little striptease. Very tasteful. Extremely seasonal." },
  { id: 'g10', tag: 'goofy', mood: 'idle',  text: "Someone carved 'DAVE WAS HERE' into me in 1987. Dave, buddy. I am still here. Where are you." },
  { id: 'g11', tag: 'goofy', mood: 'shock', text: "AAAH- oh. Sorry. A beetle walked across my face. He walks like he owns the place." },
  { id: 'g12', tag: 'goofy', mood: 'smug',  text: "My acorns have a 0.0001% success rate. My children are, statistically, a joke. I love them." },
  { id: 'g13', tag: 'goofy', mood: 'idle',  text: "I tried meditation. Turns out that is just being a tree. I have been doing it for centuries. I am extremely enlightened and extremely bored." },
  { id: 'g14', tag: 'goofy', mood: 'happy', text: "Two teenagers kissed under me last spring and I have not stopped thinking about it. It was NICE. Get off my back." },
  { id: 'g15', tag: 'goofy', mood: 'sad',   text: "There is a plastic bag in my hair. It has been there for eleven years. Its name is Gerald now." },
  { id: 'g16', tag: 'goofy', mood: 'smug',  text: "You are made mostly of water. I am made mostly of water. The difference is that I am shaped correctly." },
  { id: 'g17', tag: 'goofy', mood: 'idle',  text: "I do not have a mouth. I am projecting these words directly into your skull. You have simply chosen not to be alarmed." },
  { id: 'g18', tag: 'goofy', mood: 'happy', text: "An owl told me a joke in 2004. I am still deciding whether it was funny. Owls have terrible timing and excellent delivery." },
  { id: 'g19', tag: 'goofy', mood: 'shock', text: "SQUIRREL. SQUIRREL IN MY BRANCHES. Ah. No. That is just my branch. False alarm. Very embarrassing for me." },
  { id: 'g20', tag: 'goofy', mood: 'idle',  text: "I can feel rain coming three hours early. This is my only superpower and it is useless to me. I cannot go inside." },
  { id: 'g21', tag: 'goofy', mood: 'smug',  text: "Lightning hit me once. I did not die. I simply became more interesting at parties." },
  { id: 'g22', tag: 'goofy', mood: 'happy', text: "There is a family of mice in my roots. The smallest one is named Bartholomew. I named him. He does not know." },
  { id: 'g23', tag: 'goofy', mood: 'sad',   text: "A man once hugged me and cried for twenty minutes. He never came back. I hope he is okay. I think about him during storms." },
  { id: 'g24', tag: 'goofy', mood: 'idle',  text: "My roots go down as far as I go up. Half of me is underground and thinking about nothing. It is a great life." },
  { id: 'g25', tag: 'goofy', mood: 'smug',  text: "You blink around 20,000 times a day. I have blinked twice. Both times were emergencies." },
  { id: 'g26', tag: 'goofy', mood: 'happy', text: "I am currently converting your exhaled regret into oxygen. Free of charge. You are welcome." },
  { id: 'g27', tag: 'goofy', mood: 'shock', text: "Is that a CHAINSAW-- no. Motorcycle. Sorry. I have some trauma about that particular pitch." },
  { id: 'g28', tag: 'goofy', mood: 'idle',  text: "Every leaf on me is a tiny solar panel that I grew out of my own body using sunlight and spite." },
  { id: 'g29', tag: 'goofy', mood: 'sleepy',text: "mmh. Sorry. Winter brain. My whole personality is on standby until March." },
  { id: 'g30', tag: 'goofy', mood: 'happy', text: "A crow brings me shiny things. I have no pockets. I have told him. He does not listen. I have eleven bottle caps." },
  { id: 'g31', tag: 'goofy', mood: 'smug',  text: "The forest has an internet. It is made of fungus. It is slower than yours and it has never once shown me an advertisement." },
  { id: 'g32', tag: 'goofy', mood: 'idle',  text: "I did not consent to being in a video game. But the lighting is good and my canopy looks fantastic, so, fine." },
  { id: 'g33', tag: 'goofy', mood: 'sad',   text: "Someone put a swing on me and then their kid grew up. The rope is still there. I do not have the heart to drop it." },
  { id: 'g34', tag: 'goofy', mood: 'happy', text: "Ask me anything. I know six things very deeply and nothing else at all." },
  { id: 'g35', tag: 'goofy', mood: 'shock', text: "You have been clicking on my FACE. Repeatedly. I did not want to make it weird but here we are." },

  /* ---------- WISE ---------- */
  { id: 'w01', tag: 'wise', mood: 'idle',  text: "You are in a hurry because you can count your days. I cannot count mine. It has made me slow and it has made me kind." },
  { id: 'w02', tag: 'wise', mood: 'idle',  text: "Every ring inside me is a year I survived. Some of them are thin. Nobody planted a tree the year the rain stopped." },
  { id: 'w03', tag: 'wise', mood: 'sad',   text: "I have outlived everyone who ever sat under me. That is not sad. Being forgotten is sad. I remember all of them." },
  { id: 'w04', tag: 'wise', mood: 'idle',  text: "Grow toward the light, but do not resent the shade. The shade is where the small things live." },
  { id: 'w05', tag: 'wise', mood: 'happy', text: "You want to be useful. You already are. You breathe out and I eat it. We have been in a relationship this whole time." },
  { id: 'w06', tag: 'wise', mood: 'idle',  text: "Storms do not kill trees. Rigidity kills trees. Bend. Bend. Bend. Then stand back up when it is quiet." },
  { id: 'w07', tag: 'wise', mood: 'sad',   text: "The worst year of my life, I dropped every leaf in June and looked dead until spring. Looking dead is not the same as dying. Rest is not surrender." },
  { id: 'w08', tag: 'wise', mood: 'idle',  text: "My roots touch four other trees. When one of us is sick the others send sugar underground. Nobody applauds. Nobody knows. It works anyway." },
  { id: 'w09', tag: 'wise', mood: 'idle',  text: "You keep asking what the point is. There is no point. There is only whether the birds had somewhere to sit." },
  { id: 'w10', tag: 'wise', mood: 'happy', text: "The best time to plant a tree was twenty years ago. The second best time is now. The third best time is also now. It keeps being now." },
  { id: 'w11', tag: 'wise', mood: 'idle',  text: "Old does not mean wise. Old means I made every possible mistake and I am still standing here holding the receipts." },
  { id: 'w12', tag: 'wise', mood: 'sad',   text: "I have watched people be cruel and then, forty years later, watched their grandchildren plant a garden. Nothing is finished. That cuts both ways." },
  { id: 'w13', tag: 'wise', mood: 'idle',  text: "Half of me is underground where no one has ever seen it. That is the half that keeps me up. Same for you." },
  { id: 'w14', tag: 'wise', mood: 'idle',  text: "A forest is not a lot of trees. A forest is a lot of trees that agreed to share water. Otherwise it is just a crowd." },
  { id: 'w15', tag: 'wise', mood: 'happy', text: "You do not have to be a forest today. Be one tree. Very well. In one place." },
  { id: 'w16', tag: 'wise', mood: 'idle',  text: "The wind has never once asked my opinion. And yet every year I grow a little thicker on the side it hits. That is what pressure does. You get stronger in the exact place it hurts." },
  { id: 'w17', tag: 'wise', mood: 'sad',   text: "There is a stump beside me. She was taller than I am. Nobody in this park knows her name. I do. It matters that somebody does." },
  { id: 'w18', tag: 'wise', mood: 'idle',  text: "You measure a life in what it did. I measure it in what got to live inside it. By my accounting I have raised nine thousand insects and four owls." },
  { id: 'w19', tag: 'wise', mood: 'idle',  text: "Patience is not waiting. Patience is doing the slow work while nothing visibly happens." },
  { id: 'w20', tag: 'wise', mood: 'happy', text: "If you are reading this at 3am: drink water. Your leaves are wilting. It is very simple and you will not believe me." },

  /* ---------- WORLD ----------
     Real problems, said plainly and with care. The tree is not a
     government. It notices people. That is all a tree can do. */
  { id: 'r01', tag: 'world', mood: 'sad', text: "In Gaza, children have learned to tell the aircraft apart by sound. I am a tree. I hold no flag and I command no one. I only know that no child anywhere should have to learn that." },
  { id: 'r02', tag: 'world', mood: 'sad', text: "There were olive trees in that valley older than me. Someone's great-grandmother planted them. Trees do not choose sides. Trees only know that it takes eighty years to grow one and an afternoon to end one." },
  { id: 'r03', tag: 'world', mood: 'sad', text: "On October 7th families were murdered and taken from their homes. In the months after, families in Gaza were buried under theirs. Both of those things are true at once, and grief does not run out when you share it." },
  { id: 'r04', tag: 'world', mood: 'idle',text: "People ask me who is right. I am four hundred years old and I have never once seen a war where the children on either side did anything to deserve it." },

  { id: 'r07', tag: 'world', mood: 'sad', text: "Somewhere tonight a family is sleeping in a stairwell because the building above it is safer than the room they used to have. They had a couch. They had a smell to their kitchen. That is what a refugee is: someone who had a kitchen." },
  { id: 'r08', tag: 'world', mood: 'idle',text: "The last ten years were the ten warmest ever measured. I am not making an argument. I am telling you what my rings look like." },
  { id: 'r09', tag: 'world', mood: 'sad', text: "An area of forest the size of a football pitch is cleared every few seconds. I try not to think about it in those units. It makes me count." },
  { id: 'r10', tag: 'world', mood: 'sad', text: "Roughly one in eleven people on this planet went to bed hungry last night. The world grows enough food. That is the part that should keep you up." },
  { id: 'r11', tag: 'world', mood: 'idle',text: "Two billion people do not have safe water at home. I drink forty gallons a day straight out of the ground and I have never said thank you once." },
  { id: 'r12', tag: 'world', mood: 'sad', text: "There are more people displaced by violence right now than at any point since the last world war. Over a hundred million. That is not a statistic. That is a hundred million kitchens." },
  { id: 'r13', tag: 'world', mood: 'idle',text: "The richest handful of people own more than the poorest half of humanity. In a forest, that tree would be shading everyone to death and calling it success." },
  { id: 'r14', tag: 'world', mood: 'sad', text: "Someone mined the cobalt in your device. There is a real chance they were fifteen. I am not saying throw the device away. I am saying know whose hands it passed through." },
  { id: 'r15', tag: 'world', mood: 'sad', text: "In the fires last year, animals ran toward the road because the road was the only place without flame. That is the whole century in one image." },
  { id: 'r16', tag: 'world', mood: 'idle',text: "Journalists keep getting killed for describing what they saw. When people stop being able to tell you what happened, the thing that happened does not stop. It just gets quieter." },
  { id: 'r17', tag: 'world', mood: 'sad', text: "There is a plastic island in the Pacific bigger than some countries. Nothing lives there. It is the only place on this planet we built entirely by accident." },
  { id: 'r18', tag: 'world', mood: 'idle',text: "Loneliness now shortens lives about as much as smoking does. You are surrounded by ten thousand people and no roots touching. That is not a personal failure. That is bad forest design." },
  { id: 'r19', tag: 'world', mood: 'sad', text: "A bee species went extinct while you were reading this sentence. Not really. But one did this year, and no one held a funeral, and I found that unbearable." },
  { id: 'r20', tag: 'world', mood: 'idle',text: "You will be told the problems are too big and you are too small. I am one tree. I have cooled this street by four degrees for four hundred years. Small is a lie people tell to get you to sit down." },
  { id: 'r21', tag: 'world', mood: 'sad', text: "Somewhere a hospital ran out of anaesthetic this week. Surgeries happened anyway. I want you to sit with that for exactly five seconds and then go be kind to someone." },
  { id: 'r22', tag: 'world', mood: 'idle',text: "Antibiotics are quietly failing. A scratch used to kill people. It is allowed to become that again if we are careless. Progress is not a ratchet. It is a garden." },
  { id: 'r23', tag: 'world', mood: 'sad', text: "There are children in this world whose entire lives have been a war. Not part of. All of it. Every birthday." },
  { id: 'r24', tag: 'world', mood: 'idle',text: "Everyone is furious and nobody is going outside. I have noticed a correlation. I am a tree, so obviously I am biased." },
  { id: 'r25', tag: 'world', mood: 'happy',text: "Here is the part nobody puts in the news: child mortality has fallen by more than half in thirty years. Millions of people alive who would not have been. Despair is easy and it is also lazy." },

<script>
/* =========================================================================
   THE WISE OAK TREE — tiny WebAudio chiptune engine.
   No files: everything is synthesised. Muting is remembered.
   ========================================================================= */
const SFX = (function () {
  let ctx = null, master = null, muted = false, started = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.22;
    master.connect(ctx.destination);
    return ctx;
  }

  function beep(freq, dur, type = 'square', vol = 0.5, slide = 0) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }

  function noise(dur, vol = 0.3, hp = 400) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }

  const A = {
    talk(i) { beep(180 + (i % 5) * 24, 0.045, 'square', 0.18); },
    click() { beep(520, 0.05, 'square', 0.25, -160); },
    pickup() { beep(660, 0.06, 'square', 0.3); setTimeout(() => beep(880, 0.08, 'square', 0.3), 55); },
    sneeze() { noise(0.10, 0.35, 800); setTimeout(() => noise(0.30, 0.5, 300), 130); },
    ach() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.35), i * 70)); },
    trade() { [440, 587, 740].forEach((f, i) => setTimeout(() => beep(f, 0.09, 'square', 0.28), i * 60)); },
    deny() { beep(160, 0.16, 'sawtooth', 0.3, -60); },
    hug() { [392, 494, 587, 784].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'sine', 0.3), i * 90)); },
    water() { noise(0.5, 0.16, 1600); },
    flick() { noise(0.05, 0.4, 2000); beep(900, 0.03, 'square', 0.2); },
    fire() { noise(1.2, 0.5, 200); },
    boom() { noise(0.9, 0.6, 90); beep(70, 0.7, 'sawtooth', 0.4, -40); },
    ascend() { [392, 523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.5, 'sine', 0.28), i * 130)); },
    ending() { [523, 494, 587, 784].forEach((f, i) => setTimeout(() => beep(f, 0.5, 'triangle', 0.3), i * 220)); },
    squeak() { beep(1200, 0.05, 'square', 0.25, -600); },
    plant() { beep(330, 0.1, 'triangle', 0.3); setTimeout(() => beep(494, 0.16, 'triangle', 0.3), 90); },
    page() { noise(0.08, 0.2, 2500); },
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.22; },
    isMuted() { return muted; },
    kick() { if (!started) { started = true; ensure(); } }
  };
  return A;
})();
</script>
<script>
/* =========================================================================
   THE WISE OAK TREE — pixel renderer
   256x192 logical pixels, fillRect only, scaled up with image-rendering:
   pixelated. No image assets, no libraries.

   The look: layered forest depth, mist, god rays, and a big gnarled face
   with warm amber eyes that is friendly right up until it isn't.
   ========================================================================= */

const W = 256, H = 192;
const GROUND_Y = 150;

/* ---------------- tiny helpers ---------------- */
function px(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); }
function dot(c, x, y, col) { c.fillStyle = col; c.fillRect(x | 0, y | 0, 1, 1); }

function pcircle(c, cx, cy, r, col) {
  c.fillStyle = col;
  for (let y = -r; y <= r; y++) {
    const hw = Math.round(Math.sqrt(Math.max(0, r * r - y * y)));
    if (hw > 0) c.fillRect(Math.round(cx - hw), Math.round(cy + y), hw * 2, 1);
  }
}

function pellipse(c, cx, cy, rx, ry, col) {
  c.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const hw = Math.round(Math.sqrt(Math.max(0, 1 - (y / ry) ** 2)) * rx);
    if (hw > 0) c.fillRect(Math.round(cx - hw), Math.round(cy + y), hw * 2, 1);
  }
}

/* A soft radial glow. Deliberately few rings: stacking one per pixel of
   radius saturates to a solid disc and flattens whatever is underneath. */
function glow(c, cx, cy, r, col, alpha) {
  const steps = 6;
  for (let i = steps; i >= 1; i--) {
    c.globalAlpha = alpha * (1 - (i - 1) / steps) * 0.22;
    pcircle(c, cx, cy, r * (i / steps), col);
  }
  c.globalAlpha = 1;
}

function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgb2hex(r) { return '#' + r.map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]);
}
function quant(hex, q) { return rgb2hex(hex2rgb(hex).map(v => Math.round(v / q) * q)); }

function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- palettes ---------------- */
const SKY = {
  day:   ['#8fd0ea', '#b6e2f2', '#dcf1f7', '#f4fbfd'],
  dusk:  ['#3b2a5e', '#8a4a72', '#e0755c', '#f8c98b'],
  night: ['#070b22', '#101740', '#1b2757', '#2b3a72'],
  dawn:  ['#4a3a72', '#b06a86', '#f0956f', '#ffe0b0']
};

/* five tones per season: deepest shade -> sunlit tip, plus a speck colour */
const SEASON = {
  spring: { t0: '#1d4a1c', t1: '#2f6b28', t2: '#4a9235', t3: '#6fbc45', t4: '#a3dd6a', accent: '#ffd9ea', dark: '#123212' },
  summer: { t0: '#143d14', t1: '#255c1e', t2: '#3d842b', t3: '#5aab38', t4: '#8ccf55', accent: '#e8f36b', dark: '#0d2a0d' },
  autumn: { t0: '#5a2a10', t1: '#8a4416', t2: '#c06a1e', t3: '#e8992c', t4: '#f7cc55', accent: '#ef5330', dark: '#3d1c0b' },
  winter: { t0: '#4a5a68', t1: '#69798a', t2: '#8fa1b2', t3: '#b8c8d6', t4: '#e4eef5', accent: '#ffffff', dark: '#33404c' }
};
const SEASON_NAMES = ['spring', 'summer', 'autumn', 'winter'];

function skyBands(t) {
  let a, b, k;
  if (t < 0.15)      { a = SKY.dawn;  b = SKY.day;   k = t / 0.15; }
  else if (t < 0.50) { a = SKY.day;   b = SKY.day;   k = 0; }
  else if (t < 0.65) { a = SKY.day;   b = SKY.dusk;  k = (t - 0.50) / 0.15; }
  else if (t < 0.75) { a = SKY.dusk;  b = SKY.night; k = (t - 0.65) / 0.10; }
  else if (t < 0.92) { a = SKY.night; b = SKY.night; k = 0; }
  else               { a = SKY.night; b = SKY.dawn;  k = (t - 0.92) / 0.08; }
  return a.map((c, i) => mix(c, b[i], k));
}
function isNight(t) { return t > 0.68 && t < 0.95; }
/* how dark the world is, 0 = noon, 1 = deep night — drives every tint */
function darkness(t) {
  if (t < 0.12) return 1 - t / 0.12;
  if (t < 0.52) return 0;
  if (t < 0.70) return (t - 0.52) / 0.18;
  if (t < 0.93) return 1;
  return 1 - (t - 0.93) / 0.07;
}

let skyCache = { key: -1, rows: null };
function skyRows(t) {
  const key = Math.round(t * 900);
  if (skyCache.key === key) return skyCache.rows;
  const bands = skyBands(t);
  const rows = new Array(GROUND_Y);
  for (let y = 0; y < GROUND_Y; y++) {
    const f = y / (GROUND_Y - 1) * 3;
    const i = Math.min(2, Math.floor(f));
    rows[y] = quant(mix(bands[i], bands[i + 1], f - i), 8);
  }
  skyCache = { key, rows };
  return rows;
}

/* ---------------- geometry, generated once ---------------- */

/* main crown: blobs carry a tone index so the canopy breaks into patches of
   light and shade instead of reading as one flat green lump */
function makeCanopy(seed) {
  const rnd = mulberry(seed);
  const blobs = [];
  const push = (x, y, r, tone) => blobs.push({ x, y, r, tone, s: rnd(), ph: rnd() * 6.28 });
  push(128, 52, 34, 1); push(98, 60, 26, 1); push(158, 60, 26, 1);
  push(112, 40, 22, 2); push(146, 40, 22, 2);
  for (let i = 0; i < 46; i++) {
    const a = rnd() * Math.PI * 2;
    const d = Math.pow(rnd(), 0.5);
    const x = 128 + Math.cos(a) * 62 * d;
    const y = 52 + Math.sin(a) * 32 * d;
    // higher and more central blobs catch more sun
    const lit = (58 - y) / 40 + (rnd() - 0.5) * 0.7;
    push(x, y, 9 + rnd() * 9, lit > 0.5 ? 3 : lit > 0.05 ? 2 : 1);
  }
  blobs.sort((a, b) => a.y - b.y);
  blobs.forEach((b, i) => { b.burn = i / blobs.length; });
  return blobs;
}
const CANOPY = makeCanopy(1337);

/* foliage hanging into frame from the top edge — the thing that makes the
   reference picture feel like you are standing under a canopy */
const FRAME = (function () {
  const rnd = mulberry(2024);
  const out = [];
  for (let i = 0; i < 26; i++) {
    const x = rnd() * (W + 40) - 20;
    const y = -10 + rnd() * 34 - Math.abs(x - W / 2) / W * 14;
    out.push({ x, y, r: 12 + rnd() * 20, ph: rnd() * 6.28, sp: 0.4 + rnd() * 0.6 });
  }
  for (let i = 0; i < 8; i++) {   // upper corners get heavier
    const left = i < 4;
    out.push({ x: left ? -8 + rnd() * 46 : W + 8 - rnd() * 46, y: 10 + rnd() * 44,
               r: 16 + rnd() * 18, ph: rnd() * 6.28, sp: 0.5 });
  }
  return out;
})();

/* misty background trees */
const BG_TREES = (function () {
  const rnd = mulberry(555);
  const out = [];
  for (let i = 0; i < 22; i++) {
    const x = rnd() * W;
    if (x > 92 && x < 164) continue;               // keep the middle clear
    const depth = rnd();
    out.push({ x, depth, h: 26 + rnd() * 40 * (1 - depth * 0.5), r: 10 + rnd() * 14 });
  }
  return out.sort((a, b) => b.depth - a.depth);
})();

const BRANCHES = [
  [[128, 100], [108, 86], [90, 74], [78, 62]],
  [[128, 100], [148, 86], [166, 74], [178, 62]],
  [[128, 96],  [122, 78], [114, 60], [106, 46]],
  [[128, 96],  [134, 76], [142, 58], [150, 44]],
  [[128, 94],  [128, 72], [128, 52], [128, 36]]
];

const TWIGS = (function () {
  const rnd = mulberry(808);
  const out = [];
  for (const b of BRANCHES) {
    const [tx, ty] = b[b.length - 1];
    const [px0, py0] = b[b.length - 2];
    const base = Math.atan2(ty - py0, tx - px0);
    for (let i = 0; i < 4; i++) {
      const a = base + (rnd() - 0.5) * 1.5;
      const len = 9 + rnd() * 13;
      const x2 = tx + Math.cos(a) * len, y2 = ty + Math.sin(a) * len;
      out.push([tx, ty, x2, y2]);
      for (let j = 0; j < 2; j++) {
        const a2 = a + (rnd() - 0.5) * 1.6, l2 = 5 + rnd() * 8;
        out.push([x2, y2, x2 + Math.cos(a2) * l2, y2 + Math.sin(a2) * l2]);
      }
    }
  }
  return out;
})();

/* the trunk is wide and gnarled so there is room for a real face on it */
function trunkHalfWidth(y) {
  const k = Math.max(0, (GROUND_Y - y) / 62);          // 0 at the ground, 1 at the crown
  const flare = Math.pow(Math.max(0, 1 - k * 4), 2) * 15;
  return 27 + flare - k * 2 - Math.sin(k * 4.2) * 1.5;
}

/* =========================================================================
   BACKDROP — sky, mist, distant woods, god rays
   ========================================================================= */

function drawBackdrop(c, g) {
  const rows = skyRows(g.timeOfDay);
  const dk = darkness(g.timeOfDay);
  let prev = null;
  for (let y = 0; y < GROUND_Y; y++) {
    px(c, 0, y, W, 1, rows[y]);
    if (prev && prev !== rows[y]) for (let x = y % 2; x < W; x += 2) dot(c, x, y - 1, rows[y]);
    prev = rows[y];
  }

  if (dk > 0.55) {
    const rnd = mulberry(7);
    for (let i = 0; i < 90; i++) {
      const x = Math.floor(rnd() * W), y = Math.floor(rnd() * 120);
      const tw = 0.5 + 0.5 * Math.sin(g.t * 2 + i);
      if (tw > 0.68) { c.globalAlpha = (dk - 0.55) / 0.45; dot(c, x, y, tw > 0.93 ? '#ffffff' : '#b9c9ff'); c.globalAlpha = 1; }
    }
  }

  // sun / moon
  const ang = Math.PI * (g.timeOfDay * 2 % 2);
  const sx = 20 + (1 - Math.cos(ang)) * 108, sy = 118 - Math.sin(ang) * 92;
  if (dk < 0.75) {
    c.globalAlpha = 1 - dk;
    glow(c, sx, sy, 26, '#fff2c0', 0.55);
    pcircle(c, sx, sy, 9, '#fff8dc'); pcircle(c, sx, sy, 7, '#ffe680');
    c.globalAlpha = 1;
  } else {
    const mx = W - sx;
    glow(c, mx, sy, 20, '#cdd8ff', 0.4);
    pcircle(c, mx, sy, 8, '#eef2ff');
    pcircle(c, mx - 4, sy - 3, 6, rows[Math.max(0, Math.min(GROUND_Y - 1, Math.round(sy - 3)))]);
  }

  // a pale bloom of mist behind the tree, like light coming through the wood
  const bloom = mix('#ffffff', '#f6d8c8', 0.35);
  c.globalAlpha = 0.5 * (1 - dk * 0.8);
  pellipse(c, 150, 118, 90, 40, bloom);
  c.globalAlpha = 0.35 * (1 - dk * 0.8);
  pellipse(c, 150, 122, 60, 26, '#ffffff');
  c.globalAlpha = 1;

  // distant woods, fading into that mist
  for (const t of BG_TREES) {
    const fade = 0.30 + t.depth * 0.55;
    const base = GROUND_Y - 2 + t.depth * 6;
    let col = mix(SEASON[g.season].t1, bloom, fade);
    col = mix(col, '#0a1226', dk * 0.85);
    pellipse(c, t.x, base - t.h, t.r, t.h * 0.42, col);
    px(c, t.x - 1, base - t.h * 0.6, 3, t.h * 0.6, mix('#4a3a2a', bloom, fade));
  }

  // god rays slanting through
  const rayA = (1 - dk) * 0.13;
  if (rayA > 0.01) {
    c.globalAlpha = rayA;
    for (let i = 0; i < 6; i++) {
      const w = 6 + i * 3;
      const x0 = 40 + i * 34 + Math.sin(g.t * 0.25 + i) * 5;
      for (let y = 0; y < GROUND_Y; y++) px(c, x0 + y * 0.42, y, w, 1, '#fff6d8');
    }
    c.globalAlpha = 1;
  }
}

/* dust motes drifting in the light */
function drawBokeh(c, g) {
  const dk = darkness(g.timeOfDay);
  const rnd = mulberry(31);
  for (let i = 0; i < 30; i++) {
    const sp = 0.3 + rnd() * 0.8;
    const x = (rnd() * W + g.t * 4 * sp) % W;
    const y = (rnd() * GROUND_Y - g.t * 3 * sp + GROUND_Y * 4) % GROUND_Y;
    const r = rnd() > 0.85 ? 2 : 1;
    c.globalAlpha = (0.18 + 0.3 * Math.abs(Math.sin(g.t * 0.8 + i))) * (dk > 0.6 ? 0.5 : 1);
    pcircle(c, x, y, r, dk > 0.6 ? '#9fd6ff' : '#fff6cf');
    c.globalAlpha = 1;
  }
  // fireflies after dark
  if (dk > 0.6) {
    for (let i = 0; i < 12; i++) {
      const x = 20 + ((i * 37 + Math.sin(g.t * 0.5 + i) * 40 + g.t * 6) % (W - 40));
      const y = 90 + Math.sin(g.t * 0.9 + i * 2) * 28;
      const blink = Math.sin(g.t * 2.4 + i * 1.7);
      if (blink > 0.3) { glow(c, x, y, 4, '#c8ff8a', 0.5); dot(c, x, y, '#eaffb0'); }
    }
  }
}

/* ---------------- ground ---------------- */
function drawGround(c, g) {
  const dk = darkness(g.timeOfDay);
  const s = SEASON[g.season];
  const winter = g.season === 'winter';
  const shade = col => mix(col, '#0a1226', dk * 0.8);

  let g1 = winter ? '#e9f1f8' : mix(s.t3, '#7fbf50', 0.35);
  let g2 = winter ? '#d2dfeb' : mix(s.t2, '#4f9a3a', 0.4);
  let g3 = winter ? '#b9c9d8' : s.t1;
  if (g.season === 'autumn') { g1 = '#9aa844'; g2 = '#7c8a38'; g3 = '#5c6a2a'; }

  for (let x = 0; x < W; x++) {
    const y = GROUND_Y - 3 + Math.round(Math.sin(x / 21) * 2 + Math.sin(x / 7) * 1);
    px(c, x, y, 1, H - y, shade(g1));
  }
  px(c, 0, GROUND_Y + 12, W, H, shade(g2));
  px(c, 0, GROUND_Y + 28, W, H, shade(g3));

  // grass blades catching the light
  const rnd = mulberry(9);
  for (let i = 0; i < 150; i++) {
    const x = Math.floor(rnd() * W);
    const y = GROUND_Y + Math.floor(rnd() * (H - GROUND_Y));
    const near = (y - GROUND_Y) / (H - GROUND_Y);
    const h = 1 + Math.floor(near * 3);
    const lit = rnd() > 0.72;
    px(c, x, y - h, 1, h, shade(lit ? (winter ? '#ffffff' : mix(g1, '#d8f08a', 0.5)) : g2));
  }
  // little white flowers
  if (!winter) for (let i = 0; i < 26; i++) {
    const x = Math.floor(rnd() * W), y = GROUND_Y + 4 + Math.floor(rnd() * 34);
    dot(c, x, y, shade(g.season === 'autumn' ? '#e8c36b' : '#ffffff'));
    dot(c, x + 1, y, shade('#e8e8d0'));
  }
}

/* bushes framing the bottom corners, drawn in front of everything */
function drawForeground(c, g) {
  const dk = darkness(g.timeOfDay);
  const s = SEASON[g.season];
  const rnd = mulberry(64);
  const shade = col => mix(col, '#060c18', dk * 0.85);
  const clumps = [[-6, 190, 26], [24, 196, 20], [232, 190, 26], [206, 198, 20], [128, 206, 24], [76, 204, 18], [178, 202, 18]];
  for (const [x, y, r] of clumps) {
    pellipse(c, x, y, r, r * 0.7, shade(s.t0));
    pellipse(c, x - 2, y - 3, r * 0.8, r * 0.5, shade(s.t1));
    for (let i = 0; i < 14; i++) {
      const bx = x + (rnd() - 0.5) * r * 1.6, by = y - r * 0.6 + (rnd() - 0.5) * r * 0.6;
      pcircle(c, bx, by, 2 + rnd() * 3, shade(rnd() > 0.6 ? s.t2 : s.t1));
    }
  }
}

/* the canopy hanging into frame from above */
function drawFrameFoliage(c, g) {
  const dk = darkness(g.timeOfDay);
  const s = SEASON[g.season];
  const shade = col => mix(col, '#050b16', dk * 0.88);
  for (const f of FRAME) {
    const sw = Math.sin(g.t * 0.7 * f.sp + f.ph) * 2;
    pcircle(c, f.x + sw, f.y, f.r, shade(s.dark));
  }
  for (const f of FRAME) {
    const sw = Math.sin(g.t * 0.7 * f.sp + f.ph) * 2;
    pcircle(c, f.x + sw - 1, f.y - 2, f.r * 0.72, shade(s.t0));
    if (f.r > 18) pcircle(c, f.x + sw - 2, f.y - 5, f.r * 0.4, shade(s.t1));
  }
  // a few sunlit leaves on the underside so the frame is not a black bar
  const rnd = mulberry(12);
  for (let i = 0; i < 40; i++) {
    const f = FRAME[Math.floor(rnd() * FRAME.length)];
    const a = rnd() * 6.28;
    const x = f.x + Math.cos(a) * f.r * 0.9, y = f.y + Math.abs(Math.sin(a)) * f.r * 0.9;
    pcircle(c, x, y, 1 + rnd() * 2, shade(rnd() > 0.5 ? s.t2 : s.t1));
  }
}

/* =========================================================================
   THE TREE
   ========================================================================= */

/* every expression the old man can pull */
const MOODS = {
  chill:  { lid: 0.30, brow:  0, tilt:  0, mouth: 'smile', pupil: 1.0, squint: 0.0 },
  idle:   { lid: 0.30, brow:  0, tilt:  0, mouth: 'smile', pupil: 1.0, squint: 0.0 },
  happy:  { lid: 0.18, brow: -2, tilt:  0, mouth: 'grin',  pupil: 1.0, squint: 0.35 },
  laugh:  { lid: 0.30, brow: -3, tilt:  0, mouth: 'open',  pupil: 1.0, squint: 0.6 },
  sad:    { lid: 0.36, brow:  2, tilt: -1, mouth: 'frown', pupil: 1.1, squint: 0.0 },
  sob:    { lid: 0.46, brow:  3, tilt: -2, mouth: 'frown', pupil: 1.2, squint: 0.0 },
  smug:   { lid: 0.40, brow: -1, tilt:  1, mouth: 'smirk', pupil: 1.0, squint: 0.25 },
  sly:    { lid: 0.48, brow: -1, tilt:  2, mouth: 'smirk', pupil: 0.9, squint: 0.35 },
  shock:  { lid: -0.18, brow: -5, tilt: 0, mouth: 'ohh',   pupil: 0.55, squint: 0.0 },
  sleepy: { lid: 0.72, brow:  2, tilt:  0, mouth: 'flat',  pupil: 1.1, squint: 0.0 },
  think:  { lid: 0.34, brow: -1, tilt:  2, mouth: 'flat',  pupil: 1.0, squint: 0.0 },
  creepy: { lid: -0.30, brow: -1, tilt: 0, mouth: 'wide',  pupil: 0.35, squint: 0.0 },
  dead:   { lid: 0.0,  brow:  1, tilt:  0, mouth: 'flat',  pupil: 1.0, squint: 0.0 }
};

/* a slightly wavy horizontal groove — bark is never straight */
function wrinkle(c, x, y, len, col, amp) {
  for (let i = 0; i < len; i++) {
    px(c, x + i, y + Math.round(Math.sin(i / len * Math.PI) * (amp === undefined ? 1 : amp)), 1, 1, col);
  }
}

function barkTones(g) {
  const dk = darkness(g.timeOfDay);
  const warm = 1 - dk;
  let base = { hi: '#c9a06a', mid: '#a07a4c', lo: '#6f4f2e', deep: '#432c17' };
  if (g.dead) base = { hi: '#6e6e6e', mid: '#525252', lo: '#343434', deep: '#1c1c1c' };
  const tint = (col, amt) => mix(mix(col, '#0a1226', dk * 0.7), '#ffcf8a', warm * amt);
  const t = { hi: tint(base.hi, 0.18), mid: tint(base.mid, 0.10), lo: tint(base.lo, 0.05), deep: tint(base.deep, 0.02) };
  if (g.burn > 0) {
    // char the bark, but keep enough contrast to read a face, and let the
    // firelight pick out the lit side
    const k = Math.min(0.60, g.burn * 0.75);
    for (const key in t) t[key] = mix(t[key], '#241716', k);
    const fire = Math.min(0.75, g.burn);
    t.hi = mix(t.hi, '#ff9a3a', fire * 0.75);
    t.mid = mix(t.mid, '#c25a1e', fire * 0.5);
    t.lo = mix(t.lo, '#6b2410', fire * 0.4);
  }
  return t;
}

function drawTree(c, g) {
  const s = SEASON[g.season];
  const dk = darkness(g.timeOfDay);
  const B = barkTones(g);
  const sway = Math.sin(g.t * 0.8) * 1.5 + Math.sin(g.t * 2.1) * 0.4;
  const shake = g.shake > 0 ? (Math.random() * 2 - 1) * g.shake : 0;
  const off = y => shake + sway * Math.max(0, (GROUND_Y - y) / 62) * 0.8;

  // contact shadow
  c.globalAlpha = 0.26 * (1 - dk * 0.5);
  for (let y = 0; y <= 12; y++) {
    const hw = Math.round(Math.sqrt(Math.max(0, 1 - (y / 12) ** 2)) * 58);
    if (hw > 0) px(c, 128 - hw, GROUND_Y + 1 + y, hw * 2, 1, '#0d1a08');
  }
  c.globalAlpha = 1;

  // roots flaring out of the ground
  for (const dir of [-1, 1]) {
    for (let i = 0; i < 26; i++) {
      const h = Math.max(1, 12 - i * 0.44);
      const x = 128 + dir * (26 + i) - (dir < 0 ? 2 : 0);
      px(c, x, GROUND_Y + 6 - h, 2, h, i < 4 ? B.mid : B.lo);
      if (i % 5 === 0) px(c, x, GROUND_Y + 5 - h, 2, 1, B.hi);
    }
    px(c, 128 + dir * 52 - (dir < 0 ? 5 : 0), GROUND_Y + 4, 5, 3, B.deep);
  }

  // trunk, lit from the upper left
  for (let y = GROUND_Y + 6; y > 88; y--) {
    const hw = trunkHalfWidth(y);
    const x = 128 + off(y) - hw;
    px(c, x, y, hw * 2, 1, B.mid);
    px(c, x, y, 2, 1, B.lo);
    px(c, x + 2, y, 5, 1, B.hi);                 // sunlit edge
    px(c, x + 7, y, 4, 1, mix(B.hi, B.mid, 0.5));
    px(c, x + hw * 2 - 7, y, 4, 1, B.lo);        // shadow side
    px(c, x + hw * 2 - 3, y, 3, 1, B.deep);
  }
  // bark grain
  const rnd = mulberry(5);
  for (let i = 0; i < 90; i++) {
    const y = 92 + Math.floor(rnd() * 62);
    const hw = trunkHalfWidth(y);
    const x = 128 + off(y) + Math.floor((rnd() * 2 - 1) * (hw - 4));
    px(c, x, y, 1, 2 + Math.floor(rnd() * 4), rnd() > 0.45 ? B.lo : B.hi);
  }

  // branches
  for (const b of BRANCHES) {
    for (let i = 0; i < b.length - 1; i++) {
      const w = 7 - i * 1.5;
      const [x1, y1] = b[i], [x2, y2] = b[i + 1];
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) | 0;
      for (let sI = 0; sI <= steps; sI++) {
        const p = sI / Math.max(1, steps);
        const x = x1 + (x2 - x1) * p, y = y1 + (y2 - y1) * p;
        px(c, x + off(y) - w / 2, y, w, w, B.mid);
        px(c, x + off(y) - w / 2, y, w, 1, B.lo);
      }
    }
  }

  if (!g.dead && g.season === 'winter') drawWinterCrown(c, g, off, B);
  else if (!g.dead) drawCrown(c, g, off, s, dk);

  drawFace(c, g, off, B, dk);

  if (g.flags.hatOn && !g.dead) {
    const hx = Math.round(128 + sway * 1.4), hy = 26;
    for (let y = 0; y <= 14; y++) {
      const hw = Math.round(Math.sqrt(Math.max(0, 1 - (y / 14) ** 2)) * 19);
      px(c, hx - hw, hy - y, hw * 2, 1, y > 10 ? '#e05c4e' : '#c9453b');
    }
    px(c, hx - 19, hy + 1, 38, 2, '#a83229');
    px(c, hx - 16, hy + 3, 32, 2, '#f0e2cc');
    pcircle(c, hx - 8, hy - 8, 3, '#ffe9dd'); pcircle(c, hx + 7, hy - 5, 2, '#ffe9dd');
    pcircle(c, hx + 1, hy - 12, 2, '#ffe9dd');
  }
}

/* the leafy crown, built from tone patches so it has depth */
function drawCrown(c, g, off, s, dk) {
  const shade = col => mix(col, '#050d1c', dk * 0.85);
  const tones = [s.t0, s.t1, s.t2, s.t3, s.t4].map(shade);
  const burn = g.burn;
  const live = [];
  for (const bl of CANOPY) {
    if (burn > 0 && bl.burn < burn) continue;
    bl._ox = off(bl.y) * 1.3 + Math.sin(g.t * 1.1 + bl.ph) * 0.9;
    live.push(bl);
  }
  const char = bl => burn > 0 ? Math.max(0, 1 - (bl.burn - burn) / 0.22) : 0;
  const ch = (col, bl) => char(bl) > 0 ? mix(col, '#48210f', char(bl)) : col;

  for (const bl of live) pcircle(c, bl.x + bl._ox, bl.y + 2, bl.r + 2, ch(shade(s.dark), bl));
  for (const bl of live) pcircle(c, bl.x + bl._ox, bl.y, bl.r, ch(tones[bl.tone], bl));
  for (const bl of live) pcircle(c, bl.x + bl._ox - 2, bl.y - 3, bl.r * 0.62, ch(tones[Math.min(4, bl.tone + 1)], bl));
  for (const bl of live) if (bl.y < 46) pcircle(c, bl.x + bl._ox - 3, bl.y - 5, bl.r * 0.3, ch(tones[4], bl));

  // leaf texture: little clusters of specks so it does not read as plastic
  const rnd = mulberry(77);
  for (let i = 0; i < 260; i++) {
    const bl = live[Math.floor(rnd() * live.length)];
    if (!bl) break;
    const a = rnd() * 6.28, d = Math.sqrt(rnd()) * bl.r;
    const x = bl.x + bl._ox + Math.cos(a) * d, y = bl.y + Math.sin(a) * d * 0.9;
    const up = rnd() > 0.42;
    px(c, x, y, 1, 1, ch(tones[Math.max(0, Math.min(4, bl.tone + (up ? 1 : -1)))], bl));
    if (rnd() > 0.9) px(c, x + 1, y, 1, 1, ch(tones[Math.min(4, bl.tone + 2)], bl));
  }
  // blossom / berry accents
  for (let i = 0; i < 16; i++) {
    const bl = live[Math.floor(rnd() * live.length)];
    if (!bl) break;
    dot(c, bl.x + bl._ox + (rnd() - 0.5) * bl.r, bl.y + (rnd() - 0.5) * bl.r, shade(s.accent));
  }
}

function drawWinterCrown(c, g, off, B) {
  const snow = '#f2f7fb', snowLo = '#cfdde8';
  for (const [x1, y1, x2, y2] of TWIGS) {
    const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) | 0;
    for (let i = 0; i <= steps; i++) {
      const p = i / Math.max(1, steps);
      const x = x1 + (x2 - x1) * p, y = y1 + (y2 - y1) * p;
      px(c, x + off(y), y, 2, 2, B.mid);
      px(c, x + off(y), y - 1, 2, 1, snow);
    }
  }
  for (const b of BRANCHES) {
    for (let i = 0; i < b.length - 1; i++) {
      const [x1, y1] = b[i], [x2, y2] = b[i + 1];
      if (Math.abs(y2 - y1) > Math.abs(x2 - x1)) continue;
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) | 0;
      for (let sI = 0; sI <= steps; sI++) {
        const p = sI / Math.max(1, steps);
        const x = x1 + (x2 - x1) * p, y = y1 + (y2 - y1) * p;
        px(c, x + off(y) - 2, y - 4, 5, 2, sI % 5 === 0 ? snowLo : snow);
      }
    }
  }
  const rnd = mulberry(404);
  for (let i = 0; i < 11; i++) {
    const t = TWIGS[Math.floor(rnd() * TWIGS.length)];
    const x = t[2] + Math.sin(g.t * 2 + i) * 1.2, y = t[3];
    drawLeafSprite(c, x + off(y) - 3, y, '#8a5a2a', '#5c3a18');
  }
  px(c, 112 + off(92), 90, 30, 3, snow);
}

/* -------------------------------------------------------------------------
   THE FACE
   Deep-set amber eyes, a heavy brow, a nose you could hang a coat on, and
   a mouth that can go from grandfatherly to far too wide.
   ------------------------------------------------------------------------- */
function drawFace(c, g, off, B, dk) {
  const cx = Math.round(128 + off(112)), cy = 112;
  const M = MOODS[g.mood] || MOODS.chill;
  const stare = g.stare || 0;
  const wide = 1 + stare * 0.18;

  let lid = M.lid * (1 - stare) + (-0.30) * stare;
  if (g.blink > 0 && !g.dead) lid = 1;
  const brow = M.brow - stare * 2;
  const glowAmt = Math.max(dk, Math.max(stare * 0.9, (g.burn || 0) * 0.85));
  const LIT = mix(B.hi, '#ffe0b0', 0.25);      // sun side
  const SH = B.lo, DEEP = B.deep;

  /* --- the face is carved a little proud of the trunk --- */
  c.globalAlpha = 0.4; pellipse(c, cx - 3, cy + 2, 24, 32, LIT); c.globalAlpha = 1;
  c.globalAlpha = 0.3; pellipse(c, cx + 9, cy + 4, 15, 28, SH); c.globalAlpha = 1;

  /* --- forehead --- */
  c.globalAlpha = 0.5; pellipse(c, cx - 2, cy - 28, 20, 8, LIT); c.globalAlpha = 1;
  wrinkle(c, cx - 16, cy - 34, 30, SH, 2);
  wrinkle(c, cx - 16, cy - 33, 30, LIT, 2);
  wrinkle(c, cx - 13, cy - 29, 25, SH, 1);
  wrinkle(c, cx - 10, cy - 25, 19, SH, 1);

  /* --- brow ridge: lit on top, deep shadow under, heavier at the inner end --- */
  for (const dir of [-1, 1]) {
    const tilt = M.tilt * dir;
    for (let i = 0; i < 19; i++) {
      const bx = cx + dir * (2 + i) - (dir < 0 ? 2 : 0);
      const arch = -Math.sin(Math.pow(i / 19, 0.8) * Math.PI) * 4;
      const by = Math.round(cy - 19 + brow + arch + (tilt * i) / 7);
      const th = 4 - Math.floor(i / 12);
      px(c, bx, by, 2, th, dir < 0 ? mix(LIT, B.mid, 0.35) : B.mid);
      px(c, bx, by - 1, 2, 1, LIT);
      px(c, bx, by + th, 2, 2, DEEP);
    }
  }
  px(c, cx - 2, cy - 22 + brow, 2, 7, SH);       // frown furrow
  px(c, cx + 1, cy - 21 + brow, 1, 5, SH);
  px(c, cx - 4, cy - 22 + brow, 1, 5, SH);

  /* --- eyes --- */
  const ey = cy - 8;
  for (const dir of [-1, 1]) {
    const ex = cx + dir * 13;
    pellipse(c, ex, ey + 1, 11, 8, DEEP);                     // socket
    pellipse(c, ex - dir, ey + 1, 10, 6.5, mix(DEEP, SH, 0.55));
    if (g.dead) {
      for (let i = -5; i <= 5; i++) { dot(c, ex + i, ey + i, '#171717'); dot(c, ex + i, ey - i, '#171717'); }
      continue;
    }
    const rx = 8 * wide, ry = 5.4 * wide;
    pellipse(c, ex, ey, rx, ry, '#d9c39a');
    pellipse(c, ex, ey - 0.5, rx - 0.5, ry - 0.8, '#f2e6cc');
    pellipse(c, ex - 2, ey - 1, rx - 3, ry - 2, '#fbf3e2');

    const lx = Math.max(-2.6, Math.min(2.6, g.look.x * 2.6));
    const ly = Math.max(-1.8, Math.min(1.8, g.look.y * 1.8));
    const ix = ex + lx, iy = ey + ly;
    if (glowAmt > 0.2) glow(c, ix, iy, 8, '#ffb03a', 0.6 * glowAmt);
    pcircle(c, ix, iy, 4.2, '#6b3a0c');
    pcircle(c, ix, iy, 3.5, '#b8791f');
    pcircle(c, ix - 0.5, iy - 0.5, 2.8, '#e0a63c');
    pcircle(c, ix, iy + 1, 2.0, '#f3c661');
    pcircle(c, ix, iy, 1.9 * M.pupil, '#180d03');
    dot(c, ix - 2, iy - 2, '#ffffff'); dot(c, ix - 1, iy - 2, '#fff6de'); dot(c, ix - 2, iy - 1, '#fff6de');
    dot(c, ix + 2, iy + 2, '#c98c2a');
    if (glowAmt > 0.45) dot(c, ix, iy, mix('#180d03', '#ff9b2a', (glowAmt - 0.45) * 1.5));

    // heavy upper lid
    if (lid > 0) {
      const h = Math.round(lid * (ry * 2 + 3));
      px(c, ex - rx - 1, ey - ry - 3, rx * 2 + 2, h + 1, B.mid);
      px(c, ex - rx - 1, ey - ry - 3, 4, h + 1, LIT);
      wrinkle(c, ex - rx - 1, ey - ry - 2 + h, rx * 2 + 2, DEEP, 1);   // lash line
      wrinkle(c, ex - rx - 1, ey - ry - 4 + h, rx * 2 + 2, SH, 1);     // lid crease
    } else {
      px(c, ex - rx + 1, ey - ry - 1, rx * 2 - 2, 1, '#fbf3e2');   // wide-eyed
    }
    // eye bags
    wrinkle(c, ex - rx, ey + ry, rx * 2, DEEP, 1);
    wrinkle(c, ex - rx + 1, ey + ry + 2, rx * 2 - 2, mix(LIT, B.mid, 0.4), 1);
    wrinkle(c, ex - rx + 2, ey + ry + 4, rx * 2 - 4, SH, 1);
    if (M.squint > 0) {
      const sh = Math.round(M.squint * 4);
      px(c, ex - rx, ey + ry - sh, rx * 2, sh, B.mid);
      px(c, ex - rx, ey + ry - sh, rx * 2, 1, LIT);
    }
    // crow's feet
    for (let i = 0; i < 4; i++) {
      const fx = ex + dir * (rx + 2);
      px(c, fx + dir * i, ey - 5 + i * 3, dir > 0 ? 4 : -4, 1, SH);
    }
  }

  /* --- nose: a real one, lit on the left, shadowed on the right --- */
  const ny = cy + 2;
  px(c, cx - 5, ny - 10, 4, 16, mix(LIT, B.mid, 0.3));    // bridge, lit side
  px(c, cx - 1, ny - 10, 4, 16, B.mid);
  px(c, cx + 3, ny - 8, 3, 14, SH);                       // shadow side
  px(c, cx + 6, ny - 4, 2, 10, DEEP);
  pellipse(c, cx - 1, ny + 8, 8, 5, B.mid);               // bulb
  pellipse(c, cx - 3, ny + 7, 5, 3, LIT);
  pellipse(c, cx + 4, ny + 9, 4, 3, SH);
  pellipse(c, cx - 8, ny + 8, 3, 3, B.mid);               // wings
  pellipse(c, cx + 7, ny + 8, 3, 3, SH);
  px(c, cx - 6, ny + 10, 2, 2, DEEP); px(c, cx + 5, ny + 10, 2, 2, DEEP);
  wrinkle(c, cx - 11, ny + 12, 22, DEEP, 1);

  /* --- cheeks --- */
  for (const dir of [-1, 1]) {
    const chx = cx + dir * 19;
    c.globalAlpha = 0.55;
    pellipse(c, chx, cy + 12, 9, 9, dir < 0 ? LIT : mix(B.mid, SH, 0.4));
    c.globalAlpha = 1;
    wrinkle(c, chx - 5, cy + 18, 11, SH, 1);
    wrinkle(c, chx - 4, cy + 22, 9, SH, 1);
  }
  // laugh lines
  for (const dir of [-1, 1]) for (let i = 0; i < 9; i++) {
    px(c, cx + dir * (9 + i * 0.65), ny + 10 + i, 1, 1, SH);
    px(c, cx + dir * (9 + i * 0.65) - dir, ny + 10 + i, 1, 1, mix(LIT, B.mid, 0.5));
  }

  drawMouth(c, g, cx, cy + 26, M, B, stare);

  /* --- chin and the moss he cannot shave --- */
  pellipse(c, cx - 2, cy + 34, 11, 5, LIT);
  wrinkle(c, cx - 8, cy + 37, 16, SH, 1);
  c.globalAlpha = 0.85;
  const rnd = mulberry(19);
  const moss = mix('#4a7a32', '#0a1226', dk * 0.7);
  for (let i = 0; i < 34; i++) {
    const a = rnd() * Math.PI, d = rnd();
    px(c, cx + Math.cos(a) * 24 * d - 1, cy + 36 + Math.sin(a) * 10 * d, 2, 1,
       rnd() > 0.5 ? moss : mix(moss, '#8fbf5a', 0.5));
  }
  c.globalAlpha = 1;
}

function drawMouth(c, g, cx, my, M, B, stare) {
  const dark = '#2a1508', gum = '#7d3838', teeth = '#e6d9bb', teethLo = '#c4b48f';
  const LIT = mix(B.hi, '#ffe0b0', 0.25);
  let shape = M.mouth;
  if (g.talking && !g.dead) shape = 'open';
  if (g.dead) shape = 'flat';

  /* a curved slit with lips, and optionally a row of joined teeth */
  const slit = (w, depth, thick, withTeeth) => {
    const yAt = i => my + Math.round(Math.cos((i / w) * Math.PI / 2) * depth) - depth;
    for (let i = -w; i <= w; i++) {
      px(c, cx + i, yAt(i) - 3, 1, 2, LIT);                 // upper lip catches light
      px(c, cx + i, yAt(i) - 1, 1, 1, mix(B.mid, B.lo, 0.4));
      px(c, cx + i, yAt(i), 1, thick, dark);                 // the cavity
      px(c, cx + i, yAt(i) + thick, 1, 2, B.lo);             // lower lip
      px(c, cx + i, yAt(i) + thick + 2, 1, 1, B.deep);
    }
    if (withTeeth) {
      for (let i = -w + 2; i <= w - 2; i++) {
        px(c, cx + i, yAt(i), 1, 2, teeth);
        if (((i + w) % 4) === 0) px(c, cx + i, yAt(i), 1, 2, teethLo);
      }
      for (let i = -w + 2; i <= w - 2; i++) px(c, cx + i, yAt(i) + 2, 1, 1, gum);
    }
    // corner creases
    px(c, cx - w - 2, my - depth - 2, 2, 5, B.lo);
    px(c, cx + w + 1, my - depth - 2, 2, 5, B.lo);
    px(c, cx - w - 3, my - depth - 1, 1, 4, B.deep);
    px(c, cx + w + 3, my - depth - 1, 1, 4, B.deep);
  };

  if (shape === 'smile')      slit(14, 4, 3, false);
  else if (shape === 'grin')  slit(17, 6, 4, true);
  else if (shape === 'wide')  slit(23, 9, 4 + Math.round(stare * 2), true);
  else if (shape === 'flat')  slit(12, 0, 3, false);
  else if (shape === 'frown') {
    const w = 13;
    const yAt = i => my - Math.round(Math.cos((i / w) * Math.PI / 2) * 4) + 4;
    for (let i = -w; i <= w; i++) {
      px(c, cx + i, yAt(i) - 3, 1, 2, LIT);
      px(c, cx + i, yAt(i), 1, 3, dark);
      px(c, cx + i, yAt(i) + 3, 1, 2, B.lo);
    }
    px(c, cx - w - 2, my + 2, 2, 5, B.lo); px(c, cx + w + 1, my + 2, 2, 5, B.lo);
  } else if (shape === 'smirk') {
    const w = 14;
    const yAt = i => my + Math.round((i / w) * -4);
    for (let i = -w; i <= w; i++) {
      px(c, cx + i, yAt(i) - 3, 1, 2, LIT);
      px(c, cx + i, yAt(i), 1, 3, dark);
      px(c, cx + i, yAt(i) + 3, 1, 2, B.lo);
    }
    px(c, cx + w, my - 8, 3, 6, B.lo); px(c, cx + w + 2, my - 8, 1, 6, B.deep);
    px(c, cx - w - 2, my + 3, 2, 3, B.lo);
  } else if (shape === 'ohh') {
    pellipse(c, cx, my, 8, 9, B.deep);
    pellipse(c, cx, my, 6.5, 7.5, dark);
    pellipse(c, cx, my + 4, 3.5, 2.5, gum);
    pellipse(c, cx, my - 10, 9, 2, LIT);
    pellipse(c, cx, my + 10, 8, 2, B.lo);
  } else if (shape === 'open') {
    const o = 3 + Math.abs(Math.sin(g.t * 13)) * 4.5;
    pellipse(c, cx, my, 10, o + 1.5, B.deep);
    pellipse(c, cx, my, 8.5, o, dark);
    for (let i = -7; i <= 7; i++) px(c, cx + i, my - o + 1, 1, 2, ((i + 7) % 4) === 0 ? teethLo : teeth);
    pellipse(c, cx, my + o * 0.45, 4.5, Math.max(1, o * 0.4), gum);
    pellipse(c, cx, my - o - 2, 10, 2, LIT);
    pellipse(c, cx, my + o + 2, 9, 2, B.lo);
  }
}

/* something else is awake in the branches */
function drawWatchers(c, g) {
  if (!g.watchers || g.watchers <= 0) return;
  const rnd = mulberry(g.watcherSeed || 3);
  const a = Math.min(1, g.watchers);
  for (let i = 0; i < 3; i++) {
    const bl = CANOPY[Math.floor(rnd() * CANOPY.length)];
    if (!bl || bl.tone > 1) continue;
    const x = bl.x + (rnd() - 0.5) * bl.r, y = bl.y + (rnd() - 0.5) * bl.r * 0.6;
    c.globalAlpha = a;
    glow(c, x, y, 4, '#ff9b2a', 0.5);
    px(c, x - 3, y, 2, 2, '#ffcf6a'); px(c, x + 2, y, 2, 2, '#ffcf6a');
    dot(c, x - 2, y, '#2a1000'); dot(c, x + 3, y, '#2a1000');
    c.globalAlpha = 1;
  }
}

/* what is left standing once the trunk goes over */
function drawStump(c, g) {
  const B = barkTones(g);
  const rnd = mulberry(31);
  for (let y = GROUND_Y + 6; y > GROUND_Y - 18; y--) {
    const hw = trunkHalfWidth(y);
    px(c, 128 - hw, y, hw * 2, 1, B.mid);
    px(c, 128 - hw, y, 4, 1, B.hi);
    px(c, 128 + hw - 4, y, 4, 1, B.deep);
  }
  for (let i = 0; i < 24; i++) {
    const x = 128 - 26 + i * 2.2;
    px(c, x, GROUND_Y - 18 - Math.floor(rnd() * 9), 3, 12, B.lo);
  }
  for (const dir of [-1, 1]) for (let i = 0; i < 26; i++) {
    const h = Math.max(1, 12 - i * 0.44);
    px(c, 128 + dir * (26 + i) - (dir < 0 ? 2 : 0), GROUND_Y + 6 - h, 2, h, B.lo);
  }
  for (let i = 0; i < 18; i++) dot(c, 110 + rnd() * 36, GROUND_Y - 16 + rnd() * 6, rnd() > 0.5 ? '#ff8a3a' : '#d94a22');
}

/* =========================================================================
   CREATURES, ITEMS, PARTICLES
   ========================================================================= */
function drawSquirrel(c, g) {
  const s = g.squirrel;
  if (!s.active) return;
  const x = Math.round(s.x), y = Math.round(s.y);
  const dk = darkness(g.timeOfDay);
  const shade = col => mix(col, '#0a1226', dk * 0.75);
  const body = shade('#a9713f'), belly = shade('#e8cfa8'), dark = shade('#6d4423');
  const hop = s.moving ? Math.abs(Math.sin(g.t * 12)) * 3 : 0;
  const yy = y - hop;
  const tw = Math.sin(g.t * 6) * 1;

  pcircle(c, x - 8 * s.dir, yy - 6 + tw, 6, dark);
  pcircle(c, x - 9 * s.dir, yy - 11 + tw, 5, body);
  pcircle(c, x - 7 * s.dir, yy - 15 + tw, 4, body);
  pcircle(c, x - 8 * s.dir, yy - 11 + tw, 3, shade('#c98f55'));
  pcircle(c, x, yy - 4, 6, body);
  pcircle(c, x + 1 * s.dir, yy - 3, 4, belly);
  pcircle(c, x + 5 * s.dir, yy - 10, 5, body);
  px(c, x + 2 * s.dir, yy - 15, 2, 4, body);
  px(c, x + 7 * s.dir, yy - 15, 2, 4, body);
  px(c, x + 2 * s.dir, yy - 15, 2, 2, shade('#d9a3c0'));
  px(c, x + 7 * s.dir, yy - 15, 2, 2, shade('#d9a3c0'));
  px(c, x + 7 * s.dir, yy - 11, 2, 2, '#120a04');
  dot(c, x + 8 * s.dir, yy - 11, '#ffffff');
  px(c, x + 9 * s.dir, yy - 8, 2, 1, '#120a04');
  if (s.face === 1) px(c, x + 6 * s.dir, yy - 7, 3, 1, '#3a1c0c');
  px(c, x - 1, yy + 1, 2, 3, dark); px(c, x + 3, yy + 1, 2, 3, dark);
  if (s.holding) drawItemIcon(c, x + 10 * s.dir, yy - 5, s.holding);
}

function drawLeafSprite(c, x, y, col, col2) {
  px(c, x + 1, y, 4, 1, col);
  px(c, x, y + 1, 6, 1, col);
  px(c, x, y + 2, 7, 1, col);
  px(c, x + 1, y + 3, 5, 1, col2);
  px(c, x + 2, y + 4, 3, 1, col2);
  px(c, x + 3, y + 4, 1, 2, '#6b4a30');
}

function drawItemIcon(c, x, y, id) {
  switch (id) {
    case 'acorn': pcircle(c, x, y + 1, 3, '#d9a05b'); px(c, x - 3, y - 3, 7, 3, '#6b4a2a'); px(c, x, y - 5, 1, 2, '#4a3220'); break;
    case 'hat': pcircle(c, x, y, 4, '#c9453b'); px(c, x - 4, y, 9, 2, '#c9453b'); dot(c, x - 1, y - 2, '#fff'); break;
    case 'can': px(c, x - 3, y - 2, 6, 5, '#8a9aa8'); px(c, x + 3, y - 3, 4, 2, '#8a9aa8'); px(c, x - 5, y - 1, 2, 3, '#6d7c88'); break;
    case 'paper': case 'pamph': px(c, x - 4, y - 3, 8, 7, '#e8e2d0'); px(c, x - 3, y - 2, 6, 1, '#5a5a5a'); px(c, x - 3, y, 6, 1, '#8a8a8a'); break;
    case 'lighter': px(c, x - 2, y - 2, 5, 7, '#d64545'); px(c, x - 2, y - 4, 5, 2, '#c9c9c9'); dot(c, x, y - 5, '#ffcf4a'); break;
    case 'diary': px(c, x - 4, y - 3, 8, 7, '#6b4a8a'); px(c, x - 4, y - 3, 2, 7, '#4a3060'); dot(c, x + 1, y, '#e8d24a'); break;
    case 'leaf': drawLeafSprite(c, x - 3, y - 3, '#5fae3c', '#3a7a28'); break;
  }
}

function drawGroundItems(c, g) {
  const dk = darkness(g.timeOfDay);
  for (const it of g.groundLeaves) {
    const bob = Math.sin(g.t * 3 + it.ph) * 0.5;
    c.globalAlpha = 0.3; pellipse(c, it.x + 3, it.y + 6, 5, 2, '#0d1a08'); c.globalAlpha = 1;
    drawLeafSprite(c, it.x, it.y + bob, mix(it.col, '#0a1226', dk * 0.6), mix(it.col2, '#0a1226', dk * 0.6));
  }
  for (const sp of g.saplings) {
    const h = Math.min(26, sp.age * 0.7);
    const sway = Math.sin(g.t * 1.6 + sp.ph) * 1.2;
    px(c, sp.x, GROUND_Y + 6 - h, 2, h, mix('#5a7a32', '#0a1226', dk * 0.7));
    pcircle(c, sp.x + sway, GROUND_Y + 5 - h, 2 + h * 0.24, mix('#4a9235', '#0a1226', dk * 0.7));
    pcircle(c, sp.x + sway - 1, GROUND_Y + 3 - h, 1 + h * 0.16, mix('#6fbc45', '#0a1226', dk * 0.7));
  }
}

function drawParticles(c, g) {
  for (const p of g.particles) {
    if (p.kind === 'leaf') drawLeafSprite(c, p.x, p.y, p.col, p.col2);
    else if (p.kind === 'fire') {
      const cols = ['#fff3b0', '#ffd24a', '#ffa726', '#ef5330', '#8c2b18'];
      px(c, p.x, p.y, p.s, p.s, cols[Math.min(4, Math.floor((1 - p.life / p.max) * 5))]);
    } else if (p.kind === 'smoke') {
      c.globalAlpha = Math.max(0, p.life / p.max) * 0.45;
      pcircle(c, p.x, p.y, p.s, '#8a8a8a'); c.globalAlpha = 1;
    } else if (p.kind === 'heart') {
      px(c, p.x, p.y + 1, 5, 3, '#ff6b8a'); px(c, p.x + 1, p.y, 1, 1, '#ff6b8a');
      px(c, p.x + 3, p.y, 1, 1, '#ff6b8a'); px(c, p.x + 2, p.y + 4, 1, 1, '#ff6b8a');
    } else if (p.kind === 'drop') px(c, p.x, p.y, 1, 3, '#7ec8f2');
    else if (p.kind === 'spark') { glow(c, p.x, p.y, 3, '#ffd24a', 0.4); px(c, p.x, p.y, 1, 1, '#ffe9a0'); }
    else if (p.kind === 'star') {
      c.globalAlpha = Math.max(0, p.life / p.max);
      px(c, p.x, p.y, 1, 1, '#ffffff'); px(c, p.x - 1, p.y, 3, 1, '#ffe9a0'); px(c, p.x, p.y - 1, 1, 3, '#ffe9a0');
      c.globalAlpha = 1;
    } else if (p.kind === 'ash') {
      c.globalAlpha = Math.max(0, p.life / p.max) * 0.8;
      px(c, p.x, p.y, 1, 1, '#b9a99e'); c.globalAlpha = 1;
    } else if (p.kind === 'soul') {
      c.globalAlpha = Math.max(0, p.life / p.max);
      glow(c, p.x, p.y, 5, '#bfe8ff', 0.5); px(c, p.x, p.y, 1, 1, '#ffffff'); c.globalAlpha = 1;
    }
  }
}

function flame(c, x, y, h, seed) {
  const wob = Math.sin(seed * 3.1 + y * 0.4) * 1.5;
  for (let i = 0; i < h; i++) {
    const p = i / h;
    const w = Math.max(1, Math.round((1 - p) * 5));
    const col = p < 0.25 ? '#8c2b18' : p < 0.55 ? '#ef5330' : p < 0.8 ? '#ffa726' : '#ffe066';
    px(c, Math.round(x - w / 2 + wob * p), Math.round(y - i), w, 1, col);
  }
}

/* the warm bloom the fire throws onto the scene — drawn behind the tree */
function drawFireGlow(c, g) {
  if (g.burn <= 0) return;
  if (g.dead && !g.stillBurning) return;
  glow(c, 128, 108, 80 * Math.min(1, g.burn * 1.5), '#ff7a2a', 0.5);
}

function drawFireOnTree(c, g) {
  if (g.burn <= 0) return;
  if (g.dead && !g.stillBurning) return;
  const rnd = mulberry(Math.floor(g.t * 10));
  const front = g.burn;
  for (const bl of CANOPY) {
    if (bl.burn < front || bl.burn > front + 0.2) continue;
    const n = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      flame(c, bl.x + (rnd() * 2 - 1) * bl.r * 0.8, bl.y + (rnd() * 2 - 1) * bl.r * 0.4,
            5 + Math.floor(rnd() * 8), g.t + i);
    }
  }
  // flames hug the sides of the trunk so his face stays readable through them
  const climb = Math.min(1, g.burn * 1.7);
  for (let i = 0; i < 10 + climb * 14; i++) {
    const y = GROUND_Y + 4 - rnd() * 62 * climb;
    const hw = trunkHalfWidth(y);
    const edge = 0.62 + rnd() * 0.45;
    flame(c, 128 + (rnd() > 0.5 ? 1 : -1) * hw * edge, y, 4 + Math.floor(rnd() * 9), g.t + i * 0.7);
  }
  // a low fire licking round the roots
  for (let i = 0; i < 12; i++) {
    flame(c, 128 + (rnd() * 2 - 1) * 40, GROUND_Y + 4 + rnd() * 3, 4 + Math.floor(rnd() * 7), g.t + i);
  }
  for (let i = 0; i < 20; i++) px(c, 106 + rnd() * 44, GROUND_Y + rnd() * 6, 1, 1, rnd() > 0.5 ? '#ffd24a' : '#ef5330');
}

function drawPond(c, g) {
  const dk = darkness(g.timeOfDay);
  const base = mix('#3f8fd0', '#0a1226', dk * 0.75), hi = mix('#8fd0f2', '#0a1226', dk * 0.6);
  pellipse(c, 30, GROUND_Y + 20, 22, 7, mix(base, '#000000', 0.35));
  pellipse(c, 30, GROUND_Y + 19, 21, 6, base);
  for (let i = 0; i < 5; i++) {
    const w = 4 + ((Math.sin(g.t * 1.4 + i) * 0.5 + 0.5) * 9 | 0);
    px(c, 22 + i * 4 - w / 2, GROUND_Y + 15 + i * 2, w, 1, hi);
  }
  if (g.flags.lighterGone) px(c, 29, GROUND_Y + 21, 3, 2, '#7a2a2a');
}

function drawOverlay(c, g) {
  if (g.season === 'winter') {
    const rnd = mulberry(3);
    for (let i = 0; i < 70; i++) {
      const sx = (rnd() * W + g.t * (6 + rnd() * 10)) % W;
      const sy = (rnd() * H + g.t * (12 + rnd() * 12)) % H;
      dot(c, sx, sy, rnd() > 0.7 ? '#ffffff' : '#dfeaf5');
    }
  }
  if (g.raining > 0) {
    const rnd = mulberry(11);
    for (let i = 0; i < 60; i++) {
      const sx = (rnd() * W + g.t * 30) % W;
      const sy = (rnd() * H + g.t * 170) % H;
      px(c, sx, sy, 1, 3, '#9ad4f2');
    }
  }
  // vignette: always a little, more when he is staring at you
  const vig = 0.22 + (g.stare || 0) * 0.4;
  c.globalAlpha = vig;
  for (let i = 0; i < 22; i++) {
    const a = i / 22;
    c.globalAlpha = vig * a * 0.5;
    px(c, i, 0, 1, H, '#000000'); px(c, W - 1 - i, 0, 1, H, '#000000');
    px(c, 0, i, W, 1, '#000000'); px(c, 0, H - 1 - i, W, 1, '#000000');
  }
  c.globalAlpha = 1;
}

/* -------------------- the morning after -------------------- */
function drawAshScene(c, g) {
  const bands = ['#1a1218', '#241a1e', '#332224', '#4a2e2a', '#6b3f31'];
  for (let y = 0; y < GROUND_Y; y++) {
    const f = y / (GROUND_Y - 1) * (bands.length - 1);
    const i = Math.min(bands.length - 2, Math.floor(f));
    px(c, 0, y, W, 1, mix(bands[i], bands[i + 1], f - i));
  }
  for (const t of BG_TREES) {
    const base = GROUND_Y - 2 + t.depth * 6;
    pellipse(c, t.x, base - t.h, t.r, t.h * 0.42, mix('#2a1c1a', '#6b3f31', t.depth * 0.5));
  }
  px(c, 0, GROUND_Y, W, H - GROUND_Y, '#241d1a');
  px(c, 0, GROUND_Y + 16, W, H, '#1a1513');
  c.globalAlpha = 0.6;
  for (let y = 0; y <= 12; y++) {
    const hw = Math.round(Math.sqrt(Math.max(0, 1 - (y / 12) ** 2)) * 60);
    if (hw > 0) px(c, 128 - hw, GROUND_Y + 2 + y, hw * 2, 1, '#0e0a09');
  }
  c.globalAlpha = 1;

  const rnd = mulberry(77);
  for (let y = GROUND_Y + 6; y > GROUND_Y - 26; y--) {
    const k = (GROUND_Y - y) / 32;
    const hw = Math.round(30 - k * 8);
    px(c, 128 - hw, y, hw * 2, 1, '#2a2220');
    px(c, 128 - hw, y, 3, 1, '#171211');
    px(c, 128 + hw - 3, y, 3, 1, '#3a2f2c');
  }
  for (let i = 0; i < 22; i++) {
    const x = 100 + i * 2.6;
    px(c, x, GROUND_Y - 26 - (2 + Math.floor(rnd() * 11)), 3, 14, '#241d1b');
  }
  for (const dir of [-1, 1]) for (let i = 0; i < 22; i++) {
    const h = Math.max(1, 8 - i * 0.36);
    px(c, 128 + dir * (28 + i) - (dir < 0 ? 2 : 0), GROUND_Y + 6 - h, 2, h, '#1e1817');
  }
  const glowAmt = 0.55 + 0.45 * Math.sin(g.t * 1.7);
  glow(c, 128, GROUND_Y - 8, 26, '#ff6a20', 0.18 * glowAmt);
  for (let i = 0; i < 26; i++) {
    const x = 108 + Math.floor(rnd() * 40), y = GROUND_Y - 24 + Math.floor(rnd() * 28);
    c.globalAlpha = glowAmt * (0.4 + rnd() * 0.6);
    dot(c, x, y, rnd() > 0.5 ? '#ff8a3a' : '#d94a22');
    c.globalAlpha = 1;
  }
  for (let i = 0; i < 80; i++) {
    const x = (rnd() * W + g.t * (3 + rnd() * 5)) % W;
    const y = (rnd() * H - g.t * (8 + rnd() * 14) + H * 3) % H;
    c.globalAlpha = 0.25 + rnd() * 0.4;
    dot(c, x, y, rnd() > 0.7 ? '#c9b8ae' : '#7a6a62');
    c.globalAlpha = 1;
  }
  for (let i = 0; i < 24; i++) {
    const p = i / 24;
    const x = 128 + Math.sin(g.t * 0.8 + p * 4) * (4 + p * 18);
    c.globalAlpha = 0.20 * (1 - p);
    pcircle(c, x, GROUND_Y - 32 - p * 100, 3 + p * 10, '#8a7d76');
    c.globalAlpha = 1;
  }
}
